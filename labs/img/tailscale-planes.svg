<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t d"><title id="t">Tailscale control plane and data plane</title><desc id="d">An identity provider sits above Tailscale coordination, which gives identity, keys, endpoints and policy to both A, ts-client, and B, ts-server. A and B exchange encrypted packets with each other directly or through a relay.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="298" rx="16"/>
<rect class="box" x="300" y="20" width="200" height="44" rx="10"/><text class="t" x="400" y="47" text-anchor="middle">Identity provider</text>
<path class="line" d="M400 64 V90"/>
<rect class="net" x="270" y="90" width="260" height="50" rx="10"/><text class="t" x="400" y="120" text-anchor="middle">Tailscale coordination</text>
<path class="zone" d="M320 140 L150 220 M480 140 L650 220"/>
<text class="s" x="400" y="190" text-anchor="middle">identity, keys, endpoints, policy</text>
<rect class="net" x="40" y="220" width="220" height="50" rx="10"/><text class="t" x="150" y="250" text-anchor="middle">A: ts-client</text>
<rect class="net" x="540" y="220" width="220" height="50" rx="10"/><text class="t" x="650" y="250" text-anchor="middle">B: ts-server</text>
<path class="line" d="M260 245 H540"/>
<text class="l" x="400" y="235" text-anchor="middle">encrypted</text>
<text class="s" x="400" y="266" text-anchor="middle">direct or relayed</text>
</svg>
