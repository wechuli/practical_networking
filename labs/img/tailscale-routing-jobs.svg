<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" role="img" aria-labelledby="t d"><title id="t">Subnet routing versus an exit node</title><desc id="d">Private service: A reaches B over WireGuard, and B, acting as a subnet router, forwards over an isolated veth to C at 192.0.2.2:8080, which runs no Tailscale client. Internet egress: A reaches B over WireGuard, and B, acting as an exit node, forwards over its ordinary internet route to a public HTTPS service.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="248" rx="16"/>
<text class="zl" x="20" y="34">Private service</text>
<rect class="net" x="20" y="46" width="80" height="60" rx="10"/><text class="t" x="60" y="81" text-anchor="middle">A</text>
<text class="s" x="160" y="68" text-anchor="middle">WireGuard</text><path class="arrow" d="M100 76 H220"/>
<rect class="net" x="220" y="46" width="140" height="60" rx="10"/><text class="t" x="290" y="70" text-anchor="middle">B</text><text class="s" x="290" y="92" text-anchor="middle">subnet router</text>
<text class="s" x="450" y="68" text-anchor="middle">isolated veth</text><path class="arrow" d="M360 76 H540"/>
<rect class="box" x="540" y="46" width="240" height="60" rx="10"/><text class="m" x="660" y="70" text-anchor="middle">C: 192.0.2.2:8080</text><text class="s" x="660" y="92" text-anchor="middle">no Tailscale client</text>
<text class="zl" x="20" y="154">Internet egress</text>
<rect class="net" x="20" y="166" width="80" height="60" rx="10"/><text class="t" x="60" y="201" text-anchor="middle">A</text>
<text class="s" x="160" y="188" text-anchor="middle">WireGuard</text><path class="arrow" d="M100 196 H220"/>
<rect class="net" x="220" y="166" width="140" height="60" rx="10"/><text class="t" x="290" y="190" text-anchor="middle">B</text><text class="s" x="290" y="212" text-anchor="middle">exit node</text>
<text class="s" x="450" y="188" text-anchor="middle">ordinary internet route</text><path class="arrow" d="M360 196 H540"/>
<rect class="box" x="540" y="166" width="240" height="60" rx="10"/><text class="t" x="660" y="201" text-anchor="middle">public HTTPS service</text>
</svg>
