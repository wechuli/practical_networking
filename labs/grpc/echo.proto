syntax = "proto3";
package course;
import "google/protobuf/wrappers.proto";

service Echo {
  rpc Echo(google.protobuf.StringValue) returns (google.protobuf.StringValue);
  rpc Slow(google.protobuf.StringValue) returns (google.protobuf.StringValue);
  rpc Watch(google.protobuf.StringValue) returns (stream google.protobuf.StringValue);
}
