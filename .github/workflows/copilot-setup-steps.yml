name: Copilot setup steps

# Prepares the environment the Copilot coding agent works in.
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: labs/go/go.mod
          cache-dependency-path: labs/go/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install site dependencies
        run: npm ci
      - name: Show versions
        run: go version && node --version
      - name: Course check
        run: node tools/check-course.mjs
      - name: Site build
        run: npm run docs:build
