[book]
title = "Practical Networking"
authors = ["Paul Wechuli"]
language = "en"
src = "."

[build]
create-missing = false
build-dir = "book"
use-default-preprocessors = false

[preprocessor.links]

[output.html]
git-repository-url = "https://github.com/wechuli/practical_networking"
edit-url-template = "https://github.com/wechuli/practical_networking/edit/main/{path}"
site-url = "/practical_networking/"
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true

[output.html.search]
enable = true
