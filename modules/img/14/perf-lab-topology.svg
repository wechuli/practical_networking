<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" role="img" aria-labelledby="t d"><title id="t">The performance lab topology</title><desc id="d">The client at 198.18.100.10 connects through a router running pathlab, which adds 25 ms each way and applies the rate, queue and loss you set, to the server at 198.18.101.10. The server runs iperf3 on port 5201, api.perf.test on port 8443 (2 KB responses with 100 ms of added work) and files.perf.test on ports 9443 and 8080 (4 MiB).</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="228" rx="16"/>
<rect class="net" x="20" y="40" width="160" height="70" rx="10"/><text class="t" x="100" y="68" text-anchor="middle">client</text><text class="m" x="100" y="92" text-anchor="middle">198.18.100.10</text>
<path class="line" d="M180 75 H240"/>
<rect class="net" x="240" y="30" width="270" height="90" rx="10"/><text class="t" x="375" y="56" text-anchor="middle">router</text><text class="s" x="375" y="80" text-anchor="middle">pathlab: 25 ms each way</text><text class="s" x="375" y="100" text-anchor="middle">rate, queue, loss as set</text>
<path class="line" d="M510 75 H570"/>
<rect class="net" x="570" y="20" width="210" height="190" rx="10"/><text class="t" x="675" y="46" text-anchor="middle">server</text><text class="m" x="675" y="68" text-anchor="middle">198.18.101.10</text>
<text class="m" x="586" y="100">iperf3 :5201</text>
<text class="m" x="586" y="126">api.perf.test :8443</text><text class="s" x="586" y="144">2 KB, +100 ms</text>
<text class="m" x="586" y="172">files.perf.test</text><text class="s" x="586" y="190">:9443 / :8080 (4 MiB)</text>
</svg>
