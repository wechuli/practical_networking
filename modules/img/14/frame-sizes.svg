<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d"><title id="t">Sizes at each layer</title><desc id="d">An Ethernet frame is a 14-byte header, up to 1500 bytes of payload (the MTU) and a 4-byte FCS, plus 4 bytes per VLAN tag. The IP packet fills at most the MTU: a 20-byte (IPv4) or 40-byte (IPv6) header and its payload. The TCP segment sits in the IP payload: a 20-byte header and at most MSS bytes of data, where MSS is MTU minus IP header minus 20, so 1460 for IPv4 and 1440 for IPv6, and 1448 bytes of data per full segment with timestamps.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="378" rx="16"/>
<text class="l" x="24" y="72">Ethernet frame</text>
<rect class="l2" x="150" y="50" width="130" height="52" rx="10"/><text class="l" x="215" y="72" text-anchor="middle">Ethernet header</text><text class="s" x="215" y="90" text-anchor="middle">14 bytes</text>
<rect class="l3" x="280" y="50" width="390" height="52" rx="10"/><text class="t" x="475" y="73" text-anchor="middle">payload: up to 1500 bytes (MTU)</text><text class="s" x="475" y="91" text-anchor="middle">the IP packet</text>
<rect class="l2" x="670" y="50" width="110" height="52" rx="10"/><text class="l" x="725" y="72" text-anchor="middle">FCS</text><text class="s" x="725" y="90" text-anchor="middle">4 bytes</text>
<text class="s" x="152" y="124">+ 4 per VLAN tag</text>
<path class="line" d="M280 102 V150 M670 102 V150"/>
<text class="l" x="24" y="172">IP packet</text><text class="s" x="24" y="190">≤ MTU</text>
<rect class="l3" x="280" y="150" width="190" height="52" rx="10"/><text class="l" x="375" y="172" text-anchor="middle">IP header</text><text class="s" x="375" y="190" text-anchor="middle">20 (IPv4) or 40 (IPv6)</text>
<rect class="l4" x="470" y="150" width="200" height="52" rx="10"/><text class="l" x="570" y="181" text-anchor="middle">IP payload</text>
<path class="line" d="M470 202 V250 M670 202 V250"/>
<text class="l" x="24" y="272">TCP segment</text>
<rect class="l4" x="470" y="250" width="100" height="52" rx="10"/><text class="l" x="520" y="272" text-anchor="middle">TCP header</text><text class="s" x="520" y="290" text-anchor="middle">20 bytes</text>
<rect class="l7" x="570" y="250" width="100" height="52" rx="10"/><text class="l" x="620" y="272" text-anchor="middle">data</text><text class="s" x="620" y="290" text-anchor="middle">≤ MSS</text>
<text class="m" x="24" y="334">MSS = MTU − IP header − 20 = 1460 (IPv4), 1440 (IPv6)</text>
<text class="s" x="24" y="356">With TCP timestamps: 1448 bytes of data per full segment.</text>
</svg>
