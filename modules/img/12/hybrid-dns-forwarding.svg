<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t d"><title id="t">Hybrid and cross-cloud DNS forwarding</title><desc id="d">An on-premises or other-cloud resolver forwards the internal.example zone to an inbound endpoint in the VPC or VNet: a Route 53 Resolver inbound endpoint on AWS, a DNS Private Resolver inbound endpoint on Azure, or an inbound server policy on GCP. In the other direction, cloud workloads that need on-premises names use an outbound endpoint and a forwarding rule to reach the on-premises DNS servers.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="298" rx="16"/>
<rect class="box" x="24" y="40" width="230" height="70" rx="10"/><text class="t" x="139" y="70" text-anchor="middle">On-prem / other cloud</text><text class="s" x="139" y="92" text-anchor="middle">resolver</text>
<text class="s" x="337" y="62" text-anchor="middle">forward</text><text class="m" x="337" y="80" text-anchor="middle">"internal.example"</text>
<path class="arrow" d="M254 90 H418"/>
<rect class="net" x="420" y="30" width="356" height="120" rx="10"/>
<text class="t" x="598" y="56" text-anchor="middle">Inbound endpoint in the VPC/VNet</text>
<text class="s" x="440" y="82">AWS: Route 53 Resolver inbound endpoint</text>
<text class="s" x="440" y="102">Azure: DNS Private Resolver inbound endpoint</text>
<text class="s" x="440" y="122">(GCP: inbound server policy)</text>
<rect class="net" x="24" y="190" width="230" height="70" rx="10"/><text class="t" x="139" y="220" text-anchor="middle">Cloud workloads</text><text class="s" x="139" y="242" text-anchor="middle">needing on-prem names</text>
<text class="s" x="337" y="212" text-anchor="middle">outbound endpoint</text><text class="s" x="337" y="230" text-anchor="middle">+ forwarding rule</text>
<path class="arrow" d="M254 240 H418"/>
<rect class="box" x="420" y="190" width="356" height="70" rx="10"/><text class="t" x="598" y="230" text-anchor="middle">On-prem DNS servers</text>
</svg>
