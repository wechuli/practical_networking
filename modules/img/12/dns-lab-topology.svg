<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" role="img" aria-labelledby="t d"><title id="t">The DNS lab topology</title><desc id="d">A central router named net connects every node. On the left: root 198.18.50.2 serving the root zone, tld 198.18.51.2 serving test., auth1 198.18.52.2 and .3 serving corp.test in two views plus secure.test and expired.test, and auth2 198.18.54.2 serving shop.test. On the right: resolver 198.18.60.2, a validating Unbound that serves 198.18.61.0/24 only; public 198.18.62.2, an Unbound that serves anyone; the office client 198.18.61.10 using the resolver; and the cloud client 198.18.63.10 using public. The router black-holes 198.18.53.0/24, used by slow.test.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="368" rx="16"/>
<rect class="net" x="24" y="30" width="250" height="52" rx="10"/><text class="t" x="38" y="53">root  <tspan class="m">"."</tspan></text><text class="m" x="38" y="72">198.18.50.2</text>
<rect class="net" x="24" y="92" width="250" height="52" rx="10"/><text class="t" x="38" y="115">tld  <tspan class="m">"test."</tspan></text><text class="m" x="38" y="134">198.18.51.2</text>
<rect class="net" x="24" y="154" width="250" height="102" rx="10"/><text class="t" x="38" y="177">auth1</text><text class="m" x="38" y="196">198.18.52.2/.3</text><text class="s" x="38" y="218">corp.test (2 views),</text><text class="s" x="38" y="236">secure.test, expired.test</text>
<rect class="net" x="24" y="266" width="250" height="52" rx="10"/><text class="t" x="38" y="289">auth2  <tspan class="s">shop.test</tspan></text><text class="m" x="38" y="308">198.18.54.2</text>
<path class="line" d="M274 56 H330"/><path class="line" d="M274 118 H330"/><path class="line" d="M274 205 H330"/><path class="line" d="M274 292 H330"/>
<rect class="net" x="330" y="30" width="140" height="300" rx="10" style="stroke-width:2.2"/><text class="t" x="400" y="58" text-anchor="middle">net</text><text class="s" x="400" y="78" text-anchor="middle">(router)</text>
<rect class="warn" x="342" y="236" width="116" height="80" rx="8"/><text class="s" x="400" y="258" text-anchor="middle">198.18.53.0/24</text><text class="s" x="400" y="276" text-anchor="middle">is black-holed</text><text class="s" x="400" y="294" text-anchor="middle">(slow.test)</text>
<path class="line" d="M470 75 H526"/><path class="line" d="M470 175 H526"/><path class="line" d="M470 254 H526"/><path class="line" d="M470 314 H526"/>
<rect class="net" x="526" y="30" width="250" height="90" rx="10"/><text class="t" x="540" y="53">resolver</text><text class="m" x="540" y="72">198.18.60.2</text><text class="s" x="540" y="92">Unbound, validating,</text><text class="s" x="540" y="110">serves 198.18.61.0/24 only</text>
<rect class="net" x="526" y="140" width="250" height="70" rx="10"/><text class="t" x="540" y="163">public</text><text class="m" x="540" y="182">198.18.62.2</text><text class="s" x="540" y="200">Unbound, serves anyone</text>
<rect class="box" x="526" y="228" width="250" height="52" rx="10"/><text class="t" x="540" y="251">office</text><text class="m" x="540" y="270">198.18.61.10 → resolver</text>
<rect class="box" x="526" y="290" width="250" height="52" rx="10"/><text class="t" x="540" y="313">cloud</text><text class="m" x="540" y="332">198.18.63.10 → public</text>
</svg>
