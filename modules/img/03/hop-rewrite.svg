<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 356" role="img" aria-labelledby="t d"><title id="t">What changes at each hop</title><desc id="d">Host A at 10.0.1.5 sends to host B at 10.0.2.7 through a router, as seen in captures on each link. On link 1, from A to the router's eth0, the Ethernet source is A's MAC and the destination is router eth0's MAC. On link 2, from router eth1 to B, the Ethernet source is router eth1's MAC and the destination is B's MAC: both are rewritten. The IP source 10.0.1.5 and destination 10.0.2.7 are unchanged, and the TTL is decremented from 64 to 63.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>

<rect class="bg" x="1" y="1" width="798" height="354" rx="16"/>
<text class="zl" x="24" y="30">Host A (10.0.1.5) → router → Host B (10.0.2.7), as seen in captures on each link</text>
<rect class="net" x="40" y="48" width="160" height="50" rx="10"/><text class="t" x="120" y="70" text-anchor="middle">Host A</text><text class="m" x="120" y="88" text-anchor="middle">10.0.1.5</text>
<rect class="net" x="320" y="48" width="160" height="50" rx="10"/><text class="t" x="400" y="78" text-anchor="middle">Router</text>
<rect class="net" x="600" y="48" width="160" height="50" rx="10"/><text class="t" x="680" y="70" text-anchor="middle">Host B</text><text class="m" x="680" y="88" text-anchor="middle">10.0.2.7</text>
<path class="arrow" d="M200 80 H318"/><path class="arrow" d="M480 80 H598"/>
<text class="l" x="260" y="70" text-anchor="middle">Link 1</text><text class="l" x="540" y="70" text-anchor="middle">Link 2</text>
<text class="l" x="261" y="140" text-anchor="middle">Link 1: A → router eth0</text>
<text class="l" x="517" y="140" text-anchor="middle">Link 2: router eth1 → B</text>
<rect class="l2" x="20" y="154" width="110" height="30" rx="6"/><text class="m" x="32" y="174">Eth src</text><rect class="l2" x="136" y="154" width="250" height="30" rx="6"/><text class="s" x="150" y="174">A's MAC</text><rect class="l2" x="392" y="154" width="250" height="30" rx="6"/><text class="s" x="406" y="174">router eth1's MAC</text><text class="l" x="654" y="174">← rewritten</text>
<rect class="l2" x="20" y="190" width="110" height="30" rx="6"/><text class="m" x="32" y="210">Eth dst</text><rect class="l2" x="136" y="190" width="250" height="30" rx="6"/><text class="s" x="150" y="210">router eth0's MAC</text><rect class="l2" x="392" y="190" width="250" height="30" rx="6"/><text class="s" x="406" y="210">B's MAC</text><text class="l" x="654" y="210">← rewritten</text>
<rect class="l3" x="20" y="226" width="110" height="30" rx="6"/><text class="m" x="32" y="246">IP  src</text><rect class="l3" x="136" y="226" width="250" height="30" rx="6"/><text class="s" x="150" y="246">10.0.1.5</text><rect class="l3" x="392" y="226" width="250" height="30" rx="6"/><text class="s" x="406" y="246">10.0.1.5</text><text class="l" x="654" y="246">← unchanged</text>
<rect class="l3" x="20" y="262" width="110" height="30" rx="6"/><text class="m" x="32" y="282">IP  dst</text><rect class="l3" x="136" y="262" width="250" height="30" rx="6"/><text class="s" x="150" y="282">10.0.2.7</text><rect class="l3" x="392" y="262" width="250" height="30" rx="6"/><text class="s" x="406" y="282">10.0.2.7</text><text class="l" x="654" y="282">← unchanged</text>
<rect class="l3" x="20" y="298" width="110" height="30" rx="6"/><text class="m" x="32" y="318">TTL</text><rect class="l3" x="136" y="298" width="250" height="30" rx="6"/><text class="s" x="150" y="318">64</text><rect class="l3" x="392" y="298" width="250" height="30" rx="6"/><text class="s" x="406" y="318">63</text><text class="l" x="654" y="318">← decremented</text>
</svg>
