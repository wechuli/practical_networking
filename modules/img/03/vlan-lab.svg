<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d"><title id="t">VLAN-aware switch in the vlan lab</title><desc id="d">Bridge br0 with vlan_filtering has three ports. Port tagged is in VLAN 10 tagged and carries 802.1Q tag 10 to interface eth0.10 at 10.42.10.1. Port access has PVID VLAN 10 and sends untagged frames to eth0 at 10.42.10.2. Port other has PVID VLAN 20 and sends untagged frames to eth0 at 10.42.10.3. The first two hosts are in the same VLAN and can talk; the third is in the same subnet but another VLAN, so it is unreachable.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>

<rect class="bg" x="1" y="1" width="798" height="328" rx="16"/>
<text class="zl" x="24" y="30">VLAN-aware switch (this module's vlan lab)</text>
<rect class="net" x="120" y="42" width="600" height="98" rx="10"/><text class="t" x="420" y="64" text-anchor="middle">br0 (vlan_filtering)</text>
<rect class="l2" x="140" y="78" width="160" height="48" rx="8"/><text class="m" x="220" y="98" text-anchor="middle">port "tagged"</text><text class="s" x="220" y="116" text-anchor="middle">VLAN 10 tagged</text>
<rect class="l2" x="320" y="78" width="160" height="48" rx="8"/><text class="m" x="400" y="98" text-anchor="middle">port "access"</text><text class="s" x="400" y="116" text-anchor="middle">VLAN 10 PVID</text>
<rect class="l2" x="520" y="78" width="180" height="48" rx="8"/><text class="m" x="610" y="98" text-anchor="middle">port "other"</text><text class="s" x="610" y="116" text-anchor="middle">VLAN 20 PVID</text>
<path class="line" d="M220 140 V196 M400 140 V196 M610 140 V196"/>
<text class="s" x="230" y="172">802.1Q tag 10</text>
<text class="s" x="410" y="172">untagged</text>
<text class="s" x="620" y="172">untagged</text>
<rect class="net" x="140" y="196" width="160" height="48" rx="10"/><text class="m" x="220" y="216" text-anchor="middle">eth0.10</text><text class="m" x="220" y="234" text-anchor="middle">10.42.10.1</text>
<rect class="net" x="320" y="196" width="160" height="48" rx="10"/><text class="m" x="400" y="216" text-anchor="middle">eth0</text><text class="m" x="400" y="234" text-anchor="middle">10.42.10.2</text>
<rect class="net" x="520" y="196" width="180" height="48" rx="10"/><text class="m" x="610" y="216" text-anchor="middle">eth0</text><text class="m" x="610" y="234" text-anchor="middle">10.42.10.3</text>
<rect class="ok" x="140" y="262" width="340" height="34" rx="8"/><text class="l" x="310" y="284" text-anchor="middle">same VLAN: OK</text>
<rect class="warn" x="520" y="262" width="180" height="48" rx="8"/><text class="s" x="610" y="281" text-anchor="middle">same subnet, other VLAN:</text><text class="l" x="610" y="299" text-anchor="middle">unreachable</text>
</svg>
