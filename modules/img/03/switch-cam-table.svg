<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 444" role="img" aria-labelledby="t d"><title id="t">Switch forwarding with a CAM table</title><desc id="d">A switch's CAM table maps MAC addresses to ports with an age: 00:1a:2b:3c:4d:5e on port 1 (120 s), 00:1a:2b:3c:4d:6f on port 2 (45 s) and 00:1a:2b:3c:4d:7a on port 4 (5 s). A frame for 00:1a:2b:3c:4d:6f is looked up, found on port 2, and forwarded only to port 2. A frame for the unknown 00:1a:2b:3c:4d:99 is not in the table, so it is flooded to all ports except the one it arrived on, and the switch learns source MACs from arriving frames, including any later response. Entries expire if the MAC isn't seen again; Linux bridges default to 300 s (ageing_time), and a moved device is unreachable at its old port until it sends a frame from the new one or the entry ages out.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>

<rect class="bg" x="1" y="1" width="798" height="442" rx="16"/>
<text class="zl" x="24" y="30">Switch forwarding — how a switch uses MAC addresses</text>
<text class="l" x="210" y="58">CAM Table (Content Addressable Memory):</text>
<rect class="l2" x="210" y="68" width="200" height="28"/><rect class="l2" x="410" y="68" width="70" height="28"/><rect class="l2" x="480" y="68" width="110" height="28"/>
<text class="l" x="222" y="87">MAC Address</text><text class="l" x="445" y="87" text-anchor="middle">Port</text><text class="l" x="535" y="87" text-anchor="middle">Age</text>
<rect class="box" x="210" y="96" width="200" height="28"/><rect class="box" x="410" y="96" width="70" height="28"/><rect class="box" x="480" y="96" width="110" height="28"/><text class="m" x="222" y="115">00:1a:2b:3c:4d:5e</text><text class="m" x="445" y="115" text-anchor="middle">1</text><text class="m" x="535" y="115" text-anchor="middle">120s</text>
<rect class="box" x="210" y="124" width="200" height="28"/><rect class="box" x="410" y="124" width="70" height="28"/><rect class="box" x="480" y="124" width="110" height="28"/><text class="m" x="222" y="143">00:1a:2b:3c:4d:6f</text><text class="m" x="445" y="143" text-anchor="middle">2</text><text class="m" x="535" y="143" text-anchor="middle">45s</text>
<rect class="box" x="210" y="152" width="200" height="28"/><rect class="box" x="410" y="152" width="70" height="28"/><rect class="box" x="480" y="152" width="110" height="28"/><text class="m" x="222" y="171">00:1a:2b:3c:4d:7a</text><text class="m" x="445" y="171" text-anchor="middle">4</text><text class="m" x="535" y="171" text-anchor="middle">5s</text>
<rect class="ok" x="20" y="204" width="370" height="156" rx="10"/>
<text class="s" x="36" y="228">Frame arrives destined for</text>
<text class="m" x="36" y="248">00:1a:2b:3c:4d:6f</text>
<text class="s" x="36" y="276">→ Switch looks up MAC in CAM table</text>
<text class="s" x="36" y="296">→ Found on Port 2</text>
<text class="l" x="36" y="316">→ Forward ONLY to Port 2</text>
<rect class="box" x="410" y="204" width="370" height="156" rx="10"/>
<text class="s" x="426" y="228">Frame arrives destined for</text>
<text class="m" x="426" y="248">00:1a:2b:3c:4d:99 (unknown)</text>
<text class="s" x="426" y="276">→ Not in CAM table</text>
<text class="l" x="426" y="296">→ Flood to ALL ports except the one</text>
<text class="l" x="440" y="312">it arrived on</text>
<text class="s" x="426" y="332">→ Learn source MACs on arriving frames,</text>
<text class="s" x="440" y="348">including any later response</text>
<rect class="box" x="20" y="374" width="760" height="54" rx="10"/>
<text class="s" x="36" y="396">Entries expire if the MAC isn't seen again: Linux bridges default to 300 s (ageing_time). A moved</text>
<text class="s" x="36" y="414">device is unreachable at its old port until it sends a frame from the new one, or the entry ages out.</text>
</svg>
