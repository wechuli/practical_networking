<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" role="img" aria-labelledby="t d"><title id="t">Lab topology: your lab machine</title><desc id="d">Your lab machine has three interfaces to read and interpret: lo at 127.0.0.1/8, eth0 (or ens3) with your LAN IP and prefix, and docker0 at 172.17.0.1/16 if Docker is installed. eth0 leads to the default gateway, which leads to the internet.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>

<rect class="bg" x="1" y="1" width="798" height="370" rx="16"/>
<text class="zl" x="24" y="30">Lab topology</text>
<rect class="net" x="180" y="44" width="440" height="148" rx="10"/>
<text class="t" x="400" y="70" text-anchor="middle">Your Lab Machine</text>
<text class="m" x="204" y="100">lo: 127.0.0.1/8</text>
<text class="m" x="204" y="122">eth0 (or ens3): &lt;your LAN IP&gt;/&lt;prefix&gt;</text>
<text class="m" x="204" y="144">docker0: 172.17.0.1/16 (if Docker is installed)</text>
<text class="s" x="204" y="174">You will read and interpret each of these.</text>
<path class="arrow" d="M400 192 V240"/><text class="m" x="412" y="220">eth0</text>
<rect class="net" x="300" y="242" width="200" height="40" rx="10"/><text class="t" x="400" y="267" text-anchor="middle">Default Gateway</text>
<path class="arrow" d="M400 282 V310"/>
<rect class="box" x="300" y="312" width="200" height="40" rx="10"/><text class="t" x="400" y="337" text-anchor="middle">Internet</text>
</svg>
