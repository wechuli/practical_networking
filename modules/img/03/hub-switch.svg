<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="t d"><title id="t">Hub versus switch forwarding</title><desc id="d">Top: a hub, layer 1 with no intelligence. A sends a frame to B through the hub, and C and D also receive it; they cannot send at the same time, so every device on the hub is in one collision domain. Bottom: a switch, layer 2 with MAC-based forwarding. A (MAC aa:aa) on port 1 sends a frame to B (MAC bb:bb) on port 2. The switch looks up bb:bb in its CAM table (aa:aa on port 1, bb:bb on port 2), forwards only to port 2, and C and D on ports 3 and 4 see nothing.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>

<rect class="bg" x="1" y="1" width="798" height="638" rx="16"/>
<rect class="zone" x="16" y="16" width="768" height="290" rx="12"/>
<text class="zl" x="32" y="42">Hub — Layer 1, no intelligence</text>
<text class="s" x="32" y="62">A sends a frame to B</text>
<path class="line" d="M240 110 H330 M430 110 H520 M380 126 V164 M380 196 V226"/>
<rect class="net" x="180" y="94" width="60" height="32" rx="8"/><text class="l" x="210" y="115" text-anchor="middle">A</text>
<rect class="box" x="330" y="94" width="100" height="32" rx="8"/><text class="l" x="380" y="115" text-anchor="middle">HUB</text>
<rect class="net" x="520" y="94" width="60" height="32" rx="8"/><text class="l" x="550" y="115" text-anchor="middle">B</text>
<rect class="net" x="350" y="164" width="60" height="32" rx="8"/><text class="l" x="380" y="185" text-anchor="middle">C</text>
<rect class="net" x="350" y="226" width="60" height="32" rx="8"/><text class="l" x="380" y="247" text-anchor="middle">D</text>
<text class="s" x="424" y="178">← Also receives the frame.</text><text class="s" x="440" y="196">Cannot send simultaneously.</text>
<text class="s" x="424" y="247">← Also receives the frame.</text>
<text class="l" x="32" y="288">Collision domain = every device on the hub.</text>
<rect class="zone" x="16" y="322" width="768" height="302" rx="12"/>
<text class="zl" x="32" y="348">Switch — Layer 2, MAC-based forwarding</text>
<text class="s" x="32" y="368">A (MAC aa:aa) sends frame to B (MAC bb:bb)</text>
<rect class="net" x="280" y="384" width="240" height="120" rx="10"/><text class="t" x="400" y="450" text-anchor="middle">SWITCH</text>
<rect class="box" x="292" y="396" width="72" height="26" rx="6"/><text class="s" x="328" y="414" text-anchor="middle">Port 1</text>
<rect class="box" x="436" y="396" width="72" height="26" rx="6"/><text class="s" x="472" y="414" text-anchor="middle">Port 2</text>
<rect class="box" x="292" y="466" width="72" height="26" rx="6"/><text class="s" x="328" y="484" text-anchor="middle">Port 3</text>
<rect class="box" x="436" y="466" width="72" height="26" rx="6"/><text class="s" x="472" y="484" text-anchor="middle">Port 4</text>
<path class="arrow" d="M210 409 H290"/><path class="arrow" d="M364 409 H434"/><path class="arrow" d="M508 409 H588"/>
<path class="line" d="M210 479 H292 M508 479 H590"/>
<rect class="net" x="130" y="393" width="80" height="32" rx="8"/><text class="l" x="170" y="414" text-anchor="middle">A: aa:aa</text>
<rect class="net" x="590" y="393" width="80" height="32" rx="8"/><text class="l" x="630" y="414" text-anchor="middle">B: bb:bb</text>
<rect class="net" x="130" y="463" width="80" height="32" rx="8"/><text class="l" x="170" y="484" text-anchor="middle">C</text>
<rect class="net" x="590" y="463" width="80" height="32" rx="8"/><text class="l" x="630" y="484" text-anchor="middle">D</text>
<text class="s" x="32" y="534">Switch looks up bb:bb → Port 2</text>
<text class="l" x="32" y="554">Forwards ONLY to Port 2</text>
<text class="s" x="32" y="574">C and D see nothing.</text>
<text class="m" x="32" y="604">CAM Table: aa:aa→Port1, bb:bb→Port2, ...</text>
</svg>
