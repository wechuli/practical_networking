<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d"><title id="t">Spine-leaf data center fabric</title><desc id="d">A two-tier fabric: Spine 1 and Spine 2 each connect to Leaf1, Leaf2, Leaf3 and Leaf4, and each leaf connects to its servers. There is no spine-to-spine link. Same-leaf traffic crosses one switch; cross-leaf traffic goes leaf, spine, leaf: three switches and two inter-switch links. Losing a spine re-routes traffic through the remaining spine; losing a leaf affects only that rack.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>

<rect class="bg" x="1" y="1" width="798" height="468" rx="16"/>
<text class="zl" x="24" y="30">Spine-leaf (data center — modern)</text>
<path class="line" d="M270 96 L100 190 M270 96 L300 190 M270 96 L500 190 M270 96 L700 190 M530 96 L100 190 M530 96 L300 190 M530 96 L500 190 M530 96 L700 190 M100 230 V266 M300 230 V266 M500 230 V266 M700 230 V266"/>
<rect class="net" x="190" y="56" width="160" height="40" rx="10"/><text class="t" x="270" y="81" text-anchor="middle">Spine 1</text>
<rect class="net" x="450" y="56" width="160" height="40" rx="10"/><text class="t" x="530" y="81" text-anchor="middle">Spine 2</text>
<rect class="net" x="35" y="190" width="130" height="40" rx="10"/><text class="t" x="100" y="215" text-anchor="middle">Leaf1</text>
<rect class="net" x="235" y="190" width="130" height="40" rx="10"/><text class="t" x="300" y="215" text-anchor="middle">Leaf2</text>
<rect class="net" x="435" y="190" width="130" height="40" rx="10"/><text class="t" x="500" y="215" text-anchor="middle">Leaf3</text>
<rect class="net" x="635" y="190" width="130" height="40" rx="10"/><text class="t" x="700" y="215" text-anchor="middle">Leaf4</text>
<rect class="box" x="45" y="266" width="110" height="34" rx="10"/><text class="s" x="100" y="288" text-anchor="middle">servers</text>
<rect class="box" x="245" y="266" width="110" height="34" rx="10"/><text class="s" x="300" y="288" text-anchor="middle">servers</text>
<rect class="box" x="445" y="266" width="110" height="34" rx="10"/><text class="s" x="500" y="288" text-anchor="middle">servers</text>
<rect class="box" x="645" y="266" width="110" height="34" rx="10"/><text class="s" x="700" y="288" text-anchor="middle">servers</text>
<rect class="box" x="20" y="324" width="760" height="126" rx="10"/>
<text class="s" x="36" y="348">No spine-to-spine link is required in this two-tier fabric.</text>
<text class="s" x="36" y="372">Same-leaf traffic traverses one switch; cross-leaf traffic traverses leaf -&gt; spine -&gt; leaf</text>
<text class="s" x="36" y="390">(three switches, two inter-switch links).</text>
<text class="s" x="36" y="414">Lose a spine: traffic re-routes through remaining spine.</text>
<text class="s" x="36" y="432">Lose a leaf: only that rack is affected.</text>
</svg>
