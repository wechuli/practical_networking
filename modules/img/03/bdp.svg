<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 444" role="img" aria-labelledby="t d"><title id="t">Bandwidth-delay product</title><desc id="d">BDP equals bandwidth times round-trip time: the data in flight needed to fill a path at a chosen rate and RTT. For a 1 Gbps link (125 MB/s) with a 100 ms RTT, the target in flight is 12.5 MB, or 12,500 KB. If the TCP window is smaller than 12.5 MB, TCP must pause for ACKs, the link sits idle, and throughput is limited by the window, not bandwidth. The cap also works the other way: maximum throughput equals window divided by RTT, so a 4 MB window over a 100 ms path caps one flow at 320 Mbit/s however fast the link is, while the same window over a 2 ms path allows 16 Gbit/s. Distance, not link speed, sets the ceiling.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>

<rect class="bg" x="1" y="1" width="798" height="442" rx="16"/>
<text class="zl" x="24" y="30">Bandwidth-delay product — why high latency limits throughput</text>
<text class="s" x="24" y="56">Data in flight needed to fill a path at the chosen rate and RTT:</text>
<rect class="l4" x="200" y="68" width="400" height="42" rx="10"/><text class="t" x="400" y="95" text-anchor="middle">BDP = Bandwidth × Round-Trip Time</text>
<rect class="box" x="20" y="128" width="370" height="118" rx="10"/>
<text class="l" x="36" y="150">Example</text>
<text class="m" x="36" y="174">Link: 1 Gbps = 125 MB/s</text>
<text class="m" x="36" y="194">RTT: 100ms = 0.1s</text>
<text class="m" x="36" y="214">Target in-flight: 125 MB/s × 0.1s</text>
<text class="m" x="36" y="234">  = 12.5 MB = 12,500 KB</text>
<rect class="warn" x="410" y="128" width="370" height="118" rx="10"/>
<text class="s" x="426" y="158">If TCP window size is smaller than 12.5 MB,</text>
<text class="s" x="426" y="178">TCP must pause and wait for ACKs before</text>
<text class="s" x="426" y="198">sending more. The link sits idle.</text>
<text class="l" x="426" y="226">Throughput is limited by window, not bandwidth.</text>
<text class="l" x="24" y="280">The cap works the other way too: maximum throughput = window / RTT.</text>
<rect class="warn" x="20" y="294" width="370" height="96" rx="10"/>
<text class="t" x="36" y="318">4 MB window, 100 ms path</text>
<text class="s" x="36" y="340">caps one flow at</text>
<text class="m" x="36" y="360">4 MB × 8 / 0.1 s = 320 Mbit/s</text>
<text class="s" x="36" y="380">however fast the link is.</text>
<rect class="ok" x="410" y="294" width="370" height="96" rx="10"/>
<text class="t" x="426" y="318">Same window, 2 ms path</text>
<text class="s" x="426" y="340">allows</text>
<text class="m" x="426" y="360">16 Gbit/s</text>
<text class="t" x="400" y="424" text-anchor="middle">Distance, not link speed, sets the ceiling.</text>
</svg>
