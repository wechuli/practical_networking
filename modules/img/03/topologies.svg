<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d"><title id="t">Bus, ring and star topologies</title><desc id="d">Three topologies side by side. Bus, used by early Ethernet and now historical: devices A to D share one cable, a break splits the network, and everyone shares the collision domain. Ring, used by SONET and FDDI and rare now: A, B, C and D form a loop, and with a dual ring a broken link makes traffic take the reverse path. Star, modern Ethernet: A to D each connect to a central switch; if the switch fails all devices lose connectivity, while a device failure affects only that device. This is the common office LAN pattern; cloud subnets are provider abstractions.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>

<rect class="bg" x="1" y="1" width="798" height="398" rx="16"/>
<rect class="zone" x="16" y="16" width="248" height="368" rx="12"/>
<text class="zl" x="32" y="42">Bus</text><text class="s" x="32" y="62">historical — early Ethernet</text>
<path class="line" d="M32 165 H248"/>
<rect class="net" x="50" y="150" width="36" height="30" rx="8"/><text class="l" x="68" y="170" text-anchor="middle">A</text>
<rect class="net" x="100" y="150" width="36" height="30" rx="8"/><text class="l" x="118" y="170" text-anchor="middle">B</text>
<rect class="net" x="150" y="150" width="36" height="30" rx="8"/><text class="l" x="168" y="170" text-anchor="middle">C</text>
<rect class="net" x="200" y="150" width="36" height="30" rx="8"/><text class="l" x="218" y="170" text-anchor="middle">D</text>
<path class="dash" d="M143 198 V170"/><text class="s" x="32" y="218">Break here → splits network.</text>
<text class="s" x="32" y="246">Collision domain: everyone.</text>
<rect class="zone" x="276" y="16" width="248" height="368" rx="12"/>
<text class="zl" x="292" y="42">Ring</text><text class="s" x="292" y="62">SONET, FDDI — rare now</text>
<path class="line" d="M348 135 H432 V205 H348 Z"/>
<rect class="net" x="330" y="120" width="36" height="30" rx="8"/><text class="l" x="348" y="140" text-anchor="middle">A</text>
<rect class="net" x="414" y="120" width="36" height="30" rx="8"/><text class="l" x="432" y="140" text-anchor="middle">B</text>
<rect class="net" x="414" y="190" width="36" height="30" rx="8"/><text class="l" x="432" y="210" text-anchor="middle">C</text>
<rect class="net" x="330" y="190" width="36" height="30" rx="8"/><text class="l" x="348" y="210" text-anchor="middle">D</text>
<text class="s" x="292" y="246">Break in one link → traffic takes</text>
<text class="s" x="292" y="264">reverse path (if dual-ring)</text>
<rect class="zone" x="536" y="16" width="248" height="368" rx="12"/>
<text class="zl" x="552" y="42">Star</text><text class="s" x="552" y="62">modern Ethernet — what you</text><text class="s" x="552" y="80">use every day</text>
<path class="line" d="M660 140 L574 190 M660 140 L634 190 M660 140 L694 190 M660 140 L754 190"/>
<rect class="net" x="615" y="110" width="90" height="30" rx="8"/><text class="l" x="660" y="130" text-anchor="middle">Switch</text>
<rect class="net" x="556" y="190" width="36" height="30" rx="8"/><text class="l" x="574" y="210" text-anchor="middle">A</text>
<rect class="net" x="616" y="190" width="36" height="30" rx="8"/><text class="l" x="634" y="210" text-anchor="middle">B</text>
<rect class="net" x="676" y="190" width="36" height="30" rx="8"/><text class="l" x="694" y="210" text-anchor="middle">C</text>
<rect class="net" x="736" y="190" width="36" height="30" rx="8"/><text class="l" x="754" y="210" text-anchor="middle">D</text>
<text class="s" x="552" y="246">Switch failure → all devices</text>
<text class="s" x="552" y="264">lose connectivity</text>
<text class="s" x="552" y="288">Individual device failure →</text>
<text class="s" x="552" y="306">only that device affected</text>
<text class="s" x="552" y="330">Common office LAN pattern;</text><text class="s" x="552" y="348">cloud subnets are provider</text><text class="s" x="552" y="366">abstractions</text>
</svg>
