<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-labelledby="t d"><title id="t">PMTUD black hole when ICMP is filtered</title><desc id="d">A sender reaches a receiver through a router, a firewall that blocks ICMP, and a VPN. The sender sends a 1500-byte packet with DF set; the router drops it because it is too big for the VPN tunnel and sends ICMP Fragmentation Needed, but the firewall drops that message. The sender never learns to reduce the packet size and keeps retransmitting the same 1500-byte packet, so the connection hangs for large transfers while small transfers work because small packets fit in the tunnel. Symptoms: SSH connects fine, large file transfers hang, and web pages load headers but not the body.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>

<rect class="bg" x="1" y="1" width="798" height="348" rx="16"/>
<text class="zl" x="24" y="30">PMTUD black hole — when ICMP is filtered</text>
<path class="line" d="M120 72 H170 M270 72 H330 M490 72 H540 M640 72 H680"/>
<rect class="net" x="20" y="50" width="100" height="44" rx="10"/><text class="l" x="70" y="77" text-anchor="middle">Sender</text>
<rect class="net" x="170" y="50" width="100" height="44" rx="10"/><text class="l" x="220" y="77" text-anchor="middle">Router</text>
<rect class="warn" x="330" y="50" width="160" height="44" rx="10"/><text class="l" x="410" y="68" text-anchor="middle">Firewall:</text><text class="s" x="410" y="86" text-anchor="middle">blocks ICMP</text>
<rect class="net" x="540" y="50" width="100" height="44" rx="10"/><text class="l" x="590" y="77" text-anchor="middle">VPN</text>
<rect class="net" x="680" y="50" width="100" height="44" rx="10"/><text class="l" x="730" y="77" text-anchor="middle">Receiver</text>
<rect class="box" x="20" y="114" width="470" height="216" rx="10"/>
<text class="s" x="36" y="140">1. Sender sends 1500-byte packet with DF=1</text>
<text class="s" x="36" y="164">2. Router drops it (too big for VPN tunnel)</text>
<text class="s" x="36" y="188">3. Router sends ICMP Fragmentation Needed</text>
<text class="l" x="36" y="212">4. Firewall drops the ICMP message</text>
<text class="s" x="36" y="236">5. Sender never learns to reduce packet size</text>
<text class="s" x="36" y="260">6. Sender retransmits the same 1500-byte packet</text>
<text class="l" x="36" y="284">7. Connection appears to hang for large transfers</text>
<text class="s" x="36" y="308">8. Small transfers work (small packets fit in tunnel)</text>
<rect class="warn" x="510" y="114" width="270" height="124" rx="10"/>
<text class="t" x="526" y="140">Symptom</text>
<text class="s" x="526" y="166">SSH connects fine.</text>
<text class="s" x="526" y="190">Large file transfers hang.</text>
<text class="s" x="526" y="214">Web pages load headers but not body.</text>
</svg>
