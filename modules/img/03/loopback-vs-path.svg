<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" role="img" aria-labelledby="t d"><title id="t">iperf3 loopback test compared with a real network path</title><desc id="d">On your machine, the iperf3 client sends through lo (127.0.0.1) to the iperf3 server: there is no real network, so this tests stack overhead only. Separately, ping goes out eth0 to the gateway and on to 8.8.8.8: a real network path, so the RTT reflects actual latency to 8.8.8.8.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>

<rect class="bg" x="1" y="1" width="798" height="370" rx="16"/>
<text class="zl" x="24" y="30">iperf3 loopback test</text>
<rect class="net" x="20" y="44" width="160" height="40" rx="10"/><text class="t" x="100" y="69" text-anchor="middle">Your Machine</text>
<path class="line" d="M60 84 V270"/><path class="arrow" d="M60 140 H98"/><path class="arrow" d="M60 270 H98"/>
<rect class="l4" x="100" y="120" width="150" height="40" rx="10"/><text class="l" x="175" y="145" text-anchor="middle">iperf3 client</text>
<path class="arrow" d="M250 140 H308"/>
<rect class="net" x="310" y="120" width="160" height="40" rx="10"/><text class="m" x="390" y="144" text-anchor="middle">lo (127.0.0.1)</text>
<path class="arrow" d="M470 140 H528"/>
<rect class="l4" x="530" y="120" width="150" height="40" rx="10"/><text class="l" x="605" y="145" text-anchor="middle">iperf3 server</text>
<text class="s" x="390" y="188" text-anchor="middle">No real network.</text>
<text class="s" x="390" y="206" text-anchor="middle">Tests stack overhead only.</text>
<rect class="l3" x="100" y="250" width="90" height="40" rx="10"/><text class="l" x="145" y="275" text-anchor="middle">ping</text>
<path class="arrow" d="M190 270 H238"/>
<rect class="net" x="240" y="250" width="90" height="40" rx="10"/><text class="m" x="285" y="274" text-anchor="middle">eth0</text>
<path class="arrow" d="M330 270 H378"/>
<rect class="net" x="380" y="250" width="120" height="40" rx="10"/><text class="l" x="440" y="275" text-anchor="middle">Gateway</text>
<path class="arrow" d="M500 270 H548"/>
<rect class="box" x="550" y="250" width="120" height="40" rx="10"/><text class="m" x="610" y="274" text-anchor="middle">8.8.8.8</text>
<text class="s" x="440" y="318" text-anchor="middle">Real network path.</text>
<text class="s" x="440" y="336" text-anchor="middle">RTT reflects actual latency to 8.8.8.8.</text>
</svg>
