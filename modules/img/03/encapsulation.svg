<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 624" role="img" aria-labelledby="t d"><title id="t">The same data at each layer</title><desc id="d">An HTTP request, GET /index.html HTTP/1.1 with Host example.com, is wrapped layer by layer. At layer 7 it is a message. At layer 4 TCP adds a header with source port 54321, destination port 443, sequence 1001 and acknowledgment 1, making a segment. At layer 3 IP adds a header with source 10.0.0.5, a destination in 203.0.113, TTL 64 and protocol 6 (TCP), making a packet. At layer 2 Ethernet adds a header with source and destination MACs and type 0x0800 in front and a CRC at the end, making the frame that is sent on the wire.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>

<rect class="bg" x="1" y="1" width="798" height="622" rx="16"/>
<text class="zl" x="24" y="30">The same data at each layer</text>
<text class="l" x="24" y="56">Application sends:</text><text class="m" x="160" y="56">GET /index.html HTTP/1.1\r\nHost: example.com\r\n\r\n</text>
<text class="l" x="24" y="88">Layer 7 — Message:</text>
<rect class="l7" x="420" y="98" width="280" height="72" rx="6"/><text class="t" x="432" y="120">HTTP Request</text><text class="m" x="432" y="138">GET /index.html HTTP/1.1</text><text class="m" x="432" y="156">Host: example.com</text>
<text class="l" x="24" y="196">Layer 4 — Segment (TCP wraps the HTTP message):</text>
<rect class="l4" x="270" y="206" width="150" height="92" rx="6"/><text class="t" x="282" y="228">TCP Header</text><text class="m" x="282" y="246">Src: 54321</text><text class="m" x="282" y="264">Dst: 443</text><text class="m" x="282" y="282">Seq: 1001 Ack: 1</text>
<rect class="l7" x="420" y="206" width="280" height="92" rx="6"/><text class="t" x="432" y="228">HTTP Request</text><text class="m" x="432" y="246">GET /index.html HTTP/1.1</text><text class="m" x="432" y="264">Host: example.com</text>
<text class="l" x="24" y="324">Layer 3 — Packet (IP wraps the TCP segment):</text>
<rect class="l3" x="140" y="334" width="130" height="110" rx="6"/><text class="t" x="152" y="356">IP Header</text><text class="m" x="152" y="374">Src: 10.0.0.5</text><text class="m" x="152" y="392">Dst: 203.0.113</text><text class="m" x="152" y="410">TTL: 64</text><text class="m" x="152" y="428">Proto: 6(TCP)</text>
<rect class="l4" x="270" y="334" width="150" height="110" rx="6"/><text class="t" x="282" y="356">TCP Header</text><text class="m" x="282" y="374">Src: 54321</text><text class="m" x="282" y="392">Dst: 443</text><text class="m" x="282" y="410">Seq: 1001</text>
<rect class="l7" x="420" y="334" width="280" height="110" rx="6"/><text class="t" x="432" y="356">HTTP Request</text><text class="m" x="432" y="374">GET /...</text>
<text class="l" x="24" y="470">Layer 2 — Frame (Ethernet wraps the IP packet):</text>
<rect class="l2" x="20" y="480" width="120" height="92" rx="6"/><text class="t" x="32" y="502">Eth Header</text><text class="m" x="32" y="520">Src MAC</text><text class="m" x="32" y="538">Dst MAC</text><text class="m" x="32" y="556">Type: 0x0800</text>
<rect class="l3" x="140" y="480" width="130" height="92" rx="6"/><text class="t" x="152" y="502">IP Header</text><text class="m" x="152" y="520">Src IP</text><text class="m" x="152" y="538">Dst IP</text>
<rect class="l4" x="270" y="480" width="150" height="92" rx="6"/><text class="t" x="282" y="502">TCP Header</text><text class="m" x="282" y="520">Src Port</text><text class="m" x="282" y="538">Dst Port</text>
<rect class="l7" x="420" y="480" width="280" height="92" rx="6"/><text class="t" x="432" y="502">HTTP Request</text><text class="m" x="432" y="520">GET /...</text>
<rect class="l2" x="700" y="480" width="70" height="92" rx="6"/><text class="t" x="712" y="502">CRC</text>
<path class="arrow" d="M620 600 H770"/><text class="s" x="610" y="604" text-anchor="end">Sent on the wire</text>
</svg>
