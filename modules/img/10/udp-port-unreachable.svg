<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" role="img" aria-labelledby="t d"><title id="t">UDP error reporting: ICMP port unreachable</title><desc id="d">A client sends a UDP datagram to destination port 9999 on a server where no process listens on that port. The server answers with ICMP Type 3 Code 3, port 9999 unreachable.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="228" rx="16"/>
<rect class="net" x="50.0" y="20" width="140" height="37" rx="10"/>
<text class="t" x="120.0" y="43.5" text-anchor="middle">Client</text>
<rect class="net" x="410.0" y="20" width="220" height="57" rx="10"/>
<text class="t" x="520.0" y="45.0" text-anchor="middle">Server</text>
<text class="s" x="520.0" y="63.0" text-anchor="middle">port 9999 not listening</text>
<path class="line" d="M120 60 V200"/>
<path class="line" d="M520 77 V200"/>
<path class="arrow" d="M120 120 H520"/>
<text class="m" x="320.0" y="112" text-anchor="middle">UDP datagram, dst port 9999</text>
<rect class="warn" x="548" y="100" width="222" height="40" rx="10"/>
<text class="l" x="659.0" y="124.5" text-anchor="middle">No process on port 9999!</text>
<path class="arrow" d="M520 180 H120"/>
<text class="s" x="320.0" y="172" text-anchor="middle">"Port 9999 unreachable"</text>
<text class="l" x="320.0" y="156" text-anchor="middle">ICMP Type 3 Code 3</text>
</svg>
