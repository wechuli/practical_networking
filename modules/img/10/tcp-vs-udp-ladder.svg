<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 820" role="img" aria-labelledby="t d"><title id="t">TCP and UDP exchanges compared</title><desc id="d">TCP, connection-oriented and reliable: SYN, SYN-ACK and ACK take 1 RTT before any data; then each data segment is acknowledged, lost segments are retransmitted and ordering is guaranteed; FIN, FIN-ACK and ACK tear the connection down. Minimum overhead: a 1 RTT handshake plus ACKs for every segment. UDP, connectionless and unreliable: a datagram goes out and a reply comes back with no handshake, no ACK, no retransmission and no ordering; a lost datagram is gone unless the application re-sends it.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="818" rx="16"/>
<text class="zl" x="24" y="32">TCP — CONNECTION-ORIENTED (RELIABLE)</text>
<rect class="net" x="50.0" y="44" width="120" height="37" rx="10"/>
<text class="t" x="110.0" y="67.5" text-anchor="middle">Client</text>
<rect class="net" x="360.0" y="44" width="120" height="37" rx="10"/>
<text class="t" x="420.0" y="67.5" text-anchor="middle">Server</text>
<path class="line" d="M110 81 V440"/>
<path class="line" d="M420 81 V440"/>
<path class="arrow" d="M110 116 H420"/>
<text class="m" x="265.0" y="108" text-anchor="middle">SYN</text>
<path class="arrow" d="M420 146 H110"/>
<text class="m" x="265.0" y="138" text-anchor="middle">SYN-ACK</text>
<path class="arrow" d="M110 176 H420"/>
<text class="m" x="265.0" y="168" text-anchor="middle">ACK</text>
<path class="arrow" d="M110 226 H420"/>
<text class="m" x="265.0" y="218" text-anchor="middle">Data</text>
<path class="arrow" d="M420 256 H110"/>
<text class="m" x="265.0" y="248" text-anchor="middle">ACK</text>
<path class="arrow" d="M110 286 H420"/>
<text class="m" x="265.0" y="278" text-anchor="middle">Data</text>
<path class="arrow" d="M420 316 H110"/>
<text class="m" x="265.0" y="308" text-anchor="middle">ACK</text>
<path class="arrow" d="M110 366 H420"/>
<text class="m" x="265.0" y="358" text-anchor="middle">FIN</text>
<path class="arrow" d="M420 396 H110"/>
<text class="m" x="265.0" y="388" text-anchor="middle">FIN-ACK</text>
<path class="arrow" d="M110 426 H420"/>
<text class="m" x="265.0" y="418" text-anchor="middle">ACK</text>
<text class="s" x="460" y="150">1 RTT before any data</text>
<text class="s" x="460" y="230">Data flows</text>
<text class="s" x="460" y="260">Every segment acknowledged</text>
<text class="s" x="460" y="290">Lost segment retransmitted</text>
<text class="s" x="460" y="320">Ordering guaranteed</text>
<text class="s" x="460" y="400">Teardown</text>
<text class="s" x="400" y="466" text-anchor="middle">Minimum overhead: 1 RTT handshake + ACKs for every segment</text>
<text class="zl" x="24" y="510">UDP — CONNECTIONLESS (UNRELIABLE)</text>
<rect class="net" x="50.0" y="522" width="120" height="37" rx="10"/>
<text class="t" x="110.0" y="545.5" text-anchor="middle">Client</text>
<rect class="net" x="360.0" y="522" width="120" height="37" rx="10"/>
<text class="t" x="420.0" y="545.5" text-anchor="middle">Server</text>
<path class="line" d="M110 559 V776"/>
<path class="line" d="M420 559 V776"/>
<path class="arrow" d="M110 596 H420"/>
<text class="m" x="265.0" y="588" text-anchor="middle">Datagram</text>
<path class="arrow" d="M420 626 H110"/>
<text class="m" x="265.0" y="618" text-anchor="middle">Reply</text>
<path class="arrow" d="M110 666 H420"/>
<text class="m" x="265.0" y="658" text-anchor="middle">Datagram</text>
<path class="dash" d="M110 696 H265.0"/>
<text class="l" x="279.0" y="701">✗</text>
<text class="s" x="187.5" y="688" text-anchor="middle">(lost)</text>
<path class="arrow" d="M110 736 H420"/>
<text class="m" x="265.0" y="728" text-anchor="middle">Datagram</text>
<path class="arrow" d="M420 766 H110"/>
<text class="m" x="265.0" y="758" text-anchor="middle">Reply</text>
<text class="s" x="460" y="600">No handshake</text>
<text class="s" x="460" y="630">No ACK</text>
<text class="s" x="460" y="650">No retransmission</text>
<text class="s" x="460" y="670">No ordering</text>
<text class="s" x="460" y="700">Lost = gone forever</text>
<text class="s" x="460" y="718">(unless application re-sends)</text>
<text class="s" x="400" y="802" text-anchor="middle">No transport handshake; still UDP/IP headers, socket state, and possible middlebox state</text>
</svg>
