<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" aria-labelledby="t d"><title id="t">An NTP request and response over UDP</title><desc id="d">The client sends a UDP datagram to port 123 asking for the time; the NTP server replies from port 123 with timestamps the client uses to compute the clock offset.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="218" rx="16"/>
<rect class="net" x="80.0" y="20" width="140" height="37" rx="10"/>
<text class="t" x="150.0" y="43.5" text-anchor="middle">Client</text>
<rect class="net" x="570.0" y="20" width="160" height="37" rx="10"/>
<text class="t" x="650.0" y="43.5" text-anchor="middle">NTP Server</text>
<path class="line" d="M150 60 V200"/>
<path class="line" d="M650 60 V200"/>
<path class="arrow" d="M150 116 H650"/>
<text class="l" x="400.0" y="108" text-anchor="middle">"What time is it?"</text>
<text class="m" x="400.0" y="92" text-anchor="middle">UDP dst=123</text>
<path class="arrow" d="M650 186 H150"/>
<text class="l" x="400.0" y="178" text-anchor="middle">Timestamps + offset</text>
<text class="m" x="400.0" y="162" text-anchor="middle">UDP src=123</text>
</svg>
