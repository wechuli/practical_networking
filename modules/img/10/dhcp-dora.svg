<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">The DHCP DORA exchange over UDP</title><desc id="d">Discover, Offer, Request, Acknowledge. The client at 0.0.0.0 port 68 broadcasts a Discover to 255.255.255.255; the server on port 67 replies with an Offer of 10.0.1.50 by broadcast or unicast; the client broadcasts a Request for 10.0.1.50; the server confirms with an Acknowledge by broadcast or unicast.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="418" rx="16"/>
<text class="zl" x="24" y="30">DORA Process (Discover-Offer-Request-Acknowledge)</text>
<rect class="net" x="60.0" y="44" width="180" height="57" rx="10"/>
<text class="t" x="150.0" y="69.0" text-anchor="middle">Client</text>
<text class="m" x="150.0" y="87.0" text-anchor="middle">0.0.0.0:68</text>
<rect class="net" x="550.0" y="44" width="200" height="57" rx="10"/>
<text class="t" x="650.0" y="69.0" text-anchor="middle">DHCP Server</text>
<text class="m" x="650.0" y="87.0" text-anchor="middle">x.x.x.x:67</text>
<path class="line" d="M150 104 V400"/>
<path class="line" d="M650 104 V400"/>
<path class="arrow" d="M150 164 H650"/>
<text class="l" x="400.0" y="156" text-anchor="middle">DHCP Discover: "I need an IP"</text>
<text class="s" x="400.0" y="140" text-anchor="middle">UDP Broadcast (255.255.255.255)</text>
<path class="arrow" d="M650 234 H150"/>
<text class="l" x="400.0" y="226" text-anchor="middle">DHCP Offer: "Here's 10.0.1.50"</text>
<text class="s" x="400.0" y="210" text-anchor="middle">UDP (Broadcast or Unicast)</text>
<path class="arrow" d="M150 304 H650"/>
<text class="l" x="400.0" y="296" text-anchor="middle">DHCP Request: "I'll take 10.0.1.50"</text>
<text class="s" x="400.0" y="280" text-anchor="middle">UDP Broadcast</text>
<path class="arrow" d="M650 374 H150"/>
<text class="l" x="400.0" y="366" text-anchor="middle">DHCP Acknowledge: "Confirmed"</text>
<text class="s" x="400.0" y="350" text-anchor="middle">UDP (Broadcast or Unicast)</text>
</svg>
