<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" role="img" aria-labelledby="t d"><title id="t">The UDP lab topology</title><desc id="d">The client at 198.18.40.10 reaches the server at 198.18.41.10 through fw, a stateful firewall that allows replies and drops anything else inbound. The server runs dnsmasq on port 53 with api.lab.test and a big.lab.test TXT record, udplab echo on port 9999, and a slow echo on port 9998 that replies after 8 seconds.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="208" rx="16"/>
<rect class="box" x="20" y="60" width="170" height="64" rx="10"/>
<text class="t" x="105.0" y="88.5" text-anchor="middle">client</text>
<text class="m" x="105.0" y="106.5" text-anchor="middle">198.18.40.10</text>
<rect class="net" x="240" y="52" width="230" height="80" rx="10"/>
<text class="t" x="355.0" y="80.0" text-anchor="middle">fw</text>
<text class="s" x="355.0" y="98.0" text-anchor="middle">stateful: allows replies,</text>
<text class="s" x="355.0" y="115.0" text-anchor="middle">drops anything else inbound</text>
<rect class="net" x="520" y="20" width="260" height="170" rx="10"/>
<text class="t" x="536" y="46">server</text>
<text class="m" x="536" y="67">198.18.41.10</text>
<text class="s" x="536" y="88">dnsmasq :53 (api.lab.test,</text>
<text class="s" x="536" y="109">big.lab.test TXT)</text>
<text class="s" x="536" y="130">udplab echo :9999</text>
<text class="s" x="536" y="151">slow echo :9998</text>
<text class="s" x="536" y="172">(replies after 8 s)</text>
<path class="line" d="M190 92 H240"/>
<path class="line" d="M470 92 H520"/>
</svg>
