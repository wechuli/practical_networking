<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" role="img" aria-labelledby="t d"><title id="t">The HTTP/2 frame header</title><desc id="d">Every HTTP/2 frame starts with a 9-byte header: a 24-bit Length, an 8-bit Type, 8 bits of Flags, one reserved bit R and a 31-bit Stream Identifier. The frame payload follows and is Length bytes long.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="228" rx="16"/>
<text class="zl" x="24" y="32">9-byte frame header</text>
<text class="s" x="146" y="58" text-anchor="middle">3 bytes</text><text class="s" x="314" y="58" text-anchor="middle">1 byte</text><text class="s" x="398" y="58" text-anchor="middle">1 byte</text><text class="s" x="623" y="58" text-anchor="middle">4 bytes</text>
<rect class="l7" x="20" y="68" width="252" height="56" rx="10"/><text class="l" x="146" y="92" text-anchor="middle">Length</text><text class="s" x="146" y="111" text-anchor="middle">24 bits</text>
<rect class="l7" x="272" y="68" width="84" height="56" rx="10"/><text class="l" x="314" y="92" text-anchor="middle">Type</text><text class="s" x="314" y="111" text-anchor="middle">8 bits</text>
<rect class="l7" x="356" y="68" width="84" height="56" rx="10"/><text class="l" x="398" y="92" text-anchor="middle">Flags</text><text class="s" x="398" y="111" text-anchor="middle">8 bits</text>
<rect class="box" x="440" y="68" width="30" height="56" rx="6"/><text class="l" x="455" y="100" text-anchor="middle">R</text>
<rect class="l7" x="470" y="68" width="310" height="56" rx="10"/><text class="l" x="625" y="92" text-anchor="middle">Stream Identifier</text><text class="s" x="625" y="111" text-anchor="middle">31 bits</text>
<rect class="box" x="20" y="144" width="760" height="56" rx="10"/><text class="l" x="400" y="168" text-anchor="middle">Frame Payload</text><text class="s" x="400" y="187" text-anchor="middle">Length bytes</text>
</svg>
