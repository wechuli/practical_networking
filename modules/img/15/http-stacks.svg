<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="t d"><title id="t">HTTP/1.1 and HTTP/2 stack versus the HTTP/3 stack</title><desc id="d">HTTP/1.1 and HTTP/2 run over TLS, over TCP in the kernel, over IP. HTTP/3 (frames, QPACK) runs over QUIC with TLS 1.3, which provides streams, loss recovery, congestion control and connection IDs and carries TLS in CRYPTO frames. QUIC runs over UDP, over IP; QUIC itself runs in user space, in the application or a library.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="318" rx="16"/>
<text class="zl" x="125" y="40" text-anchor="middle">HTTP/1.1, HTTP/2</text>
<text class="zl" x="355" y="40" text-anchor="middle">HTTP/3</text>
<rect class="l7" x="40" y="56" width="170" height="44" rx="10"/><text class="t" x="125" y="83" text-anchor="middle">HTTP</text>
<rect class="box" x="40" y="106" width="170" height="70" rx="10"/><text class="t" x="125" y="146" text-anchor="middle">TLS</text>
<rect class="l4" x="40" y="182" width="170" height="50" rx="10"/><text class="t" x="125" y="212" text-anchor="middle">TCP (kernel)</text>
<rect class="l3" x="40" y="238" width="170" height="44" rx="10"/><text class="t" x="125" y="265" text-anchor="middle">IP</text>
<rect class="l7" x="270" y="56" width="170" height="44" rx="10"/><text class="t" x="355" y="83" text-anchor="middle">HTTP/3</text>
<rect class="l4" x="270" y="106" width="170" height="70" rx="10"/><text class="t" x="355" y="136" text-anchor="middle">QUIC</text><text class="s" x="355" y="156" text-anchor="middle">+ TLS 1.3</text>
<rect class="l4" x="270" y="182" width="170" height="50" rx="10"/><text class="t" x="355" y="212" text-anchor="middle">UDP</text>
<rect class="l3" x="270" y="238" width="170" height="44" rx="10"/><text class="t" x="355" y="265" text-anchor="middle">IP</text>
<text class="s" x="462" y="82">frames, QPACK</text>
<text class="s" x="462" y="136">streams, loss recovery, congestion control,</text><text class="s" x="462" y="154">connection IDs; TLS carried in CRYPTO frames</text>
<text class="s" x="462" y="203">QUIC itself runs in user space</text><text class="s" x="462" y="221">(the application or a library)</text>
</svg>
