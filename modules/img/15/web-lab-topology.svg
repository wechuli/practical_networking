<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-labelledby="t d"><title id="t">The web lab topology</title><desc id="d">The client at 198.18.110.10 connects through a router running pathlab with 25 ms each way to the server at 198.18.111.10 (web.test). The server runs weblab on :443 (h2, http/1.1) and :80 (http/1.1, h2c), h3lab on udp/443 (HTTP/3), proxy-h1 on :8080, proxy-h2c on :8083, proxy-buffer on :8082 and a relay on :8081 with a 5 s idle timeout.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="278" rx="16"/>
<rect class="net" x="20" y="50" width="160" height="70" rx="10"/><text class="t" x="100" y="78" text-anchor="middle">client</text><text class="m" x="100" y="102" text-anchor="middle">198.18.110.10</text>
<path class="line" d="M180 85 H240"/>
<rect class="net" x="240" y="50" width="220" height="70" rx="10"/><text class="t" x="350" y="78" text-anchor="middle">router</text><text class="s" x="350" y="102" text-anchor="middle">pathlab: 25 ms each way</text>
<path class="line" d="M460 85 H520"/>
<rect class="net" x="520" y="20" width="260" height="248" rx="10"/><text class="t" x="650" y="46" text-anchor="middle">server (web.test)</text><text class="m" x="650" y="68" text-anchor="middle">198.18.111.10</text>
<text class="m" x="536" y="98">weblab :443 (h2, http/1.1)</text><text class="m" x="587" y="116">:80 (http/1.1, h2c)</text>
<text class="m" x="536" y="144">h3lab udp/443 (HTTP/3)</text>
<text class="m" x="536" y="172">proxy-h1 :8080</text><text class="m" x="536" y="190">proxy-h2c :8083</text><text class="m" x="536" y="208">proxy-buffer :8082</text>
<text class="m" x="536" y="236">relay :8081</text><text class="s" x="536" y="252">5 s idle timeout</text>
</svg>
