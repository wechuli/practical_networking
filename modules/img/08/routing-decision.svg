<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 724" role="img" aria-labelledby="t d"><title id="t">The routing decision for every packet</title><desc id="d">A flowchart. 1: the application calls send() for destination IP D. 2: the kernel looks up D in the routing table. 3: it finds the best route by longest prefix match, breaking ties by lowest metric, hashing across ECMP next hops, after policy rules have chosen the table. 4: if a route matches, it gives the next hop gateway or direct, and the output interface. 5: for a gateway, ARP for the gateway's MAC, frame to it, send. 6: for an on-link destination, ARP for the destination's MAC and frame to it directly. 7: if no route matches, drop the packet and return Network is unreachable; blackhole, unreachable and prohibit routes also refuse the packet with their own errors.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>

<rect class="bg" x="1" y="1" width="798" height="722" rx="16"/>
<text class="zl" x="24" y="30">Routing decision — what happens for every packet</text>
<rect class="box" x="140" y="44" width="520" height="40" rx="10"/><text class="l" x="400" y="69" text-anchor="middle">1. Application calls send() with data destined for IP address D</text>
<path class="arrow" d="M400 84 V106"/>
<rect class="box" x="140" y="108" width="520" height="40" rx="10"/><text class="l" x="400" y="133" text-anchor="middle">2. Kernel looks up D in the routing table</text>
<path class="arrow" d="M400 148 V170"/>
<rect class="l3" x="60" y="172" width="680" height="196" rx="10"/>
<text class="t" x="80" y="198">3. Find the best matching route: Longest Prefix Match</text>
<text class="s" x="80" y="222">• Compare D against every route's destination prefix</text>
<text class="s" x="80" y="240">• Multiple routes may match (e.g., 0.0.0.0/0 matches everything)</text>
<text class="s" x="80" y="258">• Select the route with the LONGEST (most specific) prefix</text>
<text class="s" x="80" y="276">• If tied: use the route with the lowest metric</text>
<text class="s" x="80" y="294">• A route can have several next hops (ECMP); a hash of the packet's addresses</text>
<text class="s" x="92" y="312">(and, if configured, ports) picks one</text>
<text class="s" x="80" y="330">• Before any of this, policy rules (8.6) choose WHICH table to search;</text>
<text class="s" x="92" y="348">the local table (the host's own addresses) comes first</text>
<path class="arrow" d="M274 368 V406"/><text class="l" x="284" y="392">a route matches</text>
<path class="arrow" d="M660 368 V406"/><text class="l" x="650" y="392" text-anchor="end">no route matches</text>
<rect class="box" x="24" y="408" width="500" height="78" rx="10"/>
<text class="l" x="40" y="432">4. The matching route tells the kernel:</text>
<text class="s" x="40" y="452">• Next hop gateway (or "direct" if on the same subnet)</text>
<text class="s" x="40" y="470">• Output interface (eth0, wlan0, tun0, etc.)</text>
<path class="arrow" d="M90 486 V528"/><text class="l" x="100" y="512">next hop is a gateway</text>
<path class="arrow" d="M300 486 V528"/><text class="l" x="310" y="512">directly connected</text>
<rect class="ok" x="24" y="530" width="245" height="174" rx="10"/>
<text class="l" x="38" y="554">5. Next hop is a gateway</text>
<text class="s" x="38" y="578">• ARP for the gateway's</text>
<text class="s" x="50" y="596">MAC address</text>
<text class="s" x="38" y="614">• Encapsulate in an Ethernet</text>
<text class="s" x="50" y="632">frame addressed to the</text>
<text class="s" x="50" y="650">gateway's MAC</text>
<text class="s" x="38" y="668">• Send out the interface</text>
<rect class="ok" x="279" y="530" width="245" height="174" rx="10"/>
<text class="l" x="293" y="554">6. Destination is directly</text>
<text class="l" x="293" y="572">connected (on-link)</text>
<text class="s" x="293" y="596">• ARP for the destination's</text>
<text class="s" x="305" y="614">MAC address directly</text>
<text class="s" x="293" y="632">• Encapsulate in an Ethernet</text>
<text class="s" x="305" y="650">frame addressed to the</text>
<text class="s" x="305" y="668">destination's MAC</text>
<text class="s" x="293" y="686">• Send out the interface</text>
<rect class="warn" x="544" y="408" width="232" height="296" rx="10"/>
<text class="l" x="558" y="432">7. No route matches</text>
<text class="s" x="558" y="456">• Drop the packet</text>
<text class="s" x="558" y="474">• Return error to the</text>
<text class="s" x="570" y="492">application: "Network</text>
<text class="s" x="570" y="510">is unreachable"</text>
<text class="s" x="558" y="540">A matching route of type</text>
<text class="s" x="558" y="558">blackhole, unreachable, or</text>
<text class="s" x="558" y="576">prohibit also refuses the</text>
<text class="s" x="558" y="594">packet, each with its own</text>
<text class="s" x="558" y="612">error (8.3).</text>
</svg>
