<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 488" role="img" aria-labelledby="t d"><title id="t">SNAT and DNAT, before and after</title><desc id="d">SNAT: host 10.0.1.50 sends src=10.0.1.50, dst=198.51.100.80 to the NAT gateway, which forwards it to the internet as src=203.0.113.5, dst=198.51.100.80; the gateway's public IP replaces the private source IP. DNAT: the internet sends src=198.51.100.1, dst=203.0.113.5:443 to the NAT gateway, which forwards it to the backend as src=198.51.100.1, dst=10.0.1.50:8080; the backend's private IP replaces the public destination IP.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>

<rect class="bg" x="1" y="1" width="798" height="486" rx="16"/>
<text class="zl" x="24" y="28">SNAT and DNAT — before and after</text>
<rect class="zone" x="16" y="40" width="768" height="208" rx="12"/>
<text class="zl" x="32" y="62">SNAT (Source NAT)</text>
<text class="s" x="40" y="88">Before SNAT</text>
<rect class="net" x="40" y="98" width="150" height="40" rx="10"/><text class="l" x="115" y="123" text-anchor="middle">Host 10.0.1.50</text>
<path class="arrow" d="M190 118 H608"/><text class="m" x="400" y="110" text-anchor="middle">src=10.0.1.50, dst=198.51.100.80</text>
<rect class="net" x="610" y="98" width="150" height="40" rx="10"/><text class="l" x="685" y="123" text-anchor="middle">NAT Gateway</text>
<text class="s" x="40" y="164">After SNAT</text>
<rect class="net" x="40" y="174" width="150" height="40" rx="10"/><text class="l" x="115" y="199" text-anchor="middle">NAT Gateway</text>
<path class="arrow" d="M190 194 H608"/><text class="m" x="400" y="186" text-anchor="middle">src=203.0.113.5, dst=198.51.100.80</text>
<text class="s" x="400" y="232" text-anchor="middle">Public IP of the NAT gateway replaces the private IP</text>
<rect class="box" x="610" y="174" width="150" height="40" rx="10"/><text class="l" x="685" y="199" text-anchor="middle">Internet</text>
<rect class="zone" x="16" y="264" width="768" height="208" rx="12"/>
<text class="zl" x="32" y="286">DNAT (Destination NAT)</text>
<text class="s" x="40" y="312">Before DNAT</text>
<rect class="box" x="40" y="322" width="150" height="40" rx="10"/><text class="l" x="115" y="347" text-anchor="middle">Internet</text>
<path class="arrow" d="M190 342 H608"/><text class="m" x="400" y="334" text-anchor="middle">src=198.51.100.1, dst=203.0.113.5:443</text>
<rect class="net" x="610" y="322" width="150" height="40" rx="10"/><text class="l" x="685" y="347" text-anchor="middle">NAT Gateway</text>
<text class="s" x="40" y="388">After DNAT</text>
<rect class="net" x="40" y="398" width="150" height="40" rx="10"/><text class="l" x="115" y="423" text-anchor="middle">NAT Gateway</text>
<path class="arrow" d="M190 418 H608"/><text class="m" x="400" y="410" text-anchor="middle">src=198.51.100.1, dst=10.0.1.50:8080</text>
<text class="s" x="400" y="456" text-anchor="middle">Private IP of the backend replaces the public IP</text>
<rect class="net" x="610" y="398" width="150" height="40" rx="10"/><text class="l" x="685" y="423" text-anchor="middle">Backend</text>
</svg>
