<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d"><title id="t">Policy routing: a two-step lookup</title><desc id="d">Step 1, ip rule, picks the routing table: priority 0 from all lookup local; priority 100 from 10.0.1.0/24 lookup custom_table; priority 32766 from all lookup main; priority 32767 from all lookup default. Rules are evaluated in priority order, lowest number first. Step 2 searches the selected table, a normal routing table with its own routes. In the example, traffic from 10.0.1.0/24 uses custom_table, which has a different default gateway than the main table.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>

<rect class="bg" x="1" y="1" width="798" height="398" rx="16"/>
<text class="zl" x="24" y="28">Policy routing — two-step lookup</text>
<rect class="zone" x="16" y="44" width="470" height="236" rx="12"/>
<text class="zl" x="32" y="66">Step 1: ip rule — which routing table to use?</text>
<text class="s" x="32" y="84">Evaluated in priority order (lowest number = first)</text>
<rect class="box" x="32" y="96" width="438" height="34" rx="10"/><text class="l" x="46" y="118">Priority 0:</text><text class="m" x="170" y="118">from all lookup local</text>
<rect class="l3" x="32" y="140" width="438" height="34" rx="10"/><text class="l" x="46" y="162">Priority 100:</text><text class="m" x="170" y="162">from 10.0.1.0/24 lookup custom_table</text>
<rect class="box" x="32" y="184" width="438" height="34" rx="10"/><text class="l" x="46" y="206">Priority 32766:</text><text class="m" x="170" y="206">from all lookup main</text>
<rect class="box" x="32" y="228" width="438" height="34" rx="10"/><text class="l" x="46" y="250">Priority 32767:</text><text class="m" x="170" y="250">from all lookup default</text>
<path class="arrow" d="M470 113 H534"/><path class="arrow" d="M470 157 H534"/><path class="arrow" d="M470 201 H534"/><path class="arrow" d="M470 245 H534"/>
<rect class="zone" x="520" y="44" width="264" height="236" rx="12"/>
<text class="zl" x="536" y="66">Step 2: the selected table</text>
<text class="m" x="536" y="84">ip route show table &lt;name&gt;</text>
<rect class="box" x="536" y="96" width="232" height="34" rx="10"/><text class="m" x="552" y="118">table local</text>
<rect class="l3" x="536" y="140" width="232" height="34" rx="10"/><text class="m" x="552" y="162">table custom_table</text>
<rect class="box" x="536" y="184" width="232" height="34" rx="10"/><text class="m" x="552" y="206">table main</text>
<rect class="box" x="536" y="228" width="232" height="34" rx="10"/><text class="m" x="552" y="250">table default</text>
<text class="s" x="24" y="306"><tspan class="m">from 10.0.1.0/24</tspan> means: if the SOURCE IP is in this range.</text>
<text class="s" x="24" y="326"><tspan class="m">lookup custom_table</tspan> means: use this routing table.</text>
<text class="s" x="24" y="346">Each table is a normal routing table with its own routes.</text>
<text class="s" x="24" y="374">Example: traffic from 10.0.1.0/24 uses custom_table, which has a different default gateway than the main table.</text>
</svg>
