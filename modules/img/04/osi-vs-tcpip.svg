<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d"><title id="t">Mapping the OSI model to the TCP/IP model</title><desc id="d">The seven OSI layers on the left map to the four TCP/IP layers on the right. OSI layers 7 application, 6 presentation and 5 session map to the TCP/IP application layer: HTTP, DNS, TLS, SSH, SMTP, gRPC. OSI layer 4 transport maps to TCP/IP transport: TCP, UDP, QUIC. OSI layer 3 network maps to the TCP/IP internet layer: IP, ICMP, IPsec. OSI layers 2 data link and 1 physical map to the TCP/IP link layer: Ethernet, Wi-Fi, ARP, PPP.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="498" rx="16"/>
<text class="zl" x="180" y="40" text-anchor="middle">OSI Model (7 Layers)</text>
<text class="zl" x="620" y="40" text-anchor="middle">TCP/IP Model (4 Layers)</text>
<path class="line" d="M60 54 H300 M500 54 H740"/>
<rect class="l7" x="60" y="80" width="240" height="46" rx="10"/><text class="t" x="84" y="108">7</text><text class="t" x="112" y="108">Application</text>
<rect class="l7" x="60" y="130" width="240" height="46" rx="10"/><text class="t" x="84" y="158">6</text><text class="t" x="112" y="158">Presentation</text>
<rect class="l7" x="60" y="180" width="240" height="46" rx="10"/><text class="t" x="84" y="208">5</text><text class="t" x="112" y="208">Session</text>
<rect class="l4" x="60" y="246" width="240" height="46" rx="10"/><text class="t" x="84" y="274">4</text><text class="t" x="112" y="274">Transport</text>
<rect class="l3" x="60" y="312" width="240" height="46" rx="10"/><text class="t" x="84" y="340">3</text><text class="t" x="112" y="340">Network</text>
<rect class="l2" x="60" y="378" width="240" height="46" rx="10"/><text class="t" x="84" y="406">2</text><text class="t" x="112" y="406">Data Link</text>
<rect class="box" x="60" y="428" width="240" height="46" rx="10"/><text class="t" x="84" y="456">1</text><text class="t" x="112" y="456">Physical</text>
<rect class="l7" x="500" y="80" width="240" height="146" rx="10"/><text class="t" x="620" y="132" text-anchor="middle">Application</text><text class="s" x="620" y="156" text-anchor="middle">HTTP, DNS, TLS,</text><text class="s" x="620" y="174" text-anchor="middle">SSH, SMTP, gRPC</text>
<rect class="l4" x="500" y="246" width="240" height="46" rx="10"/><text class="t" x="620" y="265" text-anchor="middle">Transport</text><text class="s" x="620" y="283" text-anchor="middle">TCP, UDP, QUIC</text>
<rect class="l3" x="500" y="312" width="240" height="46" rx="10"/><text class="t" x="620" y="331" text-anchor="middle">Internet</text><text class="s" x="620" y="349" text-anchor="middle">IP, ICMP, IPsec</text>
<rect class="l2" x="500" y="378" width="240" height="96" rx="10"/><text class="t" x="620" y="414" text-anchor="middle">Link</text><text class="s" x="620" y="438" text-anchor="middle">Ethernet, Wi-Fi,</text><text class="s" x="620" y="456" text-anchor="middle">ARP, PPP</text>
<path class="arrow" d="M302 153 H496"/>
<path class="arrow" d="M302 269 H496"/>
<path class="arrow" d="M302 335 H496"/>
<path class="arrow" d="M302 426 H496"/>
</svg>
