<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 436" role="img" aria-labelledby="t d"><title id="t">Where TLS lives</title><desc id="d">Four views of TLS: OSI says layer 6 (presentation) because it handles encryption and encoding; but also layer 5 (session) because TLS sessions have state, resumption and IDs; in TCP/IP it is in the application layer, between the socket API and HTTP; in practice it sits between layer 4 (TCP) and layer 7 (HTTP). A stack shows HTTP (layer 7) on top of TLS (layer 6/5), on top of TCP (layer 4), on top of IP (layer 3): TLS operates on top of TCP, below HTTP. TLS is often discussed alongside session and presentation functions; "layer 6.5" is not a standard. BGP controls routing but is carried over TCP.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="434" rx="16"/>
<text class="zl" x="24" y="32">Where does TLS live?</text>
<rect class="box" x="20" y="46" width="760" height="108" rx="10"/>
<text class="l" x="40" y="70">OSI says:</text><text class="s" x="160" y="70">Layer 6 (Presentation) — it handles encryption and encoding</text>
<text class="l" x="40" y="94">But also:</text><text class="s" x="160" y="94">Layer 5 (Session) — TLS sessions have state, resumption, IDs</text>
<text class="l" x="40" y="118">In TCP/IP:</text><text class="s" x="160" y="118">Application layer — TLS sits between the socket API and HTTP</text>
<text class="l" x="40" y="142">In practice:</text><text class="s" x="160" y="142">Between Layer 4 (TCP) and Layer 7 (HTTP)</text>
<rect class="l7" x="160" y="176" width="220" height="40" rx="10"/><text class="t" x="270" y="201" text-anchor="middle">HTTP (Layer 7)</text>
<rect class="box" x="160" y="220" width="220" height="40" rx="10"/><text class="t" x="270" y="245" text-anchor="middle">TLS (Layer 6/5)</text>
<rect class="l4" x="160" y="264" width="220" height="40" rx="10"/><text class="t" x="270" y="289" text-anchor="middle">TCP (Layer 4)</text>
<rect class="l3" x="160" y="308" width="220" height="40" rx="10"/><text class="t" x="270" y="333" text-anchor="middle">IP (Layer 3)</text>
<path class="arrow" d="M470 240 H384"/><text class="l" x="480" y="245">Operates on top of TCP, below HTTP</text>
<text class="s" x="24" y="386">TLS is often discussed alongside session/presentation functions;</text>
<text class="s" x="24" y="408">"Layer 6.5" is not a standard. BGP controls routing but is carried over TCP.</text>
</svg>
