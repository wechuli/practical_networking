<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" aria-labelledby="t d"><title id="t">A BGP peering session across an IXP</title><desc id="d">Both networks connect a router to the IXP's switching fabric and take addresses from the peering LAN, for example 80.249.208.0/21 at AMS-IX: the AS 100 router is 80.249.208.10 and the AS 200 router is 80.249.208.20. They run a BGP session directly between them.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="218" rx="16"/>
<rect class="zone" x="20" y="20" width="760" height="180" rx="12"/>
<text class="zl" x="36" y="44">IXP peering LAN (e.g., 80.249.208.0/21 for AMS-IX)</text>
<rect class="net" x="60" y="70" width="220" height="64" rx="10"/>
<text class="t" x="170.0" y="98.5" text-anchor="middle">AS 100 Router</text>
<text class="m" x="170.0" y="116.5" text-anchor="middle">80.249.208.10</text>
<rect class="net" x="520" y="70" width="220" height="64" rx="10"/>
<text class="t" x="630.0" y="98.5" text-anchor="middle">AS 200 Router</text>
<text class="m" x="630.0" y="116.5" text-anchor="middle">80.249.208.20</text>
<path class="arrow" d="M284 102 H516"/>
<path class="arrow" d="M516 102 H284"/>
<text class="l" x="400" y="94" text-anchor="middle">BGP session</text>
<rect class="l2" x="60" y="156" width="680" height="28" rx="8"/>
<text class="s" x="400" y="175" text-anchor="middle">IXP's Ethernet switch fabric</text>
