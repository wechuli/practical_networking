<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Transit path versus direct peering at an IXP</title><desc id="d">Without an IXP, your ISP (AS 100) and a content provider (AS 200) each pay a transit provider, AS 3356 and AS 174, and packets take a long path across several networks. With an IXP, both networks connect to the IXP switch, a Layer 2 fabric, and packets cross one switch with sub-millisecond latency.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="518" rx="16"/>
<rect class="zone" x="20" y="20" width="760" height="250" rx="12"/>
<text class="zl" x="36" y="44">Without IXP: transit path</text>
<rect class="net" x="50" y="60" width="240" height="52" rx="10"/>
<text class="t" x="170.0" y="91.0" text-anchor="middle">Your ISP AS 100</text>
<rect class="net" x="510" y="60" width="240" height="52" rx="10"/>
<text class="t" x="630.0" y="91.0" text-anchor="middle">Content Provider AS 200</text>
<rect class="box" x="50" y="170" width="240" height="52" rx="10"/>
<text class="t" x="170.0" y="201.0" text-anchor="middle">Transit Provider AS 3356</text>
<rect class="box" x="510" y="170" width="240" height="52" rx="10"/>
<text class="t" x="630.0" y="201.0" text-anchor="middle">Transit Provider AS 174</text>
<path class="arrow" d="M170 112 V166"/>
<text class="s" x="182" y="144">$$ pays transit $$</text>
<path class="arrow" d="M630 112 V166"/>
<text class="s" x="642" y="144">$$ pays transit $$</text>
<path class="line" d="M290 196 H510"/>
<text class="l" x="400" y="188" text-anchor="middle">long path</text>
<text class="s" x="400" y="246" text-anchor="middle">Packets cross multiple networks. Each transit hop adds latency and cost.</text>
<text class="s" x="400" y="262" text-anchor="middle">Transit providers charge per-Mbps or per-Gbps.</text>
<rect class="zone" x="20" y="290" width="760" height="210" rx="12"/>
<text class="zl" x="36" y="314">With IXP: direct peering</text>
<rect class="net" x="50" y="330" width="240" height="52" rx="10"/>
<text class="t" x="170.0" y="361.0" text-anchor="middle">Your ISP AS 100</text>
<rect class="net" x="510" y="330" width="240" height="52" rx="10"/>
<text class="t" x="630.0" y="361.0" text-anchor="middle">Content Provider AS 200</text>
<rect class="ok" x="300" y="400" width="200" height="52" rx="10"/>
<text class="t" x="400.0" y="422.5" text-anchor="middle">IXP Switch</text>
<text class="s" x="400.0" y="440.5" text-anchor="middle">(Layer 2 fabric)</text>
<path class="arrow" d="M170 382 V426 H296"/>
<path class="arrow" d="M630 382 V426 H504"/>
<text class="s" x="400" y="476" text-anchor="middle">Packets cross ONE switch. Sub-millisecond latency.</text>
</svg>
