<rect class="net" x="60" y="168" width="170" height="56" rx="10"/>
<text class="t" x="145.0" y="201.0" text-anchor="middle">Router B</text>
<rect class="net" x="560" y="62" width="170" height="56" rx="10"/>
<text class="t" x="645.0" y="95.0" text-anchor="middle">Router C</text>
<path class="line" d="M145 118 V168"/>
<text class="l" x="157" y="148">iBGP</text>
<path class="arrow" d="M234 90 H556"/>
<path class="arrow" d="M556 90 H234"/>
<text class="l" x="395" y="80" text-anchor="middle">eBGP session</text>
