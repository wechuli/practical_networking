<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d"><title id="t">A BGP route leak</title><desc id="d">Normal operation: AS 64501, a customer, receives full internet routes from its transit provider AS 3356 and advertises only its own prefixes to AS 174. Route leak: AS 64501 re-advertises all routes from AS 3356 to AS 174. AS 174 prefers the customer-learned routes because of their higher LOCAL_PREF, and internet traffic floods through AS 64501, whose routers overload and drop traffic.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="468" rx="16"/>
<rect class="zone" x="20" y="20" width="370" height="350" rx="12"/>
<text class="zl" x="36" y="44">Normal operation</text>
<rect class="net" x="50" y="60" width="180" height="56" rx="10"/>
<text class="t" x="140.0" y="84.5" text-anchor="middle">AS 3356</text>
<text class="s" x="140.0" y="102.5" text-anchor="middle">transit provider</text>
<rect class="net" x="50" y="170" width="180" height="56" rx="10"/>
<text class="t" x="140.0" y="194.5" text-anchor="middle">AS 64501</text>
<text class="s" x="140.0" y="212.5" text-anchor="middle">customer</text>
<rect class="net" x="50" y="290" width="180" height="56" rx="10"/>
<text class="t" x="140.0" y="323.0" text-anchor="middle">AS 174</text>
<path class="arrow" d="M140 116 V166"/>
<text class="s" x="150" y="146">full internet routes</text>
<path class="arrow" d="M140 226 V286"/>
<text class="s" x="150" y="252">only its OWN</text>
<text class="s" x="150" y="268">prefixes</text>
<rect class="zone" x="410" y="20" width="370" height="350" rx="12"/>
<text class="zl" x="426" y="44">Route leak</text>
<rect class="net" x="440" y="60" width="180" height="56" rx="10"/>
<text class="t" x="530.0" y="84.5" text-anchor="middle">AS 3356</text>
<text class="s" x="530.0" y="102.5" text-anchor="middle">transit provider</text>
<rect class="warn" x="440" y="170" width="180" height="56" rx="10"/>
<text class="t" x="530.0" y="194.5" text-anchor="middle">AS 64501</text>
<text class="s" x="530.0" y="212.5" text-anchor="middle">customer</text>
<rect class="net" x="440" y="290" width="180" height="56" rx="10"/>
<text class="t" x="530.0" y="323.0" text-anchor="middle">AS 174</text>
<path class="arrow" d="M530 116 V166"/>
<text class="s" x="540" y="146">full internet routes</text>
<path class="dash" d="M530 226 V286"/>
<text class="s" x="540" y="252">ALL routes</text>
<text class="s" x="540" y="268">from AS 3356</text>
<path class="dash" d="M620 300 C700 300 700 216 624 210"/>
<text class="l" x="680" y="330" text-anchor="middle">internet traffic</text>
<text class="l" x="680" y="346" text-anchor="middle">floods in</text>
<text class="s" x="400" y="400" text-anchor="middle">AS 174 prefers the leaked routes: providers give routes learned from customers a higher</text>
<text class="s" x="400" y="418" text-anchor="middle">LOCAL_PREF than routes from peers. AS 64501's routers overload and traffic is dropped.</text>
<text class="s" x="400" y="436" text-anchor="middle">Leaked more-specific prefixes are worse: they win by longest prefix match wherever accepted.</text>
</svg>
