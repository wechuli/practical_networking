<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t d"><title id="t">BGP over AWS Direct Connect</title><desc id="d">Your data center router (ASN 65001) and the AWS virtual private gateway (ASN 64512) are joined by Direct Connect, a dedicated fiber, and run a BGP session over it. Your router advertises 172.16.0.0/12, your on-premises range, and AWS advertises 10.0.0.0/16, your VPC CIDR.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="298" rx="16"/>
<rect class="zone" x="20" y="20" width="250" height="260" rx="12"/>
<text class="zl" x="36" y="44">Your Data Center</text>
<rect class="zone" x="530" y="20" width="250" height="260" rx="12"/>
<text class="zl" x="546" y="44">AWS VPC</text>
<rect class="net" x="40" y="60" width="210" height="200" rx="10"/>
<text class="t" x="56" y="88">Your Router</text>
<text class="m" x="56" y="110">ASN: 65001</text>
<text class="l" x="56" y="154">Advertises:</text>
<text class="m" x="56" y="176">172.16.0.0/12</text>
<text class="s" x="56" y="198">(your on-prem)</text>
<rect class="net" x="550" y="60" width="210" height="200" rx="10"/>
<text class="t" x="566" y="86">Virtual Private</text>
<text class="t" x="566" y="110">Gateway</text>
<text class="m" x="566" y="134">VPC: 10.0.0.0/16</text>
<text class="m" x="566" y="158">ASN: 64512</text>
<text class="l" x="566" y="182">Advertises:</text>
<text class="m" x="566" y="206">10.0.0.0/16</text>
<text class="s" x="566" y="230">(your VPC CIDR)</text>
<path class="arrow" d="M254 110 H546"/>
<path class="arrow" d="M546 110 H254"/>
<text class="l" x="400" y="100" text-anchor="middle">Direct Connect</text>
<text class="s" x="400" y="130" text-anchor="middle">(dedicated fiber)</text>
<path class="arrow" d="M254 200 H546"/>
<path class="arrow" d="M546 200 H254"/>
<text class="l" x="400" y="190" text-anchor="middle">BGP session</text>
<text class="m" x="400" y="222" text-anchor="middle">172.16.0.0/12 →</text>
<text class="m" x="400" y="242" text-anchor="middle">← 10.0.0.0/16</text>
</svg>
