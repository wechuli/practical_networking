<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" role="img" aria-labelledby="t d"><title id="t">Anycast: one IP address, many locations</title><desc id="d">Illustrative deployment: Cloudflare data centers in London, Tokyo and São Paulo each announce 1.1.1.0/24 via AS 13335 over BGP, and each serves the same address, 1.1.1.1.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="248" rx="16"/>
<text class="zl" x="24" y="32">Illustrative deployment: one resolver address advertised from several locations</text>
<rect class="l3" x="20" y="50" width="240" height="64" rx="10"/>
<text class="l" x="140.0" y="78.0" text-anchor="middle">London DC</text>
<text class="m" x="140.0" y="95.0" text-anchor="middle">BGP: "1.1.1.0/24 via AS 13335"</text>
<path class="arrow" d="M140 114 V150"/>
<rect class="net" x="20" y="154" width="240" height="64" rx="10"/>
<text class="t" x="140.0" y="182.5" text-anchor="middle">CF London</text>
<text class="m" x="140.0" y="200.5" text-anchor="middle">1.1.1.1</text>
<rect class="l3" x="280" y="50" width="240" height="64" rx="10"/>
<text class="l" x="400.0" y="78.0" text-anchor="middle">Tokyo DC</text>
<text class="m" x="400.0" y="95.0" text-anchor="middle">BGP: "1.1.1.0/24 via AS 13335"</text>
<path class="arrow" d="M400 114 V150"/>
<rect class="net" x="280" y="154" width="240" height="64" rx="10"/>
<text class="t" x="400.0" y="182.5" text-anchor="middle">CF Tokyo</text>
<text class="m" x="400.0" y="200.5" text-anchor="middle">1.1.1.1</text>
<rect class="l3" x="540" y="50" width="240" height="64" rx="10"/>
<text class="l" x="660.0" y="78.0" text-anchor="middle">São Paulo DC</text>
<text class="m" x="660.0" y="95.0" text-anchor="middle">BGP: "1.1.1.0/24 via AS 13335"</text>
<path class="arrow" d="M660 114 V150"/>
<rect class="net" x="540" y="154" width="240" height="64" rx="10"/>
<text class="t" x="660.0" y="182.5" text-anchor="middle">CF São Paulo</text>
<text class="m" x="660.0" y="200.5" text-anchor="middle">1.1.1.1</text>
</svg>
