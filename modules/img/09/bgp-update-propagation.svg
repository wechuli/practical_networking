<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" role="img" aria-labelledby="t d"><title id="t">How a BGP route advertisement propagates</title><desc id="d">AS 64501 owns 203.0.113.0/24 and sends an UPDATE to AS 64502 with AS-PATH [64501] and NEXT-HOP 198.51.100.1. AS 64502 learns it can reach the prefix through 198.51.100.1 via AS 64501. When AS 64502 re-advertises the route to AS 64503 it prepends its own ASN, making the AS-PATH [64502, 64501] with Router C as the next hop, so AS 64503 sees a two-hop path.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="528" rx="16"/>
<rect class="l3" x="20" y="30" width="200" height="64" rx="10"/>
<text class="t" x="120.0" y="58.5" text-anchor="middle">AS 64501</text>
<text class="s" x="120.0" y="76.5" text-anchor="middle">owns 203.0.113.0/24</text>
<rect class="l3" x="20" y="236" width="200" height="64" rx="10"/>
<text class="t" x="120.0" y="264.5" text-anchor="middle">AS 64502</text>
<text class="s" x="120.0" y="282.5" text-anchor="middle">Router C</text>
<rect class="l3" x="20" y="442" width="200" height="64" rx="10"/>
<text class="t" x="120.0" y="479.0" text-anchor="middle">AS 64503</text>
<path class="arrow" d="M120 94 V232"/>
<path class="arrow" d="M120 300 V438"/>
<rect class="box" x="250" y="112" width="530" height="104" rx="10"/>
<text class="l" x="266" y="136">UPDATE message: AS 64501 advertises to its neighbor AS 64502</text>
<text class="m" x="266" y="160" xml:space="preserve">NLRI (prefix):  203.0.113.0/24</text>
<text class="m" x="266" y="180" xml:space="preserve">AS-PATH:        [64501]</text>
<text class="m" x="266" y="200" xml:space="preserve">NEXT-HOP:       198.51.100.1 (Router A's interface toward Router C)</text>
<rect class="ok" x="250" y="240" width="530" height="56" rx="10"/>
<text class="s" x="266" y="263">AS 64502 now knows: "To reach 203.0.113.0/24, send traffic to</text>
<text class="s" x="266" y="282">198.51.100.1. The path traverses AS 64501."</text>
<rect class="box" x="250" y="318" width="530" height="104" rx="10"/>
<text class="l" x="266" y="342">If AS 64502 re-advertises this to AS 64503</text>
<text class="m" x="266" y="366" xml:space="preserve">NLRI:      203.0.113.0/24</text>
<text class="m" x="266" y="386" xml:space="preserve">AS-PATH:   [64502, 64501]  ← AS 64502 prepends its own ASN</text>
<text class="m" x="266" y="406" xml:space="preserve">NEXT-HOP:  (Router C's interface toward AS 64503)</text>
<rect class="ok" x="250" y="446" width="530" height="56" rx="10"/>
<text class="s" x="266" y="469">AS 64503 now knows: "To reach 203.0.113.0/24, the path goes</text>
<text class="s" x="266" y="488">through AS 64502 then AS 64501. Two hops."</text>
</svg>
