<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d"><title id="t">Choosing between two BGP paths</title><desc id="d">Your router in AS 64500 learns 8.8.8.0/24 from two transit providers: from AS 3356 (Lumen) with AS-PATH 3356, 15169, two AS hops, and from AS 174 (Cogent) with AS-PATH 174, 1299, 15169, three AS hops. With equal LOCAL-PREF the shorter Lumen path wins.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="328" rx="16"/>
<text class="zl" x="24" y="32">Your AS (64500) peers with two transit providers</text>
<rect class="net" x="20" y="140" width="170" height="70" rx="10"/>
<text class="t" x="105.0" y="171.5" text-anchor="middle">Your Router</text>
<text class="s" x="105.0" y="189.5" text-anchor="middle">AS 64500</text>
<rect class="ok" x="330" y="50" width="450" height="104" rx="10"/>
<text class="t" x="346" y="76">AS 3356 (Lumen)</text>
<text class="m" x="346" y="100">Route to 8.8.8.0/24</text>
<text class="m" x="346" y="120" xml:space="preserve">AS-PATH: [3356, 15169]        ← 2 AS hops</text>
<text class="l" x="346" y="141">Winner: shorter AS-PATH</text>
<rect class="box" x="330" y="180" width="450" height="88" rx="10"/>
<text class="t" x="346" y="206">AS 174 (Cogent)</text>
<text class="m" x="346" y="230">Route to 8.8.8.0/24</text>
<text class="m" x="346" y="250" xml:space="preserve">AS-PATH: [174, 1299, 15169]   ← 3 AS hops</text>
<path class="arrow" d="M190 162 L326 104"/>
<path class="arrow" d="M190 188 L326 224"/>
<text class="s" x="400" y="300" text-anchor="middle">Both routes reach 8.8.8.0/24 (Google DNS). LOCAL-PREF is assumed equal for both,</text>
<text class="s" x="400" y="318" text-anchor="middle">so traffic to 8.8.8.8 goes via Lumen, not Cogent.</text>
</svg>
