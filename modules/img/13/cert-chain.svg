<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="t d"><title id="t">A certificate chain</title><desc id="d">Lab Root CA is self-signed and sits in the client's trust store, so it never needs to be sent. It signs Lab Issuing CA 1, an intermediate the server must send. The intermediate signs shop.test, the leaf, which the server sends first.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="338" rx="16"/>
<rect class="zone" x="24" y="20" width="752" height="106" rx="12"/><text class="zl" x="40" y="42">The client's trust store</text>
<rect class="ok" x="40" y="58" width="240" height="50" rx="10"/><text class="t" x="160" y="88" text-anchor="middle">Lab Root CA</text>
<text class="s" x="310" y="80">self-signed; in the client's TRUST STORE</text>
<text class="s" x="310" y="98">(never needs to be sent)</text>
<path class="arrow" d="M160 108 V178"/><text class="l" x="172" y="148">signs</text>
<rect class="zone" x="24" y="154" width="752" height="168" rx="12"/><text class="zl" x="590" y="176">Sent by the server</text>
<rect class="box" x="40" y="180" width="240" height="50" rx="10"/><text class="t" x="160" y="210" text-anchor="middle">Lab Issuing CA 1</text>
<text class="s" x="310" y="210">intermediate; the SERVER must send it</text>
<path class="arrow" d="M160 230 V256"/><text class="l" x="172" y="248">signs</text>
<rect class="box" x="40" y="258" width="240" height="50" rx="10"/><text class="t" x="160" y="288" text-anchor="middle">shop.test</text>
<text class="s" x="310" y="288">the leaf; the server sends it first</text>
</svg>
