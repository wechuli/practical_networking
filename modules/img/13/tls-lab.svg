<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d"><title id="t">The TLS lab topology</title><desc id="d">Client 198.18.90.10, router 198.18.90.1 and server 198.18.91.10 in a line. The client's /etc/hosts maps shop.test and 13 other names to 198.18.91.10. The router relays port 4443 to 443, 4444 to 8443 and 4445 to 7443, adding 25 ms each way, and runs an intercepting proxy on port 8443 that is off until a check redirects port 443 to it. The server serves HTTPS on 443 with 14 names by SNI (plus a cleartext login on 80), TLS 1.2 only on 8443, key exchange group P-256 only on 7443, mTLS with client certificates from the lab root on 9443, and TLS 1.0–1.1 only on 1443.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="328" rx="16"/>
<rect class="net" x="20" y="24" width="210" height="56" rx="10"/><text class="t" x="125" y="47" text-anchor="middle">client</text><text class="m" x="125" y="67" text-anchor="middle">198.18.90.10</text>
<path class="line" d="M230 52 H250"/>
<rect class="net" x="250" y="24" width="270" height="56" rx="10"/><text class="t" x="385" y="47" text-anchor="middle">router</text><text class="m" x="385" y="67" text-anchor="middle">198.18.90.1</text>
<path class="line" d="M520 52 H540"/>
<rect class="net" x="540" y="24" width="240" height="56" rx="10"/><text class="t" x="660" y="47" text-anchor="middle">server</text><text class="m" x="660" y="67" text-anchor="middle">198.18.91.10</text>
<rect class="box" x="20" y="96" width="210" height="98" rx="10"/>
<text class="m" x="34" y="120">/etc/hosts:</text>
<text class="s" x="34" y="142">shop.test and 13 other</text>
<text class="s" x="34" y="160">names</text>
<text class="m" x="34" y="180">→ 198.18.91.10</text>
<rect class="box" x="250" y="96" width="270" height="210" rx="10"/>
<text class="l" x="264" y="120">relays (+25 ms each way)</text>
<text class="m" x="264" y="144">:4443 → :443</text>
<text class="m" x="264" y="166">:4444 → :8443</text>
<text class="m" x="264" y="188">:4445 → :7443</text>
<text class="l" x="264" y="222">intercepting proxy</text>
<text class="m" x="264" y="244">:8443</text>
<text class="s" x="264" y="266">(off until a check redirects</text>
<text class="s" x="264" y="284">port 443 to it)</text>
<rect class="box" x="540" y="96" width="240" height="214" rx="10"/>
<text class="s" x="554" y="120"><tspan class="m">:443 </tspan> HTTPS, 14 names by SNI</text>
<text class="s" x="554" y="138">(+ :80 cleartext login)</text>
<text class="s" x="554" y="164"><tspan class="m">:8443</tspan> TLS 1.2 only</text>
<text class="s" x="554" y="190"><tspan class="m">:7443</tspan> key exchange group</text>
<text class="s" x="554" y="208">P-256 only</text>
<text class="s" x="554" y="234"><tspan class="m">:9443</tspan> mTLS (client certificates</text>
<text class="s" x="554" y="252">from the lab root)</text>
<text class="s" x="554" y="278"><tspan class="m">:1443</tspan> TLS 1.0–1.1 only</text>
</svg>
