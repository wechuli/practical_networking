<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">The TLS 1.3 full handshake</title><desc id="d">One round trip after TCP. The client sends ClientHello with a key_share (SNI, supported_versions, groups, ALPN): it guesses a group and sends its public key at once. The server answers ServerHello with its key_share, and the keys are derived there. Everything after that is encrypted, including the certificate: EncryptedExtensions, Certificate, CertificateVerify and Finished from the server, then Finished from the client. Application data follows, and the client may send right away. After the handshake the server sends NewSessionTicket for resumption.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="418" rx="16"/>
<text class="zl" x="24" y="28">TLS 1.3 full handshake: 1 round trip after TCP</text>
<rect class="net" x="90" y="42" width="120" height="40" rx="10"/><text class="t" x="150" y="67" text-anchor="middle">Client</text>
<rect class="net" x="420" y="42" width="120" height="40" rx="10"/><text class="t" x="480" y="67" text-anchor="middle">Server</text>
<path class="line" d="M150 82 V400"/><path class="line" d="M480 82 V400"/>
<path class="line" d="M40 112 V240"/><text class="l" x="50" y="180">RTT 1</text>
<text class="l" x="315" y="104" text-anchor="middle">ClientHello + key_share</text><path class="arrow" d="M150 112 H478"/>
<text class="s" x="315" y="130" text-anchor="middle">(SNI, supported_versions, groups, ALPN)</text>
<text class="s" x="492" y="108">the client GUESSES a group and</text><text class="s" x="492" y="126">sends its public key at once</text>
<text class="l" x="315" y="160" text-anchor="middle">ServerHello + key_share</text><path class="arrow" d="M480 168 H152"/>
<rect class="ok" x="492" y="154" width="170" height="28" rx="10"/><text class="l" x="577" y="173" text-anchor="middle">keys are derived HERE</text>
<text class="m" x="315" y="210" text-anchor="middle">{EncryptedExtensions} {Certificate}</text>
<text class="m" x="315" y="228" text-anchor="middle">{CertificateVerify} {Finished}</text>
<path class="arrow" d="M480 240 H152"/>
<text class="s" x="492" y="228">everything from here on is</text><text class="s" x="492" y="246">encrypted, including the certificate</text>
<text class="m" x="315" y="280" text-anchor="middle">{Finished}</text><path class="arrow" d="M150 290 H478"/>
<rect class="ok" x="150" y="310" width="330" height="34" rx="10"/><text class="l" x="315" y="332" text-anchor="middle">application data</text>
<text class="s" x="492" y="332">the client may send right away</text>
<text class="m" x="315" y="368" text-anchor="middle">{NewSessionTicket}</text><path class="arrow" d="M480 378 H152"/>
<text class="s" x="492" y="382">for resumption, after the handshake</text>
</svg>
