<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d"><title id="t">TLS termination, re-encryption and passthrough at a load balancer</title><desc id="d">Termination: the client's TLS ends at the load balancer, which sends plain traffic to the backend; the load balancer sees HTTP and the backend sees the load balancer. Re-encryption: TLS from the client to the load balancer and a second TLS session from the load balancer to the backend, two separate TLS sessions. Passthrough: one TLS session from the client straight to the backend; the load balancer routes on SNI only.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="448" rx="16"/>
<text class="zl" x="24" y="34">termination</text><text class="s" x="160" y="34">LB sees HTTP; backend sees the LB</text>
<rect class="net" x="40" y="48" width="140" height="40" rx="10"/><text class="t" x="110" y="73" text-anchor="middle">client</text>
<path class="arrow" d="M180 68 H328"/>
<rect class="net" x="330" y="48" width="150" height="40" rx="10"/><text class="t" x="405" y="73" text-anchor="middle">load balancer</text>
<path class="arrow" d="M480 68 H618"/>
<rect class="net" x="620" y="48" width="140" height="40" rx="10"/><text class="t" x="690" y="73" text-anchor="middle">backend</text>
<rect class="l7" x="40" y="100" width="440" height="28" rx="10"/><text class="l" x="260" y="119" text-anchor="middle">TLS</text>
<rect class="box" x="490" y="100" width="270" height="28" rx="10"/><text class="l" x="625" y="119" text-anchor="middle">plain</text>
<text class="zl" x="24" y="180">re-encryption</text><text class="s" x="160" y="180">two separate TLS sessions</text>
<rect class="net" x="40" y="194" width="140" height="40" rx="10"/><text class="t" x="110" y="219" text-anchor="middle">client</text>
<path class="arrow" d="M180 214 H328"/>
<rect class="net" x="330" y="194" width="150" height="40" rx="10"/><text class="t" x="405" y="219" text-anchor="middle">load balancer</text>
<path class="arrow" d="M480 214 H618"/>
<rect class="net" x="620" y="194" width="140" height="40" rx="10"/><text class="t" x="690" y="219" text-anchor="middle">backend</text>
<rect class="l7" x="40" y="246" width="440" height="28" rx="10"/><text class="l" x="260" y="265" text-anchor="middle">TLS</text>
<rect class="l7" x="490" y="246" width="270" height="28" rx="10"/><text class="l" x="625" y="265" text-anchor="middle">TLS</text>
<text class="zl" x="24" y="326">passthrough</text><text class="s" x="160" y="326">LB routes on SNI only</text>
<rect class="net" x="40" y="340" width="140" height="40" rx="10"/><text class="t" x="110" y="365" text-anchor="middle">client</text>
<path class="arrow" d="M180 360 H328"/>
<rect class="net" x="330" y="340" width="150" height="40" rx="10"/><text class="t" x="405" y="365" text-anchor="middle">load balancer</text>
<path class="arrow" d="M480 360 H618"/>
<rect class="net" x="620" y="340" width="140" height="40" rx="10"/><text class="t" x="690" y="365" text-anchor="middle">backend</text>
<rect class="l7" x="40" y="392" width="720" height="28" rx="10"/><text class="l" x="400" y="411" text-anchor="middle">TLS</text>
</svg>
