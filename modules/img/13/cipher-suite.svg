<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" role="img" aria-labelledby="t d"><title id="t">Reading a TLS 1.2 cipher suite name</title><desc id="d">TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256, what the lab negotiated, splits into four parts: ECDHE is the key exchange; ECDSA is the certificate or signature type (RSA for an RSA certificate); AES_128_GCM is the bulk cipher and mode, AES-128 in GCM (AEAD); SHA256 is the hash for the key derivation (PRF).</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="268" rx="16"/>
<text class="m" x="24" y="32">TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256      (what the lab negotiated)</text>
<text class="t" x="22" y="81">TLS</text>
<rect class="l7" x="60" y="56" width="100" height="40" rx="10"/><text class="t" x="110" y="81" text-anchor="middle">ECDHE</text>
<rect class="l7" x="250" y="56" width="100" height="40" rx="10"/><text class="t" x="300" y="81" text-anchor="middle">ECDSA</text>
<text class="t" x="385" y="81" text-anchor="middle">WITH</text>
<rect class="l7" x="420" y="56" width="140" height="40" rx="10"/><text class="t" x="490" y="81" text-anchor="middle">AES_128_GCM</text>
<rect class="l7" x="640" y="56" width="100" height="40" rx="10"/><text class="t" x="690" y="81" text-anchor="middle">SHA256</text>
<path class="arrow" d="M110 96 V142"/><path class="arrow" d="M300 96 V142"/><path class="arrow" d="M490 96 V142"/><path class="arrow" d="M690 96 V142"/>
<rect class="box" x="20" y="144" width="180" height="104" rx="10"/><text class="l" x="110" y="172" text-anchor="middle">key exchange:</text><text class="s" x="110" y="192" text-anchor="middle">ECDHE</text>
<rect class="box" x="210" y="144" width="180" height="104" rx="10"/><text class="l" x="300" y="172" text-anchor="middle">certificate /</text><text class="l" x="300" y="190" text-anchor="middle">signature type:</text><text class="s" x="300" y="210" text-anchor="middle">ECDSA (RSA for an</text><text class="s" x="300" y="228" text-anchor="middle">RSA certificate)</text>
<rect class="box" x="400" y="144" width="180" height="104" rx="10"/><text class="l" x="490" y="172" text-anchor="middle">bulk cipher and mode:</text><text class="s" x="490" y="192" text-anchor="middle">AES-128 in GCM (AEAD)</text>
<rect class="box" x="600" y="144" width="180" height="104" rx="10"/><text class="l" x="690" y="172" text-anchor="middle">hash for the key</text><text class="l" x="690" y="190" text-anchor="middle">derivation (PRF)</text>
</svg>
