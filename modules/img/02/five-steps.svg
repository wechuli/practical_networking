<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 144" role="img" aria-labelledby="t d"><title id="t">The five steps of a fresh HTTPS request</title><desc id="d">Five steps run left to right: DNS resolution, TCP connection, TLS handshake, HTTP request and response, and connection close.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>

<rect class="bg" x="1" y="1" width="798" height="142" rx="16"/>
<text class="zl" x="24" y="30">A fresh HTTPS request over TCP</text>
<rect class="l7" x="20" y="44" width="136" height="80" rx="10"/><text class="l" x="88" y="66" text-anchor="middle">Step 1</text><text class="t" x="88" y="90" text-anchor="middle">DNS</text><text class="s" x="88" y="110" text-anchor="middle">resolution</text>
<path class="arrow" d="M156 84 H174"/>
<rect class="l4" x="176" y="44" width="136" height="80" rx="10"/><text class="l" x="244" y="66" text-anchor="middle">Step 2</text><text class="t" x="244" y="90" text-anchor="middle">TCP</text><text class="s" x="244" y="110" text-anchor="middle">connection</text>
<path class="arrow" d="M312 84 H330"/>
<rect class="box" x="332" y="44" width="136" height="80" rx="10"/><text class="l" x="400" y="66" text-anchor="middle">Step 3</text><text class="t" x="400" y="90" text-anchor="middle">TLS</text><text class="s" x="400" y="110" text-anchor="middle">handshake</text>
<path class="arrow" d="M468 84 H486"/>
<rect class="l7" x="488" y="44" width="136" height="80" rx="10"/><text class="l" x="556" y="66" text-anchor="middle">Step 4</text><text class="t" x="556" y="90" text-anchor="middle">HTTP</text><text class="s" x="556" y="110" text-anchor="middle">request/response</text>
<path class="arrow" d="M624 84 H642"/>
<rect class="l4" x="644" y="44" width="136" height="80" rx="10"/><text class="l" x="712" y="66" text-anchor="middle">Step 5</text><text class="t" x="712" y="90" text-anchor="middle">Connection</text><text class="s" x="712" y="110" text-anchor="middle">close</text>
</svg>
