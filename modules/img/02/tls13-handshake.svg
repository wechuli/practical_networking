<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="t d"><title id="t">TLS 1.3 handshake, 1 round trip</title><desc id="d">A sequence diagram between client and server. The ClientHello offers versions TLS 1.3 and 1.2, cipher suites, a key share (X25519), SNI example.com, which picks the certificate, and ALPN h2 and http/1.1, which offers HTTP versions. The server answers with ServerHello and its key share in clear text, then encrypted EncryptedExtensions carrying the ALPN choice h2, Certificate with the server's chain, CertificateVerify proving it holds the key, and Finished. The client verifies the chain, name and dates and sends its encrypted Finished; the HTTP request can follow immediately. Everything after that is encrypted. Braces mark messages that are already encrypted, so a capture shows the ClientHello and ServerHello but not the certificate.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>

<rect class="bg" x="1" y="1" width="798" height="638" rx="16"/>
<text class="zl" x="24" y="30">TLS 1.3 handshake — 1 round trip</text>
<rect class="net" x="50" y="44" width="140" height="48" rx="10"/><text class="t" x="120" y="73" text-anchor="middle">Client</text>
<rect class="net" x="400" y="44" width="140" height="48" rx="10"/><text class="t" x="470" y="73" text-anchor="middle">Server</text>
<path class="line" d="M120 92 V536 M470 92 V536"/>
<text class="l" x="295" y="122" text-anchor="middle">ClientHello</text>
<path class="arrow" d="M120 130 H468"/>
<rect class="box" x="140" y="142" width="310" height="96" rx="10"/>
<text class="s" x="156" y="164">versions: TLS 1.3, 1.2</text>
<text class="s" x="156" y="184">cipher suites, key share (X25519)</text>
<text class="m" x="156" y="204">SNI: example.com</text>
<text class="m" x="156" y="224">ALPN: h2, http/1.1</text>
<text class="s" x="490" y="204">← picks the cert</text>
<text class="s" x="490" y="224">← offers HTTP versions</text>
<text class="l" x="295" y="270" text-anchor="middle">ServerHello (+ key share)</text>
<path class="arrow" d="M470 278 H122"/>
<text class="s" x="490" y="282">clear text</text>
<text class="l" x="295" y="306" text-anchor="middle">{EncryptedExtensions}</text>
<path class="arrow" d="M470 314 H122"/>
<text class="s" x="490" y="318">← ALPN choice: "h2"</text>
<text class="l" x="295" y="342" text-anchor="middle">{Certificate}</text>
<path class="arrow" d="M470 350 H122"/>
<text class="s" x="490" y="354">← server's chain</text>
<text class="l" x="295" y="378" text-anchor="middle">{CertificateVerify}</text>
<path class="arrow" d="M470 386 H122"/>
<text class="s" x="490" y="390">← proves it holds the key</text>
<text class="l" x="295" y="414" text-anchor="middle">{Finished}</text>
<path class="arrow" d="M470 422 H122"/>
<text class="s" x="295" y="458" text-anchor="middle">client verifies chain, name, and dates</text>
<text class="l" x="295" y="494" text-anchor="middle">{Finished}</text>
<path class="arrow" d="M120 502 H468"/>
<text class="s" x="490" y="498">(the HTTP request can</text><text class="s" x="490" y="516">follow immediately)</text>
<rect class="ok" x="50" y="536" width="490" height="36" rx="10"/><text class="t" x="295" y="559" text-anchor="middle">Encrypted from here</text>
<text class="s" x="24" y="600">{braces} = already encrypted. A capture shows the ClientHello and ServerHello,</text>
<text class="s" x="24" y="620">but not the certificate.</text>
</svg>
