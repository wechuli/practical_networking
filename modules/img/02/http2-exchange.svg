<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">HTTP/2 request and response inside TLS</title><desc id="d">A sequence diagram between client and server. The client sends the connection preface and SETTINGS, then a HEADERS frame on stream 1 with :method GET, :path / and :authority example.com. The server works, then answers on stream 1 with a HEADERS frame (:status 200, content-type: text/html, content-length: 1256) and a DATA frame starting with the doctype. With HTTP/1.1 the same exchange is text, and subresources reuse the connection as more HTTP/2 streams or in sequence with HTTP/1.1.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>

<rect class="bg" x="1" y="1" width="798" height="518" rx="16"/>
<text class="zl" x="24" y="30">HTTP/2 request/response (inside TLS)</text>
<rect class="net" x="70" y="44" width="140" height="48" rx="10"/><text class="t" x="140" y="73" text-anchor="middle">Client</text>
<rect class="net" x="530" y="44" width="140" height="48" rx="10"/><text class="t" x="600" y="73" text-anchor="middle">Server</text>
<path class="line" d="M140 92 V412 M600 92 V412"/>
<text class="l" x="370" y="126" text-anchor="middle">connection preface + SETTINGS</text>
<path class="arrow" d="M140 134 H598"/>
<text class="l" x="370" y="166" text-anchor="middle">HEADERS (stream 1)</text>
<text class="m" x="370" y="184" text-anchor="middle">:method GET  :path /</text>
<text class="m" x="370" y="200" text-anchor="middle">:authority example.com</text>
<path class="arrow" d="M140 210 H598"/>
<text class="s" x="620" y="246">server works...</text>
<text class="l" x="370" y="274" text-anchor="middle">HEADERS (stream 1)</text>
<text class="m" x="370" y="292" text-anchor="middle">:status 200</text>
<text class="m" x="370" y="308" text-anchor="middle">content-type: text/html</text>
<text class="m" x="370" y="324" text-anchor="middle">content-length: 1256</text>
<path class="arrow" d="M600 334 H142"/>
<text class="l" x="370" y="366" text-anchor="middle">DATA (stream 1)</text>
<text class="m" x="370" y="384" text-anchor="middle">&lt;!doctype html&gt;...</text>
<path class="arrow" d="M600 394 H142"/>
<rect class="box" x="20" y="428" width="760" height="76" rx="10"/>
<text class="s" x="36" y="452">With HTTP/1.1 the same exchange is text: "GET / HTTP/1.1", "Host: ...", then "HTTP/1.1 200 OK".</text>
<text class="s" x="36" y="472">Subresources (CSS, JS, images) reuse this connection — as more HTTP/2 streams,</text>
<text class="s" x="36" y="492">or in sequence with HTTP/1.1.</text>
</svg>
