<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 484" role="img" aria-labelledby="t d"><title id="t">Full request timeline for a fresh connection</title><desc id="d">An illustrative timeline with a 15 ms round-trip time. The DNS query goes out at 0 ms and the answer, 203.0.113.10, arrives at 15 ms, when the TCP SYN is sent. The SYN-ACK arrives at 30 ms and the ACK completes the connection (1 RTT); the TLS ClientHello goes out at once. ServerHello through Finished arrive at 45 ms (1 RTT), and TLS Finished plus the HTTP request are sent together. With server think time the first response byte arrives at 60 ms (at least 1 RTT) and the last body byte at 65 ms. The close comes later. That is at least 3 round trips before the first byte, plus DNS on a cache miss; on a 150 ms intercontinental path the same request needs at least 450 ms.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>

<rect class="bg" x="1" y="1" width="798" height="482" rx="16"/>
<text class="zl" x="24" y="30">Full request timeline — illustrative, 15 ms RTT, fresh connection</text>
<text class="l" x="36" y="58">Time</text><text class="l" x="146" y="58">Event</text>
<text class="m" x="36" y="88">t=0ms</text><rect class="l7" x="130" y="70" width="650" height="26" rx="8"/><text class="s" x="146" y="88">DNS query sent (A and AAAA)</text>
<text class="m" x="36" y="120">t=15ms</text><rect class="l7" x="130" y="102" width="650" height="26" rx="8"/><text class="s" x="146" y="120">DNS answer: 203.0.113.10</text>
<text class="m" x="36" y="152">t=15ms</text><rect class="l4" x="130" y="134" width="650" height="26" rx="8"/><text class="s" x="146" y="152">TCP SYN sent</text>
<text class="m" x="36" y="184">t=30ms</text><rect class="l4" x="130" y="166" width="650" height="26" rx="8"/><text class="s" x="146" y="184">SYN-ACK received; ACK sent — connection established</text><text class="l" x="764" y="184" text-anchor="end">(1 RTT)</text>
<text class="m" x="36" y="216">t=30ms</text><rect class="box" x="130" y="198" width="650" height="26" rx="8"/><text class="s" x="146" y="216">TLS ClientHello sent</text>
<text class="m" x="36" y="248">t=45ms</text><rect class="box" x="130" y="230" width="650" height="26" rx="8"/><text class="s" x="146" y="248">ServerHello … Finished received</text><text class="l" x="764" y="248" text-anchor="end">(1 RTT)</text>
<text class="m" x="36" y="280">t=45ms</text><rect class="l7" x="130" y="262" width="650" height="26" rx="8"/><text class="s" x="146" y="280">TLS Finished + HTTP request sent together</text>
<text class="m" x="36" y="312">t=60ms</text><rect class="l7" x="130" y="294" width="650" height="26" rx="8"/><text class="s" x="146" y="312">+ server think time → first response byte arrives</text><text class="l" x="764" y="312" text-anchor="end">(≥ 1 RTT)</text>
<text class="m" x="36" y="344">t=65ms</text><rect class="l7" x="130" y="326" width="650" height="26" rx="8"/><text class="s" x="146" y="344">last body byte received</text>
<text class="m" x="36" y="376">later</text><rect class="l4" x="130" y="358" width="650" height="26" rx="8"/><text class="s" x="146" y="376">close (after the client is done, or an idle timeout)</text>
<rect class="warn" x="20" y="400" width="760" height="64" rx="10"/>
<text class="s" x="36" y="425">At least 3 round trips before the first byte, plus DNS on a cache miss.</text>
<text class="s" x="36" y="446">On a 150 ms intercontinental path the same request needs ≥ 450 ms.</text>
</svg>
