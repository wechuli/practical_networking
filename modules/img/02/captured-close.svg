<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 364" role="img" aria-labelledby="t d"><title id="t">Captured connection close (curl 8.5, loopback)</title><desc id="d">A sequence diagram of a real close. The client sends a TLS close_notify alert (no more TLS data from me) and a FIN because curl has closed its socket. The server sends an ACK, then answers with its own TLS close_notify alert. That alert reaches a socket that no longer exists, so the client kernel answers with an RST.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>

<rect class="bg" x="1" y="1" width="798" height="362" rx="16"/>
<text class="zl" x="24" y="30">Captured close (curl 8.5, loopback)</text>
<rect class="net" x="70" y="44" width="140" height="48" rx="10"/><text class="t" x="140" y="73" text-anchor="middle">Client</text>
<rect class="net" x="430" y="44" width="140" height="48" rx="10"/><text class="t" x="500" y="73" text-anchor="middle">Server</text>
<path class="line" d="M140 92 V340 M500 92 V340"/>
<text class="l" x="320" y="128" text-anchor="middle">TLS Alert: close_notify</text>
<path class="arrow" d="M140 136 H498"/>
<text class="s" x="520" y="140">"no more TLS data from me"</text>
<text class="l" x="320" y="170" text-anchor="middle">FIN</text>
<path class="arrow" d="M140 178 H498"/>
<text class="s" x="520" y="182">curl has closed its socket</text>
<text class="l" x="320" y="212" text-anchor="middle">ACK</text>
<path class="arrow" d="M500 220 H142"/>
<text class="l" x="320" y="254" text-anchor="middle">TLS Alert: close_notify</text>
<path class="arrow" d="M500 262 H142"/>
<text class="s" x="520" y="266">server answers the alert...</text>
<text class="l" x="320" y="296" text-anchor="middle">RST</text>
<path class="arrow" d="M140 304 H498"/>
<text class="s" x="520" y="300">...to a socket that no longer</text>
<text class="s" x="520" y="318">exists, so the client kernel</text>
<text class="s" x="520" y="336">answers with a reset</text>
</svg>
