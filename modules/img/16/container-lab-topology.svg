<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-labelledby="t d"><title id="t">The hand-built container lab</title><desc id="d">Two containers, c1 at 10.88.0.2 and c2 at 10.88.0.3, attach to bridge cbr0 at 10.88.0.1 inside a host namespace. The host's uplink eth1 at 198.18.140.1 reaches the internet namespace at 198.18.140.10, which runs a web server on port 8080 and a hold server on port 9000.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="238" rx="16"/>
<rect class="net" x="20" y="40" width="150" height="60" rx="10"/><text class="t" x="95" y="64" text-anchor="middle">c1</text><text class="m" x="95" y="86" text-anchor="middle">10.88.0.2</text>
<rect class="net" x="20" y="140" width="150" height="60" rx="10"/><text class="t" x="95" y="164" text-anchor="middle">c2</text><text class="m" x="95" y="186" text-anchor="middle">10.88.0.3</text>
<rect class="zone" x="226" y="24" width="338" height="192" rx="12"/><text class="zl" x="242" y="48">host</text>
<path class="line" d="M170 70 L250 108 M170 170 L250 132"/>
<rect class="net" x="250" y="90" width="130" height="60" rx="10"/><text class="t" x="315" y="114" text-anchor="middle">cbr0</text><text class="m" x="315" y="136" text-anchor="middle">10.88.0.1</text>
<path class="line" d="M380 120 H410"/>
<rect class="net" x="410" y="90" width="134" height="60" rx="10"/><text class="t" x="477" y="114" text-anchor="middle">eth1</text><text class="m" x="477" y="136" text-anchor="middle">198.18.140.1</text>
<path class="line" d="M544 120 H620"/>
<rect class="net" x="620" y="65" width="160" height="110" rx="10"/><text class="t" x="700" y="90" text-anchor="middle">internet</text><text class="m" x="700" y="112" text-anchor="middle">198.18.140.10</text><text class="m" x="700" y="138" text-anchor="middle">web :8080</text><text class="m" x="700" y="158" text-anchor="middle">hold :9000</text>
