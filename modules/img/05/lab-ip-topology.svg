<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" role="img" aria-labelledby="t d"><title id="t">The ip.json lab topology</title><desc id="d">The client 198.18.5.1/24 connects to the router's eth0 (.254); the router's eth1 (.254) connects to the server 198.19.5.2/24, and that link has an MTU of 1400. Separately, host a 198.51.100.10/25 and host b 198.51.100.200/25 share one cable but sit in two different /25 subnets.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="248" rx="16"/>
<rect class="net" x="20" y="40" width="190" height="60" rx="10"/><text class="t" x="115" y="64" text-anchor="middle">client</text><text class="m" x="115" y="86" text-anchor="middle">198.18.5.1/24</text>
<path class="line" d="M210 70 H310"/>
<text class="m" x="300" y="60" text-anchor="end">eth0</text><text class="m" x="300" y="88" text-anchor="end">.254</text>
<rect class="net" x="310" y="40" width="180" height="60" rx="10"/><text class="t" x="400" y="76" text-anchor="middle">router</text>
<path class="line" d="M490 70 H590"/>
<text class="m" x="500" y="60">eth1</text><text class="m" x="500" y="88">.254</text>
<rect class="net" x="590" y="40" width="190" height="60" rx="10"/><text class="t" x="685" y="64" text-anchor="middle">server</text><text class="m" x="685" y="86" text-anchor="middle">198.19.5.2/24</text>
<text class="l" x="540" y="124" text-anchor="middle">MTU 1400 on this link</text>
<rect class="net" x="20" y="160" width="250" height="60" rx="10"/><text class="t" x="145" y="184" text-anchor="middle">a</text><text class="m" x="145" y="206" text-anchor="middle">198.51.100.10/25</text>
<path class="line" d="M270 190 H530"/>
<text class="s" x="400" y="180" text-anchor="middle">(one cable, two /25s)</text>
<rect class="net" x="530" y="160" width="250" height="60" rx="10"/><text class="t" x="655" y="184" text-anchor="middle">b</text><text class="m" x="655" y="206" text-anchor="middle">198.51.100.200/25</text>
</svg>
