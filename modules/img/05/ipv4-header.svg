<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d"><title id="t">IPv4 header layout</title><desc id="d">The IPv4 header is 20 bytes minimum, drawn as rows of 32 bits numbered 0 to 31. Row 1: Version (4 bits), IHL (4), DSCP (6), ECN (2), Total Length (16). Row 2: Identification (16), Flags (3), Fragment Offset (13). Row 3: Time to Live (8), Protocol (8), Header Checksum (16). Row 4: Source IP Address (32). Row 5: Destination IP Address (32). An optional Options row follows only if IHL is greater than 5.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="398" rx="16"/>
<text class="zl" x="24" y="32">IPv4 HEADER (20 bytes minimum)</text>
<text class="m" x="110" y="64" text-anchor="middle">0</text><text class="m" x="130" y="64" text-anchor="middle">1</text><text class="m" x="150" y="64" text-anchor="middle">2</text><text class="m" x="170" y="64" text-anchor="middle">3</text><text class="m" x="190" y="64" text-anchor="middle">4</text><text class="m" x="210" y="64" text-anchor="middle">5</text><text class="m" x="230" y="64" text-anchor="middle">6</text><text class="m" x="250" y="64" text-anchor="middle">7</text><text class="m" x="270" y="64" text-anchor="middle">8</text><text class="m" x="290" y="64" text-anchor="middle">9</text><text class="m" x="310" y="64" text-anchor="middle">10</text><text class="m" x="330" y="64" text-anchor="middle">11</text><text class="m" x="350" y="64" text-anchor="middle">12</text><text class="m" x="370" y="64" text-anchor="middle">13</text><text class="m" x="390" y="64" text-anchor="middle">14</text><text class="m" x="410" y="64" text-anchor="middle">15</text><text class="m" x="430" y="64" text-anchor="middle">16</text><text class="m" x="450" y="64" text-anchor="middle">17</text><text class="m" x="470" y="64" text-anchor="middle">18</text><text class="m" x="490" y="64" text-anchor="middle">19</text><text class="m" x="510" y="64" text-anchor="middle">20</text><text class="m" x="530" y="64" text-anchor="middle">21</text><text class="m" x="550" y="64" text-anchor="middle">22</text><text class="m" x="570" y="64" text-anchor="middle">23</text><text class="m" x="590" y="64" text-anchor="middle">24</text><text class="m" x="610" y="64" text-anchor="middle">25</text><text class="m" x="630" y="64" text-anchor="middle">26</text><text class="m" x="650" y="64" text-anchor="middle">27</text><text class="m" x="670" y="64" text-anchor="middle">28</text><text class="m" x="690" y="64" text-anchor="middle">29</text><text class="m" x="710" y="64" text-anchor="middle">30</text><text class="m" x="730" y="64" text-anchor="middle">31</text>
<text class="zl" x="24" y="103">Row 1</text><rect class="l3" x="100" y="76" width="80" height="44" rx="4"/><text class="l" x="140" y="103" text-anchor="middle">Version</text><rect class="l3" x="180" y="76" width="80" height="44" rx="4"/><text class="l" x="220" y="103" text-anchor="middle">IHL</text><rect class="l3" x="260" y="76" width="120" height="44" rx="4"/><text class="l" x="320" y="103" text-anchor="middle">DSCP</text><rect class="l3" x="380" y="76" width="40" height="44" rx="4"/><text class="m" x="400" y="103" text-anchor="middle">ECN</text><rect class="l3" x="420" y="76" width="320" height="44" rx="4"/><text class="l" x="580" y="103" text-anchor="middle">Total Length</text><text class="zl" x="24" y="147">Row 2</text><rect class="l3" x="100" y="120" width="320" height="44" rx="4"/><text class="l" x="260" y="147" text-anchor="middle">Identification</text><rect class="l3" x="420" y="120" width="60" height="44" rx="4"/><text class="l" x="450" y="147" text-anchor="middle">Flags</text><rect class="l3" x="480" y="120" width="260" height="44" rx="4"/><text class="l" x="610" y="147" text-anchor="middle">Fragment Offset</text><text class="zl" x="24" y="191">Row 3</text><rect class="l3" x="100" y="164" width="160" height="44" rx="4"/><text class="l" x="180" y="191" text-anchor="middle">Time to Live</text><rect class="l3" x="260" y="164" width="160" height="44" rx="4"/><text class="l" x="340" y="191" text-anchor="middle">Protocol</text><rect class="l3" x="420" y="164" width="320" height="44" rx="4"/><text class="l" x="580" y="191" text-anchor="middle">Header Checksum</text><text class="zl" x="24" y="235">Row 4</text><rect class="l3" x="100" y="208" width="640" height="44" rx="4"/><text class="l" x="420" y="235" text-anchor="middle">Source IP Address</text><text class="zl" x="24" y="279">Row 5</text><rect class="l3" x="100" y="252" width="640" height="44" rx="4"/><text class="l" x="420" y="279" text-anchor="middle">Destination IP Address</text><text class="zl" x="24" y="323">Optional</text><rect class="zone" x="100" y="296" width="640" height="44" rx="4"/><text class="l" x="420" y="323" text-anchor="middle">Options (if IHL > 5)</text>
<text class="s" x="100" y="370">Rows 1–5 are the fixed 20-byte header (5 × 32 bits). Options follow only if IHL &gt; 5.</text>
</svg>
