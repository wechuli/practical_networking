<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d"><title id="t">Subnet design for a three-tier app in a VPC</title><desc id="d">A VPC with CIDR 10.0.0.0/16 (65,534 usable addresses) spans two availability zones. Zone A has a public subnet 10.0.1.0/24 (ALB, NAT GW), a private subnet 10.0.10.0/24 (app servers) and a data subnet 10.0.20.0/24 (RDS, Redis). Zone B mirrors it with 10.0.3.0/24, 10.0.11.0/24 and 10.0.21.0/24. Gaps at 10.0.2.0, 10.0.4–9.0, 10.0.12–19.0 and so on are left intentionally for future expansion.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="468" rx="16"/>
<text class="zl" x="24" y="30">VPC CIDR: 10.0.0.0/16  (65,534 usable addresses)</text>
<rect class="zone" x="20" y="44" width="760" height="404" rx="12"/><text class="zl" x="36" y="68">VPC: 10.0.0.0/16</text>
<rect class="zone" x="40" y="82" width="340" height="282" rx="12"/><text class="zl" x="56" y="104">Availability Zone A</text>
<rect class="net" x="60" y="116" width="300" height="72" rx="10"/><text class="t" x="80" y="140">Public Subnet</text><text class="m" x="80" y="160">10.0.1.0/24</text><text class="s" x="80" y="178">(ALB, NAT GW)</text>
<rect class="box" x="60" y="196" width="300" height="72" rx="10"/><text class="t" x="80" y="220">Private Subnet</text><text class="m" x="80" y="240">10.0.10.0/24</text><text class="s" x="80" y="258">(App servers)</text>
<rect class="box" x="60" y="276" width="300" height="72" rx="10"/><text class="t" x="80" y="300">Data Subnet</text><text class="m" x="80" y="320">10.0.20.0/24</text><text class="s" x="80" y="338">(RDS, Redis)</text>
<rect class="zone" x="420" y="82" width="340" height="282" rx="12"/><text class="zl" x="436" y="104">Availability Zone B</text>
<rect class="net" x="440" y="116" width="300" height="72" rx="10"/><text class="t" x="460" y="140">Public Subnet</text><text class="m" x="460" y="160">10.0.3.0/24</text><text class="s" x="460" y="178">(ALB, NAT GW)</text>
<rect class="box" x="440" y="196" width="300" height="72" rx="10"/><text class="t" x="460" y="220">Private Subnet</text><text class="m" x="460" y="240">10.0.11.0/24</text><text class="s" x="460" y="258">(App servers)</text>
<rect class="box" x="440" y="276" width="300" height="72" rx="10"/><text class="t" x="460" y="300">Data Subnet</text><text class="m" x="460" y="320">10.0.21.0/24</text><text class="s" x="460" y="338">(RDS, Redis)</text>
<text class="s" x="40" y="398">Gap at 10.0.2.0, 10.0.4–9.0, 10.0.12–19.0, etc.</text>
<text class="s" x="40" y="420">Left intentionally for future expansion.</text>
</svg>
