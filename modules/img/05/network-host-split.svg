<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d"><title id="t">Network part and host part of an IPv4 address</title><desc id="d">IP address 192.168.1.100 with subnet mask 255.255.255.0 (/24). The network part 192.168.1 identifies the network; the host part .100 identifies the device on that network. All devices with 192.168.1.x, where x is 1 to 254, are on the same network; a router is needed to reach 192.168.2.x, which is a different network.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="358" rx="16"/>
<text class="m" x="40" y="36">IP Address:</text><text class="m" x="150" y="36">192.168.1.100</text>
<text class="m" x="40" y="56">Subnet Mask:</text><text class="m" x="150" y="56">255.255.255.0  (/24)</text>
<rect class="l3" x="40" y="74" width="490" height="96" rx="10"/>
<text class="t" x="285" y="102" text-anchor="middle">192.168.1</text>
<text class="l" x="285" y="126" text-anchor="middle">Network part</text>
<text class="s" x="285" y="146" text-anchor="middle">identifies the network</text>
<rect class="box" x="540" y="74" width="220" height="96" rx="10"/>
<text class="t" x="650" y="102" text-anchor="middle">.100</text>
<text class="l" x="650" y="126" text-anchor="middle">Host part</text>
<text class="s" x="650" y="144" text-anchor="middle">identifies the device on</text>
<text class="s" x="650" y="160" text-anchor="middle">that network</text>
<text class="zl" x="24" y="204">Reaching another network</text>
<rect class="l3" x="40" y="216" width="250" height="62" rx="10"/><text class="t" x="165" y="242" text-anchor="middle">192.168.1.x</text><text class="s" x="165" y="262" text-anchor="middle">x = 1–254, one network</text>
<path class="arrow" d="M290 247 H326"/>
<rect class="net" x="330" y="216" width="140" height="62" rx="10"/><text class="t" x="400" y="252" text-anchor="middle">Router</text>
<path class="arrow" d="M470 247 H506"/>
<rect class="box" x="510" y="216" width="250" height="62" rx="10"/><text class="t" x="635" y="242" text-anchor="middle">192.168.2.x</text><text class="s" x="635" y="262" text-anchor="middle">a different network</text>
<text class="s" x="40" y="308">All devices with 192.168.1.x (where x = 1–254) are on the same network.</text>
<text class="s" x="40" y="330">A router is needed to reach 192.168.2.x — that is a different network.</text>
</svg>
