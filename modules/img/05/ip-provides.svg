<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d"><title id="t">What IP provides and what it does not</title><desc id="d">Two panels. IP provides logical addressing, routing, fragmentation (IPv4 only), TTL, protocol muxing and error reporting through ICMP. IP does not provide reliable delivery, ordering, duplicate detection, flow control, connection state or error correction. Below, a stack shows TCP on top of IP on top of Ethernet: TCP adds reliability, ordering and flow control; IP gives addressing and routing on a best-effort basis; Ethernet gives local delivery by MAC address.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="598" rx="16"/>
<text class="zl" x="24" y="30">What IP provides vs what it does not</text>
<rect class="ok" x="20" y="44" width="372" height="372" rx="10"/>
<text class="t" x="40" y="72">IP provides</text>
<text class="l" x="40" y="100">✓ Logical addressing</text><text class="s" x="58" y="118">every host has a unique address</text>
<text class="l" x="40" y="146">✓ Routing</text><text class="s" x="58" y="164">hop-by-hop forwarding to dest</text>
<text class="l" x="40" y="192">✓ Fragmentation</text><text class="s" x="58" y="210">splitting packets that are too large for a</text><text class="s" x="58" y="227">link (IPv4 only)</text>
<text class="l" x="40" y="255">✓ TTL</text><text class="s" x="58" y="273">prevents infinite routing loops</text>
<text class="l" x="40" y="301">✓ Protocol muxing</text><text class="s" x="58" y="319">tells the next layer whether payload is</text><text class="s" x="58" y="336">TCP, UDP, or ICMP</text>
<text class="l" x="40" y="364">✓ Error reporting</text><text class="s" x="58" y="382">via its companion, ICMP</text><text class="s" x="58" y="399">(not a delivery guarantee)</text>
<rect class="warn" x="408" y="44" width="372" height="372" rx="10"/>
<text class="t" x="428" y="72">IP does not provide</text>
<text class="l" x="428" y="100">✗ Reliable delivery</text><text class="s" x="446" y="118">packets can be silently dropped</text>
<text class="l" x="428" y="146">✗ Ordering</text><text class="s" x="446" y="164">packets may arrive out of order</text>
<text class="l" x="428" y="192">✗ Duplicate detection</text><text class="s" x="446" y="210">same packet may arrive twice</text>
<text class="l" x="428" y="238">✗ Flow control</text><text class="s" x="446" y="256">no mechanism to slow the sender</text>
<text class="l" x="428" y="284">✗ Connection state</text><text class="s" x="446" y="302">each packet is independent</text>
<text class="l" x="428" y="330">✗ Error correction</text><text class="s" x="446" y="348">IPv4 detects header corruption only</text><text class="s" x="446" y="365">(header checksum) and drops;</text><text class="s" x="446" y="382">IPv6 has no header checksum</text>
<text class="zl" x="24" y="448">These missing guarantees are provided by TCP (Layer 4):</text>
<rect class="l4" x="200" y="462" width="200" height="40" rx="10"/><text class="t" x="300" y="487" text-anchor="middle">TCP</text>
<rect class="l3" x="200" y="502" width="200" height="40" rx="10"/><text class="t" x="300" y="527" text-anchor="middle">IP</text>
<rect class="l2" x="200" y="542" width="200" height="40" rx="10"/><text class="t" x="300" y="567" text-anchor="middle">Ethernet</text>
<path class="arrow" d="M436 482 H406"/><text class="s" x="446" y="486">reliability, ordering, flow control</text>
<path class="arrow" d="M436 522 H406"/><text class="s" x="446" y="526">addressing and routing (best effort)</text>
<path class="arrow" d="M436 562 H406"/><text class="s" x="446" y="566">local delivery by MAC address</text>
</svg>
