<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" role="img" aria-labelledby="t d"><title id="t">An IPv4 address in binary and dotted decimal</title><desc id="d">The address 192.168.1.100 is four octets: 11000000 is 192, 10101000 is 168, 00000001 is 1 and 01100100 is 100. 32 bits in total give 2 to the 32, or 4,294,967,296, possible addresses: about 4.3 billion, not enough for the modern internet.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="248" rx="16"/>
<text class="zl" x="24" y="32">192.168.1.100: four octets, written in dotted decimal</text>
<text class="l" x="24" y="104">Binary</text>
<text class="l" x="24" y="132">Decimal</text>
<rect class="l3" x="110" y="52" width="145" height="96" rx="10"/><text class="s" x="182" y="76" text-anchor="middle">octet 1</text><text class="m" x="182" y="104" text-anchor="middle">11000000</text><text class="t" x="182" y="132" text-anchor="middle">192</text>
<text class="t" x="267" y="118" text-anchor="middle">.</text>
<rect class="l3" x="279" y="52" width="145" height="96" rx="10"/><text class="s" x="351" y="76" text-anchor="middle">octet 2</text><text class="m" x="351" y="104" text-anchor="middle">10101000</text><text class="t" x="351" y="132" text-anchor="middle">168</text>
<text class="t" x="436" y="118" text-anchor="middle">.</text>
<rect class="l3" x="448" y="52" width="145" height="96" rx="10"/><text class="s" x="520" y="76" text-anchor="middle">octet 3</text><text class="m" x="520" y="104" text-anchor="middle">00000001</text><text class="t" x="520" y="132" text-anchor="middle">1</text>
<text class="t" x="605" y="118" text-anchor="middle">.</text>
<rect class="l3" x="617" y="52" width="145" height="96" rx="10"/><text class="s" x="689" y="76" text-anchor="middle">octet 4</text><text class="m" x="689" y="104" text-anchor="middle">01100100</text><text class="t" x="689" y="132" text-anchor="middle">100</text>
<rect class="box" x="110" y="168" width="652" height="62" rx="10"/>
<text class="l" x="436" y="194" text-anchor="middle">32 bits total → 2^32 = 4,294,967,296 possible addresses</text>
<text class="s" x="436" y="214" text-anchor="middle">(About 4.3 billion — not enough for the modern internet)</text>
</svg>
