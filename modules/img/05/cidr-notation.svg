<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="t d"><title id="t">How to read CIDR notation</title><desc id="d">Three prefixes drawn as 32-bit bars. 192.168.1.0/24: 24 bits are the network portion and 32 minus 24 = 8 bits are the host portion, so 2^8 = 256 addresses (254 usable, 2 reserved). 10.0.0.0/16: 16 network bits and 16 host bits, 2^16 = 65,536 addresses (65,534 usable). 10.0.0.0/8: 8 network bits and 24 host bits, 2^24 = 16,777,216 addresses.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="338" rx="16"/>
<text class="zl" x="24" y="32">CIDR notation: the /n counts network bits from the left</text>
<text class="m" x="30" y="78">192.168.1.0/24</text>
<rect class="l3" x="200" y="58" width="432" height="30" rx="6"/><text class="l" x="416" y="78" text-anchor="middle">24 network bits</text>
<rect class="box" x="632" y="58" width="144" height="30" rx="6"/><text class="l" x="704" y="78" text-anchor="middle">8 host bits</text>
<text class="s" x="200" y="110">32 − 24 = 8 bits are the host portion</text>
<text class="s" x="200" y="128">2^8 = 256 addresses (254 usable, 2 reserved)</text>
<text class="m" x="30" y="174">10.0.0.0/16</text>
<rect class="l3" x="200" y="154" width="288" height="30" rx="6"/><text class="l" x="344" y="174" text-anchor="middle">16 network bits</text>
<rect class="box" x="488" y="154" width="288" height="30" rx="6"/><text class="l" x="632" y="174" text-anchor="middle">16 host bits</text>
<text class="s" x="200" y="206">32 − 16 = 16 bits are the host portion</text>
<text class="s" x="200" y="224">2^16 = 65,536 addresses (65,534 usable)</text>
<text class="m" x="30" y="270">10.0.0.0/8</text>
<rect class="l3" x="200" y="250" width="144" height="30" rx="6"/><text class="l" x="272" y="270" text-anchor="middle">8 network bits</text>
<rect class="box" x="344" y="250" width="432" height="30" rx="6"/><text class="l" x="560" y="270" text-anchor="middle">24 host bits</text>
<text class="s" x="200" y="302">32 − 8 = 24 bits are the host portion</text>
<text class="s" x="200" y="320">2^24 = 16,777,216 addresses</text>
</svg>
