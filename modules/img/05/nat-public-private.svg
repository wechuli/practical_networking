<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d"><title id="t">How NAT connects a private network to the public internet</title><desc id="d">A private network 10.0.1.0/24 holds 10.0.1.10 (Web App), 10.0.1.11 (API) and 10.0.1.12 (Worker). They reach a web server at 198.51.100.80 on the public internet through a NAT gateway whose public IP is 203.0.113.5. Inside the VPC packets have source 10.0.1.10; after NAT they have source 203.0.113.5. The internet sees 203.0.113.5, never 10.0.1.10, and the NAT gateway keeps a translation table to route replies back.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="398" rx="16"/>
<rect class="zone" x="20" y="20" width="300" height="220" rx="12"/><text class="zl" x="36" y="44">Private Network (10.0.1.0/24)</text>
<rect class="net" x="40" y="62" width="260" height="44" rx="10"/><text class="m" x="58" y="89">10.0.1.10</text><text class="s" x="166" y="89">(Web App)</text>
<rect class="net" x="40" y="122" width="260" height="44" rx="10"/><text class="m" x="58" y="149">10.0.1.11</text><text class="s" x="166" y="149">(API)</text>
<rect class="net" x="40" y="182" width="260" height="44" rx="10"/><text class="m" x="58" y="209">10.0.1.12</text><text class="s" x="166" y="209">(Worker)</text>
<path class="line" d="M300 84 H320 V144 H350"/><path class="line" d="M300 204 H320 V144"/><path class="line" d="M300 144 H350"/>
<rect class="net" x="350" y="102" width="150" height="84" rx="10"/><text class="t" x="425" y="128" text-anchor="middle">NAT GW</text><text class="m" x="425" y="150" text-anchor="middle">203.0.113.5</text><text class="s" x="425" y="170" text-anchor="middle">(public IP)</text>
<path class="arrow" d="M500 144 H546"/>
<rect class="zone" x="530" y="20" width="250" height="220" rx="12"/><text class="zl" x="546" y="44">Public Internet</text>
<rect class="box" x="550" y="104" width="210" height="80" rx="10"/><text class="t" x="655" y="136" text-anchor="middle">Web Server</text><text class="m" x="655" y="160" text-anchor="middle">198.51.100.80</text>
<rect class="box" x="20" y="262" width="760" height="120" rx="10"/>
<text class="s" x="40" y="290">Inside the VPC: packets have source <tspan class="m">10.0.1.10</tspan></text>
<text class="s" x="40" y="314">After NAT: packets have source <tspan class="m">203.0.113.5</tspan></text>
<text class="s" x="40" y="338">The internet sees 203.0.113.5, never 10.0.1.10.</text>
<text class="s" x="40" y="362">The NAT gateway maintains a translation table to route replies back.</text>
</svg>
