<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d"><title id="t">IPv4 fragmentation without the DF bit</title><desc id="d">An original 4000-byte packet meets a link with an MTU of 1500 bytes. Without the Don't Fragment bit, the router splits it into three fragments that share ID 12345: fragment 1 is 1500 bytes with offset 0 and MF=1, fragment 2 is 1500 bytes with offset 185 and MF=1, fragment 3 is 1040 bytes with offset 370 and MF=0. The same ID links them, the offset tells the order, and MF=0 marks the last one.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="328" rx="16"/>
<text class="zl" x="24" y="30">Original packet: 4000 bytes · MTU of link: 1500 bytes</text>
<text class="l" x="24" y="52">WITHOUT DF (Don't Fragment) bit set</text>
<rect class="l3" x="280" y="62" width="240" height="40" rx="10"/><text class="l" x="400" y="87" text-anchor="middle">Original: 4000 bytes</text>
<path class="arrow" d="M400 102 V122"/>
<rect class="net" x="320" y="126" width="160" height="36" rx="10"/><text class="l" x="400" y="149" text-anchor="middle">Router fragments</text>
<path class="arrow" d="M400 162 V172 H145 V190"/><path class="arrow" d="M400 162 V190"/><path class="arrow" d="M400 162 V172 H655 V190"/>
<rect class="l3" x="30" y="194" width="230" height="96" rx="10"/><text class="t" x="145" y="218" text-anchor="middle">Fragment 1</text><text class="m" x="145" y="240" text-anchor="middle">1500 bytes</text><text class="m" x="145" y="258" text-anchor="middle">Offset=0, MF=1</text><text class="m" x="145" y="276" text-anchor="middle">ID=12345</text>
<rect class="l3" x="285" y="194" width="230" height="96" rx="10"/><text class="t" x="400" y="218" text-anchor="middle">Fragment 2</text><text class="m" x="400" y="240" text-anchor="middle">1500 bytes</text><text class="m" x="400" y="258" text-anchor="middle">Offset=185, MF=1</text><text class="m" x="400" y="276" text-anchor="middle">ID=12345</text>
<rect class="l3" x="540" y="194" width="230" height="96" rx="10"/><text class="t" x="655" y="218" text-anchor="middle">Fragment 3</text><text class="m" x="655" y="240" text-anchor="middle">1040 bytes</text><text class="m" x="655" y="258" text-anchor="middle">Offset=370, MF=0</text><text class="m" x="655" y="276" text-anchor="middle">ID=12345</text>
<text class="s" x="145" y="312" text-anchor="middle">Same ID links them.</text>
<text class="s" x="400" y="312" text-anchor="middle">Offset tells order.</text>
<text class="s" x="655" y="312" text-anchor="middle">MF=0 means last.</text>
</svg>
