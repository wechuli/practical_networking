<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d"><title id="t">Address layout of the three worked examples</title><desc id="d">192.168.1.0/24: .0 is the network address (reserved), .1 to .254 are the 254 usable host addresses, .255 is the broadcast address (reserved). 10.0.0.0/20: 10.0.0.0 is the network address, 10.0.0.1 is the first usable host, 10.0.15.254 the last usable host, 10.0.15.255 the broadcast address; 4,094 usable hosts in total. 172.16.0.0/28: .0 is the network, .1 to .14 are hosts, .15 is broadcast; only 14 usable addresses.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="358" rx="16"/>
<text class="zl" x="40" y="32">Example 1: 192.168.1.0/24</text>
<rect class="box" x="40" y="44" width="166" height="70" rx="10"/><text class="m" x="123" y="66" text-anchor="middle">.0</text><text class="s" x="123" y="86" text-anchor="middle">Network address</text><text class="s" x="123" y="103" text-anchor="middle">(reserved)</text>
<rect class="ok" x="212" y="44" width="376" height="70" rx="10"/><text class="m" x="400" y="66" text-anchor="middle">.1 – .254</text><text class="s" x="400" y="86" text-anchor="middle">Usable host addresses (254)</text>
<rect class="box" x="594" y="44" width="166" height="70" rx="10"/><text class="m" x="677" y="66" text-anchor="middle">.255</text><text class="s" x="677" y="86" text-anchor="middle">Broadcast address</text><text class="s" x="677" y="103" text-anchor="middle">(reserved)</text>
<text class="zl" x="40" y="146">Example 2: 10.0.0.0/20</text>
<rect class="box" x="40" y="158" width="166" height="70" rx="10"/><text class="m" x="123" y="180" text-anchor="middle">10.0.0.0</text><text class="s" x="123" y="200" text-anchor="middle">Network address</text>
<rect class="ok" x="212" y="158" width="376" height="70" rx="10"/><text class="m" x="400" y="180" text-anchor="middle">10.0.0.1 – 10.0.15.254</text><text class="s" x="400" y="200" text-anchor="middle">First usable host – last usable host</text><text class="s" x="400" y="217" text-anchor="middle">Total: 4,094 usable hosts</text>
<rect class="box" x="594" y="158" width="166" height="70" rx="10"/><text class="m" x="677" y="180" text-anchor="middle">10.0.15.255</text><text class="s" x="677" y="200" text-anchor="middle">Broadcast address</text>
<text class="zl" x="40" y="260">Example 3: 172.16.0.0/28</text>
<rect class="box" x="40" y="272" width="166" height="70" rx="10"/><text class="m" x="123" y="294" text-anchor="middle">.0</text><text class="s" x="123" y="314" text-anchor="middle">Network</text>
<rect class="ok" x="212" y="272" width="376" height="70" rx="10"/><text class="m" x="400" y="294" text-anchor="middle">.1 – .14</text><text class="s" x="400" y="314" text-anchor="middle">Hosts</text><text class="s" x="400" y="331" text-anchor="middle">Only 14 usable addresses</text>
<rect class="box" x="594" y="272" width="166" height="70" rx="10"/><text class="m" x="677" y="294" text-anchor="middle">.15</text><text class="s" x="677" y="314" text-anchor="middle">Bcast</text>
</svg>
