<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="t d"><title id="t">A dual-stack server</title><desc id="d">A server's eth0 has IPv4 10.0.1.50/24, IPv6 2001:db8:1::50/64 and the link-local IPv6 address fe80::a1b2:c3d4:e5f6:7890. Applications listen on 0.0.0.0:443 for all IPv4 addresses and on [::]:443 for all IPv6 addresses, and on Linux IPv4 too unless IPV6_V6ONLY is set. netstat prints [::]:443 as :::443.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="258" rx="16"/>
<text class="zl" x="24" y="30">Most production environments run both IPv4 and IPv6 simultaneously.</text>
<rect class="net" x="20" y="44" width="760" height="196" rx="10"/>
<text class="t" x="40" y="70">Server</text>
<rect class="l3" x="40" y="84" width="350" height="138" rx="10"/>
<text class="l" x="58" y="108">eth0:</text>
<text class="m" x="58" y="132">IPv4: 10.0.1.50/24</text>
<text class="m" x="58" y="154">IPv6: 2001:db8:1::50/64</text>
<text class="m" x="58" y="176">IPv6: fe80::a1b2:c3d4:e5f6:7890</text>
<text class="s" x="58" y="196">(link-local)</text>
<rect class="l4" x="410" y="84" width="350" height="138" rx="10"/>
<text class="l" x="428" y="108">Applications listen on:</text>
<text class="m" x="428" y="132">0.0.0.0:443</text><text class="s" x="530" y="132">(all IPv4 addresses)</text>
<text class="m" x="428" y="154">[::]:443</text><text class="s" x="530" y="154">(all IPv6 addresses, and</text>
<text class="s" x="530" y="171">on Linux IPv4 too, unless</text>
<text class="s" x="530" y="188">IPV6_V6ONLY is set)</text>
<text class="s" x="428" y="210">(netstat prints [::]:443 as :::443)</text>
</svg>
