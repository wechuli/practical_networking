<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" role="img" aria-labelledby="t d"><title id="t">The sockets lab topology</title><desc id="d">The client at 198.18.200.10 connects through a router running pathlab, which adds delay on demand, to the server at 198.18.201.10. The server runs discard on :7002, :7003 and :7005, close on :7004, HTTP on :8080, netpoll on :7032, threads on :7033, and relays on :7101 and :7102 that forward to noread on :7020.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="268" rx="16"/>
<rect class="net" x="20" y="60" width="160" height="70" rx="10"/><text class="t" x="100" y="88" text-anchor="middle">client</text><text class="m" x="100" y="112" text-anchor="middle">198.18.200.10</text>
<path class="line" d="M180 95 H240"/>
<rect class="net" x="240" y="60" width="220" height="70" rx="10"/><text class="t" x="350" y="88" text-anchor="middle">router</text><text class="s" x="350" y="112" text-anchor="middle">pathlab: delay on demand</text>
<path class="line" d="M460 95 H520"/>
<rect class="net" x="520" y="20" width="260" height="230" rx="10"/><text class="t" x="650" y="46" text-anchor="middle">server</text><text class="m" x="650" y="68" text-anchor="middle">198.18.201.10</text>
<text class="m" x="536" y="98">discard :7002 :7003 :7005</text>
<text class="m" x="536" y="120">close :7004</text>
<text class="m" x="536" y="142">HTTP :8080</text>
<text class="m" x="536" y="164">netpoll :7032</text>
<text class="m" x="536" y="186">threads :7033</text>
<text class="m" x="536" y="208">relays :7101/:7102</text>
<text class="m" x="550" y="230">→ noread :7020</text>
</svg>
