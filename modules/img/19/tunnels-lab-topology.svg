<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d"><title id="t">The tunnels lab topology</title><desc id="d">lana (10.1.0.10 and 10.1.1.10) connects to gateway gwa, whose underlay address is 198.18.190.1. gwa reaches gwb (198.18.191.1) across wan, where pathlab adds delay and loss. gwb runs sshd on :22 and on :2222 with no forwarding, and connects to lanb (10.2.0.10 and 10.2.1.10, web on :8080). Between gwa and gwb run WireGuard 10.99.0.0/24, IPsec 10.1.1/24 to 10.2.1/24, VXLAN 10.98.0.0/24 and OpenVPN (udp 10.97/24, tcp 10.96/24). wan also connects to a home NAT at 198.18.192.2, behind which a laptop at 192.168.50.10 is WireGuard client 10.99.0.3.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="378" rx="16"/>
<rect class="zone" x="150" y="20" width="540" height="104" rx="12"/><text class="zl" x="166" y="44">tunnels between gwa and gwb</text>
<text class="m" x="170" y="72">WireGuard 10.99.0.0/24</text><text class="m" x="170" y="100">IPsec 10.1.1/24 ⇄ 10.2.1/24</text>
<text class="m" x="420" y="72">VXLAN 10.98.0.0/24</text><text class="m" x="420" y="100">OpenVPN udp 10.97/24, tcp 10.96/24</text>
<path class="line" d="M220 124 V150 M580 124 V150"/>
<rect class="net" x="20" y="150" width="120" height="90" rx="10"/><text class="t" x="80" y="178" text-anchor="middle">lana</text><text class="m" x="80" y="200" text-anchor="middle">10.1.0.10</text><text class="m" x="80" y="220" text-anchor="middle">10.1.1.10</text>
<path class="line" d="M140 195 H165"/>
<rect class="net" x="165" y="150" width="110" height="90" rx="10"/><text class="t" x="220" y="186" text-anchor="middle">gwa</text><text class="m" x="220" y="210" text-anchor="middle">198.18.190.1</text>
<path class="line" d="M275 195 H315"/>
<rect class="l3" x="315" y="150" width="150" height="90" rx="10"/><text class="t" x="390" y="186" text-anchor="middle">wan</text><text class="s" x="390" y="210" text-anchor="middle">pathlab: delay, loss</text>
<path class="line" d="M465 195 H505"/>
<rect class="net" x="505" y="150" width="150" height="90" rx="10"/><text class="t" x="580" y="174" text-anchor="middle">gwb</text><text class="m" x="580" y="194" text-anchor="middle">198.18.191.1</text><text class="s" x="580" y="214" text-anchor="middle">sshd :22</text><text class="s" x="580" y="230" text-anchor="middle">:2222 no forwarding</text>
<path class="line" d="M655 195 H680"/>
<rect class="net" x="680" y="150" width="100" height="90" rx="10"/><text class="t" x="730" y="172" text-anchor="middle">lanb</text><text class="m" x="730" y="192" text-anchor="middle">10.2.0.10</text><text class="m" x="730" y="210" text-anchor="middle">10.2.1.10</text><text class="m" x="730" y="228" text-anchor="middle">web :8080</text>
<path class="line" d="M390 240 V290"/>
<rect class="net" x="315" y="290" width="150" height="64" rx="10"/><text class="t" x="390" y="316" text-anchor="middle">home NAT</text><text class="m" x="390" y="338" text-anchor="middle">198.18.192.2</text>
<path class="line" d="M465 322 H520"/>
<rect class="net" x="520" y="290" width="220" height="64" rx="10"/><text class="t" x="630" y="314" text-anchor="middle">laptop 192.168.50.10</text><text class="s" x="630" y="338" text-anchor="middle">WireGuard client 10.99.0.3</text>
</svg>
