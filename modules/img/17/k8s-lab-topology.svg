<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="t d"><title id="t">The Kubernetes lab topology</title><desc id="d">Three machines share the underlay LAN 192.168.50.0/24. node1 (192.168.50.11) has cni0 10.244.1.1 and flannel.1, with pods web1 (10.244.1.2:8080) and client (10.244.1.3). node2 (192.168.50.12) has cni0 10.244.2.1 and flannel.1, with pods web2 (10.244.2.2:8080) and coredns (10.244.2.3:53). external (192.168.50.100) provides upstream DNS, a web server and the nodes' default gateway. kproxy on both nodes implements the Services: web at 10.96.0.20:80 to port 8080 with NodePort 30080, and kube-dns at 10.96.0.10:53.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="388" rx="16"/>
<rect class="l3" x="20" y="24" width="760" height="44" rx="10"/><text class="t" x="400" y="51" text-anchor="middle">lan 192.168.50.0/24 (the underlay)</text>
<path class="line" d="M140 68 V110 M400 68 V110 M660 68 V110"/>
<rect class="net" x="20" y="110" width="240" height="180" rx="10"/><text class="t" x="140" y="134" text-anchor="middle">node1</text><text class="m" x="140" y="154" text-anchor="middle">192.168.50.11</text><text class="m" x="140" y="176" text-anchor="middle">cni0 10.244.1.1 · flannel.1</text>
<rect class="box" x="36" y="190" width="208" height="36" rx="8"/><text class="m" x="140" y="213" text-anchor="middle">web1 10.244.1.2 :8080</text>
<rect class="box" x="36" y="236" width="208" height="36" rx="8"/><text class="m" x="140" y="259" text-anchor="middle">client 10.244.1.3</text>
<rect class="net" x="280" y="110" width="240" height="180" rx="10"/><text class="t" x="400" y="134" text-anchor="middle">node2</text><text class="m" x="400" y="154" text-anchor="middle">192.168.50.12</text><text class="m" x="400" y="176" text-anchor="middle">cni0 10.244.2.1 · flannel.1</text>
<rect class="box" x="296" y="190" width="208" height="36" rx="8"/><text class="m" x="400" y="213" text-anchor="middle">web2 10.244.2.2 :8080</text>
<rect class="box" x="296" y="236" width="208" height="36" rx="8"/><text class="m" x="400" y="259" text-anchor="middle">coredns 10.244.2.3 :53</text>
<rect class="net" x="540" y="110" width="240" height="180" rx="10"/><text class="t" x="660" y="134" text-anchor="middle">external</text><text class="m" x="660" y="154" text-anchor="middle">192.168.50.100</text><text class="s" x="660" y="196" text-anchor="middle">upstream DNS,</text><text class="s" x="660" y="216" text-anchor="middle">a web server,</text><text class="s" x="660" y="236" text-anchor="middle">and the nodes' default gateway</text>
<rect class="l4" x="20" y="310" width="760" height="60" rx="10"/><text class="l" x="400" y="334" text-anchor="middle">Services (kproxy on both nodes)</text><text class="m" x="400" y="356" text-anchor="middle">web 10.96.0.20:80 → :8080, NodePort 30080 · kube-dns 10.96.0.10:53</text>
</svg>
