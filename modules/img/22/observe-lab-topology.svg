<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" role="img" aria-labelledby="t d"><title id="t">The observability lab topology</title><desc id="d">The client at 198.18.220.10 calls the frontend on :8080, which records spans and logs. The frontend calls the backend on :8081 through a router running pathlab with delay and loss on demand and recording conntrack flows. The backend can inject faults: slow or fail.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="158" rx="16"/>
<rect class="net" x="20" y="40" width="160" height="80" rx="10"/><text class="t" x="100" y="74" text-anchor="middle">client</text><text class="m" x="100" y="96" text-anchor="middle">198.18.220.10</text>
<path class="line" d="M180 80 H210"/>
<rect class="l7" x="210" y="40" width="160" height="80" rx="10"/><text class="t" x="290" y="74" text-anchor="middle">frontend :8080</text><text class="s" x="290" y="96" text-anchor="middle">spans + logs</text>
<path class="line" d="M370 80 H400"/>
<rect class="net" x="400" y="30" width="190" height="100" rx="10"/><text class="t" x="495" y="60" text-anchor="middle">router</text><text class="s" x="495" y="84" text-anchor="middle">pathlab · conntrack flows</text><text class="s" x="495" y="104" text-anchor="middle">delay/loss on demand</text>
<path class="line" d="M590 80 H620"/>
<rect class="l7" x="620" y="40" width="160" height="80" rx="10"/><text class="t" x="700" y="74" text-anchor="middle">backend :8081</text><text class="s" x="700" y="96" text-anchor="middle">faults: slow / fail</text>
</svg>
