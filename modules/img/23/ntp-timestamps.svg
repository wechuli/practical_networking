<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d"><title id="t">The four NTP timestamps</title><desc id="d">The client sends a request at t1 by its own clock; the server receives it at t2 and sends the reply at t3, both by the server's clock; the client receives the reply at t4 by its own clock. The offset, how far the server's clock is ahead of the client's, is ((t2 − t1) + (t3 − t4)) / 2. The delay, the round trip minus time spent in the server, is (t4 − t1) − (t3 − t2).</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="398" rx="16"/>
<rect class="net" x="200" y="20" width="140" height="52" rx="10"/><text class="t" x="270" y="44" text-anchor="middle">client</text><text class="s" x="270" y="62" text-anchor="middle">client clock</text>
<rect class="net" x="460" y="20" width="140" height="52" rx="10"/><text class="t" x="530" y="44" text-anchor="middle">server</text><text class="s" x="530" y="62" text-anchor="middle">server clock</text>
<path class="line" d="M270 72 V270 M530 72 V270"/>
<path class="arrow" d="M270 104 L528 154"/>
<path class="arrow" d="M530 200 L272 250"/>
<text class="l" x="256" y="108" text-anchor="end">t1  client sends</text>
<text class="l" x="544" y="158">t2  server receives</text>
<text class="l" x="544" y="204">t3  server sends</text>
<text class="l" x="256" y="254" text-anchor="end">t4  client receives</text>
<rect class="box" x="20" y="290" width="760" height="90" rx="10"/>
<text class="m" x="40" y="322">offset = ((t2 − t1) + (t3 − t4)) / 2</text><text class="s" x="360" y="322">how far the server's clock is ahead of the client's</text>
<text class="m" x="40" y="356">delay  = (t4 − t1) − (t3 − t2)</text><text class="s" x="360" y="356">round trip, minus time spent in the server</text>
</svg>
