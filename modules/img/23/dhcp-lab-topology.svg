<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" role="img" aria-labelledby="t d"><title id="t">The DHCP lab topology</title><desc id="d">Clients c1, c2 and c3 attach to a switch, bridge br0. Also on the switch are the server, dnsmasq at 198.18.230.1 with a pool of .100 to .101, a rogue dnsmasq at 198.18.230.66, and a relay at 198.18.230.2 and 198.18.231.1, behind which sits the client remote.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="288" rx="16"/>
<rect class="net" x="20" y="50" width="100" height="44" rx="10"/><text class="t" x="70" y="77" text-anchor="middle">c1</text>
<rect class="net" x="20" y="120" width="100" height="44" rx="10"/><text class="t" x="70" y="147" text-anchor="middle">c2</text>
<rect class="net" x="20" y="190" width="100" height="44" rx="10"/><text class="t" x="70" y="217" text-anchor="middle">c3</text>
<path class="line" d="M120 72 L200 130 M120 142 H200 M120 212 L200 154"/>
<rect class="net" x="200" y="112" width="130" height="60" rx="10"/><text class="t" x="265" y="137" text-anchor="middle">switch</text><text class="m" x="265" y="158" text-anchor="middle">br0</text>
<path class="line" d="M330 130 L420 54 M330 142 H420 M330 154 L420 230"/>
<rect class="ok" x="420" y="24" width="360" height="60" rx="10"/><text class="t" x="600" y="48" text-anchor="middle">server</text><text class="m" x="600" y="70" text-anchor="middle">dnsmasq 198.18.230.1 (pool .100–.101)</text>
<rect class="warn" x="420" y="112" width="360" height="60" rx="10"/><text class="t" x="600" y="136" text-anchor="middle">rogue</text><text class="m" x="600" y="158" text-anchor="middle">dnsmasq 198.18.230.66</text>
<rect class="net" x="420" y="200" width="200" height="66" rx="10"/><text class="t" x="520" y="222" text-anchor="middle">relay</text><text class="m" x="520" y="244" text-anchor="middle">198.18.230.2 /</text><text class="m" x="520" y="260" text-anchor="middle">198.18.231.1</text>
<path class="line" d="M620 233 H660"/>
<rect class="net" x="660" y="208" width="120" height="50" rx="10"/><text class="t" x="720" y="238" text-anchor="middle">remote</text>
</svg>
