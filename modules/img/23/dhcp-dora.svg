<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">A first DHCP lease, as captured</title><desc id="d">At 0.000 s client c1 broadcasts DISCOVER from 0.0.0.0 to 255.255.255.255. At 3.060 s the server dnsmasq at 198.18.230.1 sends OFFER to 198.18.230.101 with yiaddr 198.18.230.101, router 198.18.230.1 and a 120 s lease. At 3.068 s the client broadcasts REQUEST from 0.0.0.0 to 255.255.255.255 for 198.18.230.101. At 3.070 s the server sends ACK to 198.18.230.101 with the same yiaddr, router and 120 s lease.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="418" rx="16"/>
<rect class="net" x="110" y="20" width="120" height="56" rx="10"/><text class="t" x="170" y="53" text-anchor="middle">client c1</text>
<rect class="net" x="560" y="20" width="180" height="56" rx="10"/><text class="t" x="650" y="44" text-anchor="middle">dnsmasq</text><text class="m" x="650" y="64" text-anchor="middle">198.18.230.1</text>
<path class="line" d="M170 76 V400 M650 76 V400"/>
<text class="m" x="24" y="144">0.000s</text>
<text class="l" x="410" y="118" text-anchor="middle">DISCOVER</text><text class="m" x="410" y="134" text-anchor="middle">0.0.0.0 → 255.255.255.255</text>
<path class="arrow" d="M170 144 H648"/>
<text class="m" x="24" y="226">3.060s</text>
<text class="l" x="410" y="184" text-anchor="middle">OFFER</text><text class="m" x="410" y="200" text-anchor="middle">198.18.230.1 → 198.18.230.101</text><text class="m" x="410" y="216" text-anchor="middle">yiaddr 198.18.230.101  router 198.18.230.1  lease 120s</text>
<path class="arrow" d="M650 226 H172"/>
<text class="m" x="24" y="292">3.068s</text>
<text class="l" x="410" y="250" text-anchor="middle">REQUEST</text><text class="m" x="410" y="266" text-anchor="middle">0.0.0.0 → 255.255.255.255</text><text class="m" x="410" y="282" text-anchor="middle">requested 198.18.230.101</text>
<path class="arrow" d="M170 292 H648"/>
<text class="m" x="24" y="374">3.070s</text>
<text class="l" x="410" y="332" text-anchor="middle">ACK</text><text class="m" x="410" y="348" text-anchor="middle">198.18.230.1 → 198.18.230.101</text><text class="m" x="410" y="364" text-anchor="middle">yiaddr 198.18.230.101  router 198.18.230.1  lease 120s</text>
<path class="arrow" d="M650 374 H172"/>
</svg>
