<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-labelledby="t d"><title id="t">The time lab topology</title><desc id="d">A client attaches to a switch. On the switch are NTP servers ntp1, ntp2 and ntp3 with correct clocks, bad with a clock 5 minutes ahead, asym with 10 ms in and 50 ms out, and web, a TLS server whose certificate is valid from now minus 1 hour to now plus 30 days.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="238" rx="16"/>
<rect class="net" x="20" y="90" width="120" height="50" rx="10"/><text class="t" x="80" y="120" text-anchor="middle">client</text>
<path class="line" d="M140 115 H200"/>
<rect class="net" x="200" y="90" width="120" height="50" rx="10"/><text class="t" x="260" y="120" text-anchor="middle">switch</text>
<path class="line" d="M320 115 H730 M480 115 V90 M620 115 V90 M730 115 V90 M590 115 V150"/>
<rect class="ok" x="400" y="20" width="160" height="70" rx="10"/><text class="t" x="480" y="48" text-anchor="middle">ntp1 ntp2 ntp3</text><text class="s" x="480" y="70" text-anchor="middle">correct</text>
<rect class="warn" x="575" y="20" width="90" height="70" rx="10"/><text class="t" x="620" y="48" text-anchor="middle">bad</text><text class="s" x="620" y="70" text-anchor="middle">+5 min</text>
<rect class="warn" x="680" y="20" width="100" height="70" rx="10"/><text class="t" x="730" y="44" text-anchor="middle">asym</text><text class="s" x="730" y="62" text-anchor="middle">10 ms in /</text><text class="s" x="730" y="78" text-anchor="middle">50 ms out</text>
<rect class="net" x="400" y="150" width="380" height="66" rx="10"/><text class="t" x="590" y="175" text-anchor="middle">web (TLS)</text><text class="s" x="590" y="199" text-anchor="middle">certificate valid from now−1 h to now+30 days</text>
</svg>
