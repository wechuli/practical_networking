<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" role="img" aria-labelledby="t d"><title id="t">The firewall lab topology</title><desc id="d">The client at 198.18.180.10, listening on tcp 5000, connects through the firewall fw to the server at 198.18.181.10 (also .11 and .12), which listens on tcp 22, 80, 443, 8080 with backlog 4, 9090 and 9091, and mTLS on 8443. The firewall also connects to db at 198.18.182.10, listening on tcp 5432.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="268" rx="16"/>
<rect class="net" x="20" y="40" width="170" height="80" rx="10"/><text class="t" x="105" y="66" text-anchor="middle">client</text><text class="m" x="105" y="88" text-anchor="middle">198.18.180.10</text><text class="s" x="105" y="108" text-anchor="middle">tcp 5000</text>
<path class="line" d="M190 80 H260"/>
<rect class="net" x="260" y="50" width="120" height="60" rx="10"/><text class="t" x="320" y="86" text-anchor="middle">fw</text>
<path class="line" d="M380 80 H460"/>
<rect class="net" x="460" y="20" width="320" height="120" rx="10"/><text class="t" x="620" y="46" text-anchor="middle">server</text><text class="m" x="620" y="68" text-anchor="middle">198.18.181.10 (.11, .12)</text><text class="s" x="620" y="94" text-anchor="middle">tcp 22 80 443 8080 (backlog 4) 9090 9091</text><text class="s" x="620" y="116" text-anchor="middle">mTLS 8443</text>
<path class="line" d="M320 110 V200 H460"/>
<rect class="net" x="460" y="170" width="320" height="70" rx="10"/><text class="t" x="620" y="196" text-anchor="middle">db</text><text class="m" x="620" y="218" text-anchor="middle">198.18.182.10 · tcp 5432</text>
