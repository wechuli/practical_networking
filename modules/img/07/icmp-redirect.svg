<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">ICMP Type 5 Redirect</title><desc id="d">Host A sends a packet for 10.0.2.50 to Router 1. Router 1's best route for 10.0.2.0/24 is via Router 2, which is on the same subnet as Host A, so Router 1 sends Host A an ICMP Redirect: send to Router 2 instead. Host A updates its routing cache: 10.0.2.50 via Router 2, and later packets for 10.0.2.50 go straight to Router 2.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="418" rx="16"/>
<rect class="zone" x="16" y="16" width="768" height="388" rx="12"/><text class="zl" x="32" y="40">Host A's subnet</text>
<rect class="net" x="40" y="60" width="150" height="80" rx="10"/><text class="t" x="115" y="106" text-anchor="middle">Host A</text>
<rect class="net" x="580" y="60" width="180" height="80" rx="10"/><text class="t" x="670" y="106" text-anchor="middle">Router 1</text>
<text class="m" x="385" y="76" text-anchor="middle">packet for 10.0.2.50</text><path class="arrow" d="M190 84 H578"/>
<text class="l" x="385" y="118" text-anchor="middle">ICMP Redirect: “Send to Router 2 instead”</text><path class="arrow" d="M580 128 H192"/>
<rect class="box" x="440" y="160" width="340" height="76" rx="10"/>
<text class="s" x="456" y="184">Router 1's best route for 10.0.2.0/24</text><text class="s" x="456" y="202">is via Router 2, which is on the SAME</text><text class="s" x="456" y="220">subnet as Host A.</text>
<rect class="ok" x="40" y="160" width="270" height="62" rx="10"/>
<text class="s" x="56" y="185">updates routing cache:</text><text class="m" x="56" y="206">10.0.2.50 via Router 2</text>
<rect class="net" x="580" y="300" width="180" height="70" rx="10"/><text class="t" x="670" y="340" text-anchor="middle">Router 2</text>
<path class="arrow" d="M115 222 V335 H578"/><text class="s" x="345" y="327" text-anchor="middle">later packets for 10.0.2.50</text>
</svg>
