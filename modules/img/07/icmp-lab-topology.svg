<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d"><title id="t">The ICMP lab topology</title><desc id="d">The client 198.18.7.1, r1 (.254) and r3 (.252) share the bridged LAN 198.18.7.0/24. r1's eth1 198.18.8.1 connects over a transit link with MTU 1400 to r2 at 198.18.8.2. r2's eth1 198.19.7.254 leads to the server LAN and the server 198.19.7.2, running labserver on port 8080 (300 kB) and 8081 (300 B). r2's firewall rejects port 8082 with the default REJECT and port 8083 with icmp-admin-prohibited. r3 leads to host2 198.19.8.2; r1's route to 198.19.8.0/24 points at r3, so a redirect waits.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="438" rx="16"/>
<rect class="zone" x="20" y="22" width="390" height="268" rx="12"/><text class="zl" x="36" y="44">LAN 198.18.7.0/24 (bridge)</text>
<rect class="net" x="40" y="62" width="150" height="62" rx="10"/><text class="t" x="115" y="86" text-anchor="middle">client</text><text class="m" x="115" y="108" text-anchor="middle">.1 (198.18.7.1)</text>
<rect class="net" x="240" y="62" width="150" height="80" rx="10"/><text class="t" x="315" y="86" text-anchor="middle">r1</text><text class="m" x="315" y="106" text-anchor="middle">.254</text><text class="s" x="315" y="126" text-anchor="middle">eth1 198.18.8.1</text>
<path class="line" d="M40 176 H390" style="stroke-width:3"/>
<path class="line" d="M115 124 V176"/><path class="line" d="M315 142 V176"/><path class="line" d="M115 176 V206"/>
<rect class="net" x="40" y="206" width="150" height="62" rx="10"/><text class="t" x="115" y="230" text-anchor="middle">r3</text><text class="m" x="115" y="252" text-anchor="middle">.252</text>
<path class="line" d="M190 237 H430"/>
<rect class="net" x="430" y="206" width="130" height="62" rx="10"/><text class="t" x="495" y="230" text-anchor="middle">host2</text><text class="m" x="495" y="252" text-anchor="middle">198.19.8.2</text>
<path class="line" d="M390 102 H540" style="stroke-width:3"/><text class="l" x="465" y="78" text-anchor="middle">transit</text><text class="l" x="465" y="94" text-anchor="middle">MTU 1400</text>
<rect class="net" x="540" y="62" width="160" height="80" rx="10"/><text class="t" x="620" y="86" text-anchor="middle">r2</text><text class="m" x="620" y="106" text-anchor="middle">.2 (198.18.8.2)</text><text class="s" x="620" y="126" text-anchor="middle">eth1 198.19.7.254</text>
<path class="line" d="M680 142 V160"/>
<rect class="warn" x="600" y="160" width="190" height="104" rx="10"/><text class="l" x="612" y="182">r2 firewall</text><text class="m" x="612" y="202">REJECT :8082</text><text class="m" x="612" y="218">(default)</text><text class="m" x="612" y="238">REJECT :8083</text><text class="m" x="612" y="254">(icmp-admin-prohibited)</text>
<path class="line" d="M578 142 V330"/><text class="s" x="570" y="306" text-anchor="end">server LAN</text>
<rect class="net" x="440" y="330" width="276" height="90" rx="10"/><text class="t" x="578" y="354" text-anchor="middle">server 198.19.7.2</text><text class="m" x="578" y="378" text-anchor="middle">labserver :8080 (300 kB)</text><text class="m" x="578" y="398" text-anchor="middle">          :8081 (300 B)</text>
<text class="s" x="40" y="320">r1's route to 198.19.8.0/24 points at r3:</text><text class="s" x="40" y="338">a redirect waits.</text>
</svg>
