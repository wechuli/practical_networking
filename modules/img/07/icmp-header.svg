<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d"><title id="t">ICMP message structure</title><desc id="d">A 32-bit-wide layout of an ICMP message: Type (8 bits), Code (8 bits) and Checksum (16 bits) in the first row, then message-specific data that varies by Type and Code. For error messages the data section holds the IP header of the original packet that caused the error plus the first 8 bytes of its payload, enough to identify the TCP or UDP source and destination ports, which is how the sender knows which flow triggered the error.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="448" rx="16"/>
<text class="zl" x="24" y="30">ICMP message structure</text>
<text class="m" x="70.6" y="66" text-anchor="middle">0</text><text class="m" x="70.6" y="50" text-anchor="middle">0</text><text class="m" x="91.9" y="66" text-anchor="middle">1</text><text class="m" x="113.1" y="66" text-anchor="middle">2</text><text class="m" x="134.4" y="66" text-anchor="middle">3</text><text class="m" x="155.6" y="66" text-anchor="middle">4</text><text class="m" x="176.9" y="66" text-anchor="middle">5</text><text class="m" x="198.1" y="66" text-anchor="middle">6</text><text class="m" x="219.4" y="66" text-anchor="middle">7</text><text class="m" x="240.6" y="66" text-anchor="middle">8</text><text class="m" x="261.9" y="66" text-anchor="middle">9</text><text class="m" x="283.1" y="66" text-anchor="middle">0</text><text class="m" x="283.1" y="50" text-anchor="middle">1</text><text class="m" x="304.4" y="66" text-anchor="middle">1</text><text class="m" x="325.6" y="66" text-anchor="middle">2</text><text class="m" x="346.9" y="66" text-anchor="middle">3</text><text class="m" x="368.1" y="66" text-anchor="middle">4</text><text class="m" x="389.4" y="66" text-anchor="middle">5</text><text class="m" x="410.6" y="66" text-anchor="middle">6</text><text class="m" x="431.9" y="66" text-anchor="middle">7</text><text class="m" x="453.1" y="66" text-anchor="middle">8</text><text class="m" x="474.4" y="66" text-anchor="middle">9</text><text class="m" x="495.6" y="66" text-anchor="middle">0</text><text class="m" x="495.6" y="50" text-anchor="middle">2</text><text class="m" x="516.9" y="66" text-anchor="middle">1</text><text class="m" x="538.1" y="66" text-anchor="middle">2</text><text class="m" x="559.4" y="66" text-anchor="middle">3</text><text class="m" x="580.6" y="66" text-anchor="middle">4</text><text class="m" x="601.9" y="66" text-anchor="middle">5</text><text class="m" x="623.1" y="66" text-anchor="middle">6</text><text class="m" x="644.4" y="66" text-anchor="middle">7</text><text class="m" x="665.6" y="66" text-anchor="middle">8</text><text class="m" x="686.9" y="66" text-anchor="middle">9</text><text class="m" x="708.1" y="66" text-anchor="middle">0</text><text class="m" x="708.1" y="50" text-anchor="middle">3</text><text class="m" x="729.4" y="66" text-anchor="middle">1</text>
<rect class="l3" x="60" y="76" width="170" height="44" rx="6"/><text class="t" x="145" y="103" text-anchor="middle">Type</text>
<rect class="l3" x="230" y="76" width="170" height="44" rx="6"/><text class="t" x="315" y="103" text-anchor="middle">Code</text>
<rect class="l3" x="400" y="76" width="340" height="44" rx="6"/><text class="t" x="570" y="103" text-anchor="middle">Checksum</text>
<rect class="box" x="60" y="120" width="680" height="56" rx="6"/><text class="t" x="400" y="144" text-anchor="middle">Message-specific data</text><text class="s" x="400" y="164" text-anchor="middle">(varies by Type and Code)</text>
<text class="s" x="60" y="206"><tspan class="l">Type (8 bits):</tspan> Identifies the ICMP message category</text>
<text class="s" x="60" y="226"><tspan class="l">Code (8 bits):</tspan> Sub-type within the category — gives more detail</text>
<text class="s" x="60" y="246"><tspan class="l">Checksum (16 bits):</tspan> Error detection over the entire ICMP message</text>
<text class="zl" x="60" y="286">For error messages, the data section contains:</text>
<rect class="l3" x="60" y="298" width="680" height="42" rx="10"/><text class="t" x="400" y="324" text-anchor="middle">IP header of the original packet that caused the error</text>
<rect class="l4" x="60" y="346" width="680" height="58" rx="10"/><text class="t" x="400" y="369" text-anchor="middle">+ First 8 bytes of the original packet's payload</text><text class="s" x="400" y="390" text-anchor="middle">(enough to identify the TCP/UDP src port + dst port)</text>
<text class="l" x="400" y="430" text-anchor="middle">This is how the sender knows WHICH flow triggered the error.</text>
</svg>
