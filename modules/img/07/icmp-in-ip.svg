<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d"><title id="t">ICMP is inside IP, not above it</title><desc id="d">A protocol stack: layer 4 holds TCP (protocol 6) and UDP (protocol 17); layer 3 is IP, which carries TCP with Protocol 6, UDP with Protocol 17 and ICMP with Protocol 1; layer 2 is Ethernet. ICMP sits in the IP layer. Below, an ICMP packet on the wire: Ethernet header, IP header with Proto=1, then the ICMP message with Type, Code, Checksum and message-specific data.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="428" rx="16"/>
<text class="zl" x="24" y="30">ICMP is inside IP — not above it</text>
<rect class="l4" x="40" y="44" width="440" height="44" rx="10"/><text class="t" x="260" y="71" text-anchor="middle">Layer 4: TCP (Proto 6) / UDP (Proto 17)</text>
<rect class="l3" x="40" y="96" width="440" height="146" rx="10"/><text class="t" x="60" y="120">Layer 3: IP</text>
<rect class="box" x="64" y="132" width="392" height="28" rx="8"/><text class="m" x="80" y="150">Carries TCP  (Protocol = 6)</text>
<rect class="box" x="64" y="166" width="392" height="28" rx="8"/><text class="m" x="80" y="184">Carries UDP  (Protocol = 17)</text>
<rect class="box" x="64" y="200" width="392" height="28" rx="8" style="stroke:#2563eb;stroke-width:2.2"/><text class="m" x="80" y="218">Carries ICMP (Protocol = 1)</text>
<path class="arrow" d="M600 214 H462"/><text class="l" x="610" y="218">ICMP is here</text>
<rect class="l2" x="40" y="250" width="440" height="44" rx="10"/><text class="t" x="260" y="277" text-anchor="middle">Layer 2: Ethernet</text>
<text class="zl" x="24" y="330">An ICMP packet on the wire</text>
<rect class="l2" x="40" y="344" width="150" height="66" rx="10"/><text class="t" x="115" y="371" text-anchor="middle">Ethernet</text><text class="s" x="115" y="391" text-anchor="middle">header</text>
<rect class="l3" x="190" y="344" width="150" height="66" rx="10"/><text class="t" x="265" y="371" text-anchor="middle">IP header</text><text class="m" x="265" y="391" text-anchor="middle">Proto=1</text>
<rect class="box" x="340" y="344" width="420" height="66" rx="10"/><text class="t" x="550" y="371" text-anchor="middle">ICMP message</text><text class="s" x="550" y="391" text-anchor="middle">Type, Code, Checksum, message-specific data</text>
</svg>
