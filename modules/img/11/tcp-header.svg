<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d"><title id="t">The TCP header</title><desc id="d">The TCP header laid out in 32-bit rows (RFC 9293), 20 bytes and up to 60 with options: source port and destination port (16 bits each); sequence number (32 bits); acknowledgment number (32 bits); data offset (4 bits), reserved (4 bits), the eight flags CWR, ECE, URG, ACK, PSH, RST, SYN and FIN, and the window (16 bits); checksum and urgent pointer (16 bits each); then options, present if the data offset is greater than 5.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="378" rx="16"/>
<text class="zl" x="24" y="28">TCP header (RFC 9293): 20 bytes, up to 60 with options</text>
<text class="m" text-anchor="middle" x="90 290 490 690" y="50">0123</text>
<text class="m" text-anchor="middle" x="90 110 130 150 170 190 210 230 250 270 290 310 330 350 370 390 410 430 450 470 490 510 530 550 570 590 610 630 650 670 690 710" y="66">01234567890123456789012345678901</text>
<rect class="l4" x="81" y="76" width="318" height="38" rx="6"/><text class="t" x="240" y="100" text-anchor="middle">Source Port</text>
<rect class="l4" x="401" y="76" width="318" height="38" rx="6"/><text class="t" x="560" y="100" text-anchor="middle">Destination Port</text>
<rect class="l4" x="81" y="116" width="638" height="38" rx="6"/><text class="t" x="400" y="140" text-anchor="middle">Sequence Number</text>
<rect class="l4" x="81" y="156" width="638" height="38" rx="6"/><text class="t" x="400" y="180" text-anchor="middle">Acknowledgment Number</text>
<rect class="l4" x="81" y="196" width="78" height="58" rx="6"/><text class="t" x="120" y="221" text-anchor="middle">Data</text><text class="t" x="120" y="240" text-anchor="middle">Offset</text>
<rect class="l4" x="161" y="196" width="78" height="58" rx="6"/><text class="t" x="200" y="230" text-anchor="middle">Rsrvd</text>
<rect class="l4" x="241" y="196" width="18" height="58" rx="4"/><text class="m" x="250" text-anchor="middle"><tspan x="250" y="214">C</tspan><tspan x="250" y="229">W</tspan><tspan x="250" y="244">R</tspan></text>
<rect class="l4" x="261" y="196" width="18" height="58" rx="4"/><text class="m" x="270" text-anchor="middle"><tspan x="270" y="214">E</tspan><tspan x="270" y="229">C</tspan><tspan x="270" y="244">E</tspan></text>
<rect class="l4" x="281" y="196" width="18" height="58" rx="4"/><text class="m" x="290" text-anchor="middle"><tspan x="290" y="214">U</tspan><tspan x="290" y="229">R</tspan><tspan x="290" y="244">G</tspan></text>
<rect class="l4" x="301" y="196" width="18" height="58" rx="4"/><text class="m" x="310" text-anchor="middle"><tspan x="310" y="214">A</tspan><tspan x="310" y="229">C</tspan><tspan x="310" y="244">K</tspan></text>
<rect class="l4" x="321" y="196" width="18" height="58" rx="4"/><text class="m" x="330" text-anchor="middle"><tspan x="330" y="214">P</tspan><tspan x="330" y="229">S</tspan><tspan x="330" y="244">H</tspan></text>
<rect class="l4" x="341" y="196" width="18" height="58" rx="4"/><text class="m" x="350" text-anchor="middle"><tspan x="350" y="214">R</tspan><tspan x="350" y="229">S</tspan><tspan x="350" y="244">T</tspan></text>
<rect class="l4" x="361" y="196" width="18" height="58" rx="4"/><text class="m" x="370" text-anchor="middle"><tspan x="370" y="214">S</tspan><tspan x="370" y="229">Y</tspan><tspan x="370" y="244">N</tspan></text>
<rect class="l4" x="381" y="196" width="18" height="58" rx="4"/><text class="m" x="390" text-anchor="middle"><tspan x="390" y="214">F</tspan><tspan x="390" y="229">I</tspan><tspan x="390" y="244">N</tspan></text>
<rect class="l4" x="401" y="196" width="318" height="58" rx="6"/><text class="t" x="560" y="230" text-anchor="middle">Window</text>
<rect class="l4" x="81" y="256" width="318" height="38" rx="6"/><text class="t" x="240" y="280" text-anchor="middle">Checksum</text>
<rect class="l4" x="401" y="256" width="318" height="38" rx="6"/><text class="t" x="560" y="280" text-anchor="middle">Urgent Pointer</text>
<rect class="box" x="81" y="296" width="638" height="38" rx="6"/><text class="t" x="400" y="320" text-anchor="middle">Options (if Data Offset &gt; 5)</text>
<text class="s" x="81" y="360">Flags, left to right: CWR ECE URG ACK PSH RST SYN FIN (8 bits)</text>
</svg>
