<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 304" role="img" aria-labelledby="t d"><title id="t">The TCP lab topology</title><desc id="d">Client 198.18.42.10, router and server 198.18.43.10 in a line. The client has tcp_syn_retries = 2. The router drops port 8085, rejects port 8086 with tcp-reset, rejects port 8087 with ICMP port unreachable, and rejects port 8088 with icmp-host-prohibited. The server runs tcplab serve: port 8080 discard, 8081 hold, 8082 noread with a 4 KB buffer, 8083 noaccept with backlog 2, 8084 reset and 8089 close.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="302" rx="16"/>
<rect class="net" x="20" y="24" width="210" height="56" rx="10"/><text class="t" x="125" y="47" text-anchor="middle">client</text><text class="m" x="125" y="67" text-anchor="middle">198.18.42.10</text>
<path class="line" d="M230 52 H260"/>
<rect class="net" x="260" y="24" width="270" height="56" rx="10"/><text class="t" x="395" y="57" text-anchor="middle">router</text>
<path class="line" d="M530 52 H560"/>
<rect class="net" x="560" y="24" width="220" height="56" rx="10"/><text class="t" x="670" y="47" text-anchor="middle">server</text><text class="m" x="670" y="67" text-anchor="middle">198.18.43.10</text>
<rect class="box" x="20" y="96" width="210" height="44" rx="10"/><text class="m" x="34" y="123">tcp_syn_retries = 2</text>
<rect class="box" x="260" y="96" width="270" height="168" rx="10"/>
<text class="m" x="274" y="120">DROP :8085</text>
<text class="m" x="274" y="144">REJECT tcp-reset :8086</text>
<text class="m" x="274" y="172">REJECT :8087</text><text class="s" x="274" y="190">(ICMP port unreachable)</text>
<text class="m" x="274" y="222">REJECT :8088</text><text class="s" x="274" y="240">icmp-host-prohibited</text>
<rect class="box" x="560" y="96" width="220" height="190" rx="10"/>
<text class="l" x="574" y="120">tcplab serve</text>
<text class="m" x="574" y="146">:8080 discard</text>
<text class="m" x="574" y="170">:8081 hold</text>
<text class="m" x="574" y="194">:8082 noread (4 KB buffer)</text>
<text class="m" x="574" y="218">:8083 noaccept (backlog 2)</text>
<text class="m" x="574" y="242">:8084 reset</text>
<text class="m" x="574" y="266">:8089 close</text>
</svg>
