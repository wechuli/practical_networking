<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="t d"><title id="t">Sequence and acknowledgment numbers for a 3000-byte write</title><desc id="d">The sender sends seq 1:1449 and the receiver answers ack 1449; the sender sends seq 1449:2897 and the receiver answers ack 2897; the sender sends seq 2897:3001 and the receiver answers ack 3001, meaning all 3000 bytes were received.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="338" rx="16"/>
<rect class="net" x="130" y="20" width="140" height="40" rx="10"/><text class="t" x="200" y="45" text-anchor="middle">sender</text>
<rect class="net" x="430" y="20" width="140" height="40" rx="10"/><text class="t" x="500" y="45" text-anchor="middle">receiver</text>
<path class="line" d="M200 60 V320"/><path class="line" d="M500 60 V320"/>
<text class="m" x="350" y="90" text-anchor="middle">seq 1:1449</text><path class="arrow" d="M200 100 H498"/>
<text class="m" x="350" y="124" text-anchor="middle">ack 1449</text><path class="arrow" d="M500 134 H202"/>
<text class="m" x="350" y="170" text-anchor="middle">seq 1449:2897</text><path class="arrow" d="M200 180 H498"/>
<text class="m" x="350" y="204" text-anchor="middle">ack 2897</text><path class="arrow" d="M500 214 H202"/>
<text class="m" x="350" y="250" text-anchor="middle">seq 2897:3001</text><path class="arrow" d="M200 260 H498"/>
<text class="m" x="350" y="284" text-anchor="middle">ack 3001</text><path class="arrow" d="M500 294 H202"/>
<rect class="ok" x="560" y="270" width="210" height="34" rx="10"/><text class="s" x="665" y="292" text-anchor="middle">all 3000 bytes received</text>
</svg>
