<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">Full mesh versus shared infrastructure</title><desc id="d">Left: a full mesh of dedicated links between machines A, B, C and D does not scale. 4 machines need 6 dedicated links, 10 machines need 45 links and 100 machines need 4,950 links. Right: shared infrastructure scales. Machines A, B, C and D each have one link to a shared medium or switch, which connects onward; adding a machine adds one link.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="418" rx="16"/>
<rect class="warn" x="20" y="20" width="370" height="380" rx="12"/>
<text class="zl" x="36" y="46">FULL MESH OF DEDICATED LINKS</text>
<text class="s" x="36" y="66">does not scale</text>
<path class="line" d="M110 100 L300 100"/>
<path class="line" d="M110 100 L110 250"/>
<path class="line" d="M110 100 L300 250"/>
<path class="line" d="M300 100 L110 250"/>
<path class="line" d="M300 100 L300 250"/>
<path class="line" d="M110 250 L300 250"/>
<rect class="net" x="84" y="82" width="52" height="36" rx="10"/>
<text class="t" x="110.0" y="105.0" text-anchor="middle">A</text>
<rect class="net" x="274" y="82" width="52" height="36" rx="10"/>
<text class="t" x="300.0" y="105.0" text-anchor="middle">B</text>
<rect class="net" x="84" y="232" width="52" height="36" rx="10"/>
<text class="t" x="110.0" y="255.0" text-anchor="middle">C</text>
<rect class="net" x="274" y="232" width="52" height="36" rx="10"/>
<text class="t" x="300.0" y="255.0" text-anchor="middle">D</text>
<text class="l" x="36" y="312">4 machines = 6 dedicated links</text>
<text class="l" x="36" y="336">10 machines = 45 links</text>
<text class="l" x="36" y="360">100 machines = 4,950 links</text>
<rect class="ok" x="410" y="20" width="370" height="380" rx="12"/>
<text class="zl" x="426" y="46">SHARED INFRASTRUCTURE</text>
<text class="s" x="426" y="66">scales</text>
<rect class="net" x="450" y="90" width="52" height="36" rx="10"/>
<text class="t" x="476.0" y="113.0" text-anchor="middle">A</text>
<path class="line" d="M476 126 L595 200"/>
<rect class="net" x="542" y="90" width="52" height="36" rx="10"/>
<text class="t" x="568.0" y="113.0" text-anchor="middle">B</text>
<path class="line" d="M568 126 L595 200"/>
<rect class="net" x="634" y="90" width="52" height="36" rx="10"/>
<text class="t" x="660.0" y="113.0" text-anchor="middle">C</text>
<path class="line" d="M660 126 L595 200"/>
<rect class="net" x="726" y="90" width="52" height="36" rx="10"/>
<text class="t" x="752.0" y="113.0" text-anchor="middle">D</text>
<path class="line" d="M752 126 L595 200"/>
<rect class="net" x="475" y="200" width="240" height="40" rx="10"/>
<text class="l" x="595.0" y="224.0" text-anchor="middle">shared medium / switch</text>
<path class="line" d="M595 240 V280"/>
<text class="t" x="595" y="300" text-anchor="middle">...</text>
<text class="l" x="426" y="350">Add more machines: add one link each</text>
</svg>
