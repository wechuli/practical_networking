<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 740" role="img" aria-labelledby="t d"><title id="t">Virtual IP failover with gratuitous ARP</title><desc id="d">Before failover: the primary server (IP 10.0.1.100, VIP 10.0.1.200, MAC aa:aa:aa...) and the standby server (IP 10.0.1.101, no VIP yet, MAC bb:bb:bb...) share a switch with a client whose ARP cache maps 10.0.1.200 to aa:aa:aa..., so the client sends to the primary's MAC. After the primary fails, the standby takes over the VIP 10.0.1.200 and sends a gratuitous ARP, "10.0.1.200 is at bb:bb:bb...", broadcast to ff:ff:ff:ff:ff:ff. The client's cache is updated to 10.0.1.200 to bb:bb:bb..., and it now sends to the standby's MAC.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="738" rx="16"/>
<text class="zl" x="24" y="34">Before failover</text>
<rect class="net" x="60" y="48" width="200" height="94" rx="10"/><text class="t" x="160" y="70" text-anchor="middle">Primary Server</text><text class="m" x="160" y="90" text-anchor="middle">IP: 10.0.1.100</text><text class="m" x="160" y="108" text-anchor="middle">VIP: 10.0.1.200</text><text class="m" x="160" y="126" text-anchor="middle">MAC: aa:aa:aa...</text>
<rect class="net" x="540" y="48" width="200" height="94" rx="10"/><text class="t" x="640" y="70" text-anchor="middle">Standby Server</text><text class="m" x="640" y="90" text-anchor="middle">IP: 10.0.1.101</text><text class="s" x="640" y="108" text-anchor="middle">(no VIP yet)</text><text class="m" x="640" y="126" text-anchor="middle">MAC: bb:bb:bb...</text>
<path class="line" d="M160 142 V178 M640 142 V178 M160 208 V238"/>
<rect class="l2" x="40" y="178" width="720" height="30" rx="10"/><text class="t" x="400" y="198" text-anchor="middle">Switch</text>
<rect class="box" x="60" y="238" width="200" height="78" rx="10"/><text class="t" x="160" y="260" text-anchor="middle">Client</text><text class="s" x="160" y="280" text-anchor="middle">ARP cache:</text><text class="m" x="160" y="300" text-anchor="middle">10.0.1.200 → aa:aa:aa...</text>
<path class="arrow" d="M420 277 H266"/><text class="l" x="430" y="282">Client sends to primary's MAC</text>
<path class="line" d="M24 346 H776" stroke-dasharray="4 4"/>
<text class="zl" x="24" y="376">Primary fails. Standby takes over VIP</text>
<rect class="warn" x="60" y="390" width="200" height="94" rx="10"/><text class="t" x="160" y="420" text-anchor="middle">Primary Server</text><text class="t" x="160" y="452" text-anchor="middle">DEAD</text>
<rect class="ok" x="540" y="390" width="200" height="94" rx="10"/><text class="t" x="640" y="412" text-anchor="middle">Standby Server</text><text class="m" x="640" y="432" text-anchor="middle">IP: 10.0.1.101</text><text class="m" x="640" y="450" text-anchor="middle">VIP: 10.0.1.200</text><text class="m" x="640" y="468" text-anchor="middle">MAC: bb:bb:bb...</text>
<text class="l" x="300" y="442">VIP moved here</text><path class="arrow" d="M412 437 H534"/>
<path class="line" d="M640 484 V516"/>
<rect class="l2" x="40" y="516" width="720" height="30" rx="10"/><text class="t" x="400" y="536" text-anchor="middle">Switch</text>
<path class="arrow" d="M640 546 V652 H266"/>
<text class="l" x="450" y="584" text-anchor="middle">Standby sends GRATUITOUS ARP:</text>
<text class="m" x="450" y="604" text-anchor="middle">"10.0.1.200 is at bb:bb:bb..."</text>
<text class="m" x="450" y="624" text-anchor="middle">(broadcast to ff:ff:ff:ff:ff:ff)</text>
<rect class="ok" x="60" y="612" width="200" height="80" rx="10"/><text class="t" x="160" y="634" text-anchor="middle">Client</text><text class="s" x="160" y="654" text-anchor="middle">ARP cache:</text><text class="m" x="160" y="674" text-anchor="middle">10.0.1.200 → bb:bb:bb...</text>
<text class="l" x="60" y="716">Cache updated! Client now sends to standby's MAC</text>
</svg>
