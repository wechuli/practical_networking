<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 244" role="img" aria-labelledby="t d"><title id="t">ARP lab topology</title><desc id="d">A Linux bridge br0 acts as the switch. Attached to it: client 198.18.6.1 with MAC ending 06:01; web1 at .10, plus the VIP .100, MAC ending 06:0a; web2 at .11, MAC ending 06:0b; intruder at .66, MAC ending 06:66; and node at .20. The node connects over interface cali1 to a pod with address 198.18.7.5/32 and gateway 169.254.1.1.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="242" rx="16"/>
<rect class="l2" x="24" y="24" width="552" height="36" rx="10"/><text class="t" x="300" y="47" text-anchor="middle">switch (Linux bridge br0)</text>
<path class="line" d="M76 60 V100 M188 60 V100 M300 60 V100 M412 60 V100 M524 60 V100"/>
<rect class="net" x="24" y="100" width="104" height="96" rx="10"/><text class="t" x="76" y="124" text-anchor="middle">client</text><text class="m" x="76" y="146" text-anchor="middle">198.18.6.1</text><text class="m" x="76" y="166" text-anchor="middle">…06:01</text>
<rect class="net" x="136" y="100" width="104" height="96" rx="10"/><text class="t" x="188" y="124" text-anchor="middle">web1</text><text class="m" x="188" y="146" text-anchor="middle">.10</text><text class="m" x="188" y="164" text-anchor="middle">(+VIP .100)</text><text class="m" x="188" y="184" text-anchor="middle">…06:0a</text>
<rect class="net" x="248" y="100" width="104" height="96" rx="10"/><text class="t" x="300" y="124" text-anchor="middle">web2</text><text class="m" x="300" y="146" text-anchor="middle">.11</text><text class="m" x="300" y="166" text-anchor="middle">…06:0b</text>
<rect class="warn" x="360" y="100" width="104" height="96" rx="10"/><text class="t" x="412" y="124" text-anchor="middle">intruder</text><text class="m" x="412" y="146" text-anchor="middle">.66</text><text class="m" x="412" y="166" text-anchor="middle">…06:66</text>
<rect class="net" x="472" y="100" width="104" height="96" rx="10"/><text class="t" x="524" y="124" text-anchor="middle">node</text><text class="m" x="524" y="146" text-anchor="middle">.20</text>
<path class="line" d="M576 148 H640"/><text class="l" x="608" y="138" text-anchor="middle">cali1</text>
<rect class="net" x="640" y="100" width="144" height="96" rx="10"/><text class="t" x="712" y="124" text-anchor="middle">pod</text><text class="m" x="712" y="146" text-anchor="middle">198.18.7.5/32</text><text class="s" x="712" y="166" text-anchor="middle">gateway</text><text class="m" x="712" y="184" text-anchor="middle">169.254.1.1</text>
<text class="s" x="24" y="224">Addresses .x are in 198.18.6.0/24; MACs are 02:00:00:00:06:xx, shown by their last bytes.</text>
