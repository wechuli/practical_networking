<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 384" role="img" aria-labelledby="t d"><title id="t">ARP in a physical network compared with a cloud VPC</title><desc id="d">In a physical network, Host A sends an ARP broadcast and Host B sends an ARP reply; both are on a real shared Ethernet segment and the switch floods the broadcast to all ports in the VLAN. In a cloud VPC such as AWS, VM A sends an ARP request to the hypervisor's virtual switch, which replies: the hypervisor knows every VM's IP and MAC, answers ARP instantly from its own table, and no broadcast reaches other VMs, so ARP is contained.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="382" rx="16"/>
<text class="zl" x="24" y="34">Physical Network</text>
<rect class="net" x="60" y="50" width="140" height="70" rx="10"/><text class="t" x="130" y="90" text-anchor="middle">Host A</text>
<rect class="net" x="440" y="50" width="160" height="70" rx="10"/><text class="t" x="520" y="90" text-anchor="middle">Host B</text>
<text class="l" x="320" y="66" text-anchor="middle">ARP broadcast</text><path class="arrow" d="M202 76 H436"/>
<text class="l" x="320" y="98" text-anchor="middle">ARP reply</text><path class="arrow" d="M436 108 H204"/>
<text class="s" x="60" y="146">Both hosts are on a real shared Ethernet segment.</text>
<text class="s" x="60" y="164">The switch floods the ARP broadcast to all ports in the VLAN.</text>
<path class="line" d="M24 186 H776" stroke-dasharray="4 4"/>
<text class="zl" x="24" y="214">Cloud VPC (e.g., AWS)</text>
<rect class="net" x="60" y="230" width="140" height="70" rx="10"/><text class="t" x="130" y="270" text-anchor="middle">VM A</text>
<rect class="box" x="440" y="230" width="160" height="70" rx="10"/><text class="t" x="520" y="260" text-anchor="middle">Hypervisor</text><text class="s" x="520" y="280" text-anchor="middle">(virtual switch)</text>
<text class="l" x="320" y="246" text-anchor="middle">ARP request</text><path class="arrow" d="M202 256 H436"/>
<text class="l" x="320" y="278" text-anchor="middle">ARP reply</text><path class="arrow" d="M436 288 H204"/>
<text class="s" x="60" y="326">The hypervisor knows every VM's IP and MAC.</text>
<text class="s" x="60" y="344">It answers ARP requests instantly from its own table.</text>
<text class="s" x="60" y="362">No broadcast reaches other VMs — ARP is contained.</text>
</svg>
