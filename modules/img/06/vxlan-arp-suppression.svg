<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 484" role="img" aria-labelledby="t d"><title id="t">ARP in VXLAN overlay networks, with and without ARP suppression</title><desc id="d">Without ARP suppression, an ARP broadcast from container A goes to its VTEP, is encapsulated in VXLAN and sent to every VTEP in the overlay, then decapsulated and broadcast on every local segment, which is expensive and does not scale. With ARP suppression, container A sends the ARP request to its local VTEP, which knows the MAC table and sends the ARP reply itself from its learned table; no broadcast crosses the overlay and the ARP request never leaves the local host.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="482" rx="16"/>
<text class="zl" x="24" y="34">Without ARP suppression</text>
<rect class="box" x="30" y="110" width="120" height="44" rx="10"/><text class="t" x="90" y="137" text-anchor="middle">Container A</text>
<text class="l" x="200" y="124" text-anchor="middle">broadcast</text><path class="arrow" d="M152 132 H246"/>
<rect class="net" x="250" y="110" width="120" height="44" rx="10"/><text class="t" x="310" y="137" text-anchor="middle">VTEP 1</text>
<text class="s" x="310" y="176" text-anchor="middle">encapsulated in VXLAN</text>
<path class="arrow" d="M372 132 L466 72"/><path class="arrow" d="M372 132 H466"/><path class="arrow" d="M372 132 L466 192"/>
<rect class="net" x="470" y="50" width="120" height="44" rx="10"/><text class="t" x="530" y="77" text-anchor="middle">VTEP 2</text>
<rect class="net" x="470" y="110" width="120" height="44" rx="10"/><text class="t" x="530" y="137" text-anchor="middle">VTEP 3</text>
<rect class="net" x="470" y="170" width="120" height="44" rx="10"/><text class="t" x="530" y="197" text-anchor="middle">VTEP 4</text>
<path class="arrow" d="M592 72 H636"/><path class="arrow" d="M592 132 H636"/><path class="arrow" d="M592 192 H636"/>
<rect class="l2" x="640" y="50" width="140" height="44" rx="10"/><text class="s" x="710" y="77" text-anchor="middle">local broadcast</text>
<rect class="l2" x="640" y="110" width="140" height="44" rx="10"/><text class="s" x="710" y="137" text-anchor="middle">local broadcast</text>
<rect class="l2" x="640" y="170" width="140" height="44" rx="10"/><text class="s" x="710" y="197" text-anchor="middle">local broadcast</text>
<rect class="warn" x="24" y="232" width="752" height="56" rx="10"/>
<text class="s" x="40" y="255">ARP broadcast from Container A must be encapsulated in VXLAN, sent to every VTEP in the overlay,</text>
<text class="s" x="40" y="275">decapsulated, and broadcast on every local segment. This is expensive and does not scale.</text>
<path class="line" d="M24 310 H776" stroke-dasharray="4 4"/>
<text class="zl" x="24" y="338">With ARP suppression</text>
<rect class="box" x="60" y="354" width="140" height="70" rx="10"/><text class="t" x="130" y="394" text-anchor="middle">Container A</text>
<rect class="ok" x="440" y="354" width="180" height="70" rx="10"/><text class="t" x="530" y="384" text-anchor="middle">VTEP</text><text class="s" x="530" y="404" text-anchor="middle">(knows the MAC table)</text>
<text class="l" x="320" y="370" text-anchor="middle">ARP request</text><path class="arrow" d="M202 380 H436"/>
<text class="l" x="320" y="402" text-anchor="middle">ARP reply (from VTEP)</text><path class="arrow" d="M436 412 H204"/>
<text class="s" x="60" y="450">VTEP answers from its learned table. No broadcast across the overlay.</text>
<text class="s" x="60" y="468">The ARP request never leaves the local host.</text>
</svg>
