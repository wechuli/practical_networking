<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" role="img" aria-labelledby="t d"><title id="t">ARP request-reply sequence</title><desc id="d">Host A (10.0.1.10, aa:aa:aa:aa:aa:aa) wants to reach Host B (10.0.1.20, bb:bb:bb:bb:bb:bb). Step 1: Host A checks its ARP cache and misses, so it queues the packet. Step 2: Host A broadcasts an ARP request to ff:ff:ff:ff:ff:ff, "Who has 10.0.1.20? Tell 10.0.1.10"; every host on the segment receives it, other hosts do not respond, and Host B caches Host A's mapping from the request. Step 3: Host B sends a unicast ARP reply to aa:aa:aa:aa:aa:aa, "10.0.1.20 is at bb:bb:bb:bb:bb:bb". Step 4: Host A caches 10.0.1.20 to bb:bb:bb:bb:bb:bb as REACHABLE and sends the IP packet in an Ethernet frame to Host B's MAC.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="510" rx="16"/>
<rect class="net" x="50" y="40" width="160" height="62" rx="10"/><text class="t" x="130" y="60" text-anchor="middle">Host A</text><text class="m" x="130" y="78" text-anchor="middle">10.0.1.10</text><text class="m" x="130" y="94" text-anchor="middle">aa:aa:aa:aa:aa:aa</text>
<rect class="net" x="390" y="40" width="160" height="62" rx="10"/><text class="t" x="470" y="60" text-anchor="middle">Host B</text><text class="m" x="470" y="78" text-anchor="middle">10.0.1.20</text><text class="m" x="470" y="94" text-anchor="middle">bb:bb:bb:bb:bb:bb</text>
<rect class="box" x="620" y="40" width="160" height="62" rx="10"/><text class="t" x="700" y="66" text-anchor="middle">Other hosts</text><text class="s" x="700" y="86" text-anchor="middle">on the segment</text>
<path class="line" d="M130 102 V492 M470 102 V492 M700 102 V492"/>
<rect class="box" x="30" y="114" width="250" height="44" rx="10"/><text class="l" x="155" y="133" text-anchor="middle">1 · Check the ARP cache</text><text class="s" x="155" y="150" text-anchor="middle">miss → queue the packet</text>
<text class="l" x="300" y="174" text-anchor="middle">2 · ARP Request (broadcast)</text>
<text class="m" x="300" y="192" text-anchor="middle">dst ff:ff:ff:ff:ff:ff</text>
<text class="m" x="300" y="210" text-anchor="middle">Who has 10.0.1.20? Tell 10.0.1.10</text>
<path class="arrow" d="M132 220 H467"/><path class="arrow" d="M473 220 H697"/>
<rect class="box" x="610" y="236" width="180" height="44" rx="10"/><text class="s" x="700" y="255" text-anchor="middle">Receive it,</text><text class="s" x="700" y="272" text-anchor="middle">do not respond</text>
<rect class="ok" x="360" y="236" width="220" height="44" rx="10"/><text class="s" x="470" y="255" text-anchor="middle">Caches Host A's mapping</text><text class="s" x="470" y="272" text-anchor="middle">from the request itself</text>
<text class="l" x="300" y="314" text-anchor="middle">3 · ARP Reply (unicast)</text>
<text class="m" x="300" y="332" text-anchor="middle">dst aa:aa:aa:aa:aa:aa</text>
<text class="m" x="300" y="350" text-anchor="middle">10.0.1.20 is at bb:bb:bb:bb:bb:bb</text>
<path class="arrow" d="M468 360 H133"/>
<rect class="ok" x="20" y="378" width="330" height="44" rx="10"/><text class="l" x="185" y="397" text-anchor="middle">4 · Cache the result</text><text class="m" x="185" y="414" text-anchor="middle">10.0.1.20 → bb:bb:bb:bb:bb:bb (REACHABLE)</text>
<text class="l" x="300" y="456" text-anchor="middle">IP packet, Ethernet dst bb:bb:bb:bb:bb:bb</text>
<path class="arrow" d="M132 468 H467"/>
</svg>
