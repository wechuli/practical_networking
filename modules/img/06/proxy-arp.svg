<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="t d"><title id="t">Proxy ARP</title><desc id="d">Host A (10.0.1.10) wants to reach Host C (10.0.2.50). Host A was configured with 10.0.1.10/8 instead of /24, so it thinks 10.0.2.50 is local and ARPs for it directly. Without proxy ARP, the broadcast "Who has 10.0.2.50?" reaches no one on the local /24 segment who has that IP; ARP fails and packets are dropped. With proxy ARP enabled on the router (10.0.1.1), which has a route to 10.0.2.0/24, the router replies "10.0.2.50 is at ROUTER_MAC"; Host A sends packets to ROUTER_MAC and the router forwards them to 10.0.2.50. Proxy ARP masks misconfiguration: it makes things work when they should not, which can hide real problems, so most networks disable it on routers facing ordinary LANs.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="618" rx="16"/>
<text class="s" x="24" y="32">Host A (10.0.1.10) wants to reach Host C (10.0.2.50).</text>
<text class="s" x="24" y="50">Host A was configured with 10.0.1.10/8 instead of /24, so it thinks 10.0.2.50 is on the local network</text>
<text class="s" x="24" y="68">and ARPs for it directly.</text>
<text class="zl" x="24" y="102">Without Proxy ARP</text>
<rect class="net" x="60" y="116" width="120" height="44" rx="10"/><text class="t" x="120" y="135" text-anchor="middle">Host A</text><text class="m" x="120" y="152" text-anchor="middle">10.0.1.10/8</text>
<rect class="box" x="340" y="116" width="200" height="44" rx="10"/><text class="t" x="440" y="135" text-anchor="middle">Local /24 segment</text><text class="s" x="440" y="152" text-anchor="middle">no one has 10.0.2.50</text>
<path class="line" d="M120 160 V230 M440 160 V230"/>
<text class="m" x="280" y="196" text-anchor="middle">ARP broadcast: Who has 10.0.2.50?</text>
<path class="arrow" d="M122 206 H437"/>
<path class="dash" d="M444 206 H566"/>
<rect class="warn" x="570" y="180" width="200" height="52" rx="10"/><text class="t" x="670" y="202" text-anchor="middle">ARP fails</text><text class="s" x="670" y="221" text-anchor="middle">Packets dropped</text>
<path class="line" d="M24 254 H776" stroke-dasharray="4 4"/>
<text class="zl" x="24" y="282">With Proxy ARP (router has it enabled)</text>
<rect class="net" x="60" y="296" width="120" height="60" rx="10"/><text class="t" x="120" y="322" text-anchor="middle">Host A</text><text class="m" x="120" y="340" text-anchor="middle">10.0.1.10/8</text>
<rect class="net" x="320" y="296" width="200" height="60" rx="10"/><text class="t" x="420" y="315" text-anchor="middle">Router</text><text class="m" x="420" y="332" text-anchor="middle">10.0.1.1</text><text class="s" x="420" y="349" text-anchor="middle">route to 10.0.2.0/24</text>
<rect class="net" x="620" y="296" width="140" height="60" rx="10"/><text class="t" x="690" y="322" text-anchor="middle">Host C</text><text class="m" x="690" y="340" text-anchor="middle">10.0.2.50</text>
<path class="line" d="M120 356 V516 M420 356 V516 M690 356 V516"/>
<text class="m" x="270" y="390" text-anchor="middle">ARP broadcast: Who has 10.0.2.50?</text>
<path class="arrow" d="M122 400 H417"/>
<text class="m" x="270" y="434" text-anchor="middle">10.0.2.50 is at ROUTER_MAC</text>
<path class="arrow" d="M418 444 H123"/>
<text class="m" x="270" y="478" text-anchor="middle">packets to ROUTER_MAC</text>
<path class="arrow" d="M122 488 H417"/>
<text class="l" x="555" y="478" text-anchor="middle">forwards to 10.0.2.50</text>
<path class="arrow" d="M423 488 H687"/>
<rect class="box" x="24" y="540" width="752" height="62" rx="10"/>
<text class="s" x="40" y="564">Proxy ARP masks misconfiguration. It makes things work when they should not. This can hide real</text>
<text class="s" x="40" y="584">problems. Most networks disable it on routers facing ordinary LANs.</text>
</svg>
