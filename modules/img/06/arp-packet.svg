<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 466" role="img" aria-labelledby="t d"><title id="t">ARP packet structure</title><desc id="d">An ARP packet for IPv4 over Ethernet is 28 bytes. The first 8 bytes: hardware type (2 bytes) = 0x0001 for Ethernet; protocol type (2 bytes) = 0x0800 for IPv4; hardware address length (1 byte) = 6, the MAC length; protocol address length (1 byte) = 4, the IPv4 length; operation (2 bytes) = 1 for request or 2 for reply. The next 20 bytes: sender hardware address (6 bytes) = the sender's MAC; sender protocol address (4 bytes) = the sender's IP; target hardware address (6 bytes) = the target's MAC, 00:00:00:00:00:00 in requests; target protocol address (4 bytes) = the target's IP.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="464" rx="16"/>
<text class="zl" x="24" y="32">ARP packet structure (28 bytes for IPv4 over Ethernet)</text>
<text class="s" x="60" y="56">Field</text><text class="s" x="290" y="56">Size</text><text class="s" x="400" y="56">Value</text>
<rect class="box" x="40" y="66" width="720" height="32" rx="10"/><text class="l" x="60" y="87">Hardware Type</text><text class="s" x="290" y="87">2 bytes</text><text class="m" x="400" y="87">0x0001 (Ethernet)</text>
<rect class="box" x="40" y="101" width="720" height="32" rx="10"/><text class="l" x="60" y="122">Protocol Type</text><text class="s" x="290" y="122">2 bytes</text><text class="m" x="400" y="122">0x0800 (IPv4)</text>
<rect class="box" x="40" y="136" width="720" height="32" rx="10"/><text class="l" x="60" y="157">Hardware Addr Len</text><text class="s" x="290" y="157">1 byte</text><text class="m" x="400" y="157">6 (MAC = 6 bytes)</text>
<rect class="box" x="40" y="171" width="720" height="32" rx="10"/><text class="l" x="60" y="192">Protocol Addr Len</text><text class="s" x="290" y="192">1 byte</text><text class="m" x="400" y="192">4 (IPv4 = 4 bytes)</text>
<rect class="box" x="40" y="206" width="720" height="32" rx="10"/><text class="l" x="60" y="227">Operation</text><text class="s" x="290" y="227">2 bytes</text><text class="m" x="400" y="227">1 (Request) or 2 (Reply)</text>
<text class="s" x="760" y="258" text-anchor="end">8 bytes so far</text>
<rect class="l2" x="40" y="270" width="720" height="32" rx="10"/><text class="l" x="60" y="291">Sender Hardware Address</text><text class="s" x="290" y="291">6 bytes</text><text class="m" x="400" y="291">Sender's MAC</text>
<rect class="l3" x="40" y="305" width="720" height="32" rx="10"/><text class="l" x="60" y="326">Sender Protocol Address</text><text class="s" x="290" y="326">4 bytes</text><text class="m" x="400" y="326">Sender's IP</text>
<rect class="l2" x="40" y="340" width="720" height="32" rx="10"/><text class="l" x="60" y="361">Target Hardware Address</text><text class="s" x="290" y="361">6 bytes</text><text class="m" x="400" y="361">Target's MAC (00:00:00:00:00:00 in requests)</text>
<rect class="l3" x="40" y="375" width="720" height="32" rx="10"/><text class="l" x="60" y="396">Target Protocol Address</text><text class="s" x="290" y="396">4 bytes</text><text class="m" x="400" y="396">Target's IP</text>
<text class="s" x="760" y="428" text-anchor="end">+ 20 bytes of addresses = 28 bytes</text>
<text class="s" x="40" y="452">Hardware addresses are MACs (layer 2); protocol addresses are IPv4 addresses (layer 3).</text>
</svg>
