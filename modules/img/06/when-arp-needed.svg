<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 750" role="img" aria-labelledby="t d"><title id="t">When is ARP needed?</title><desc id="d">Case 1, same subnet: Host A (10.0.1.10) sends to Host B (10.0.1.20), both on 10.0.1.0/24, so Host A ARPs for 10.0.1.20. The request "Who has 10.0.1.20?" goes through the switch to Host B, Host B replies "10.0.1.20 is at aa:bb:cc:dd:ee:ff", and Host A sends an Ethernet frame to that MAC. Case 2, different subnet: Host A sends to a server at 10.0.5.20; the routing table says the next hop is gateway 10.0.1.1, so Host A ARPs for 10.0.1.1, not 10.0.5.20. The gateway replies "10.0.1.1 is at 11:22:33:44:55:66", and Host A sends a frame with Ethernet destination 11:22:33:44:55:66 and IP destination 10.0.5.20. The gateway strips the Ethernet header, reads the IP destination and re-encapsulates the packet in a new frame for the next hop toward the server.</desc><style>.bg{fill:#f8fafc;stroke:#e2e8f0}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.net{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.5}.warn{fill:#fdecec;stroke:#dc2626;stroke-width:1.5}.ok{fill:#ecfdf3;stroke:#16a34a;stroke-width:1.5}.l2{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.l3{fill:#e0ecff;stroke:#2563eb;stroke-width:1.5}.l4{fill:#cffafe;stroke:#0891b2;stroke-width:1.5}.l7{fill:#f3e8ff;stroke:#9333ea;stroke-width:1.5}.zone{fill:none;stroke:#94a3b8;stroke-dasharray:6 4;stroke-width:1.5}text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#0f172a}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#475569}.l{font-size:12.5px;fill:#334155;font-weight:600}.m{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#0f172a}.zl{font-size:13px;fill:#475569;font-weight:600}.arrow{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}.dash{stroke:#b91c1c;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}.line{stroke:#334155;stroke-width:1.6;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect class="bg" x="1" y="1" width="798" height="748" rx="16"/>
<text class="zl" x="24" y="34">Case 1: Destination is on the same subnet</text>
<text class="s" x="24" y="58">Host A (10.0.1.10) wants to send to Host B (10.0.1.20)</text>
<text class="s" x="24" y="76">Both are on 10.0.1.0/24 — same subnet</text>
<text class="l" x="24" y="98">Host A needs Host B's MAC → ARP for 10.0.1.20</text>
<rect class="net" x="60" y="114" width="120" height="44" rx="10"/><text class="t" x="120" y="133" text-anchor="middle">Host A</text><text class="m" x="120" y="150" text-anchor="middle">10.0.1.10</text>
<rect class="net" x="270" y="114" width="120" height="44" rx="10"/><text class="t" x="330" y="141" text-anchor="middle">Switch</text>
<rect class="net" x="620" y="114" width="120" height="44" rx="10"/><text class="t" x="680" y="133" text-anchor="middle">Host B</text><text class="m" x="680" y="150" text-anchor="middle">10.0.1.20</text>
<path class="line" d="M120 158 V300 M330 158 V300 M680 158 V300"/>
<text class="m" x="225" y="188" text-anchor="middle">ARP: Who has 10.0.1.20?</text>
<path class="arrow" d="M122 196 H327"/><path class="arrow" d="M333 196 H677"/>
<text class="m" x="505" y="232" text-anchor="middle">ARP: 10.0.1.20 is at aa:bb:cc:dd:ee:ff</text>
<path class="arrow" d="M678 240 H123"/>
<text class="m" x="505" y="276" text-anchor="middle">Ethernet frame dst=aa:bb:cc:dd:ee:ff</text>
<path class="arrow" d="M122 284 H677"/>
<path class="line" d="M24 318 H776" stroke-dasharray="4 4"/>
<text class="zl" x="24" y="344">Case 2: Destination is on a different subnet</text>
<text class="s" x="24" y="368">Host A (10.0.1.10) wants to send to Server (10.0.5.20)</text>
<text class="s" x="24" y="386">Different subnets — routing table says next hop is gateway 10.0.1.1</text>
<text class="l" x="24" y="408">Host A needs the GATEWAY's MAC → ARP for 10.0.1.1 (not 10.0.5.20)</text>
<rect class="net" x="60" y="424" width="120" height="44" rx="10"/><text class="t" x="120" y="443" text-anchor="middle">Host A</text><text class="m" x="120" y="460" text-anchor="middle">10.0.1.10</text>
<rect class="net" x="400" y="424" width="160" height="44" rx="10"/><text class="t" x="480" y="443" text-anchor="middle">Gateway/Router</text><text class="m" x="480" y="460" text-anchor="middle">10.0.1.1</text>
<rect class="net" x="640" y="424" width="120" height="44" rx="10"/><text class="t" x="700" y="443" text-anchor="middle">Server</text><text class="m" x="700" y="460" text-anchor="middle">10.0.5.20</text>
<path class="line" d="M120 468 V640 M480 468 V640 M700 468 V640"/>
<text class="m" x="300" y="498" text-anchor="middle">ARP: Who has 10.0.1.1?</text>
<path class="arrow" d="M122 506 H477"/>
<text class="m" x="300" y="542" text-anchor="middle">ARP: 10.0.1.1 is at 11:22:33:44:55:66</text>
<path class="arrow" d="M478 550 H123"/>
<text class="m" x="300" y="586" text-anchor="middle">Frame dst=11:22:33:44:55:66, IP dst=10.0.5.20</text>
<path class="arrow" d="M122 594 H477"/>
<text class="l" x="590" y="618" text-anchor="middle">New frame, next hop</text>
<path class="arrow" d="M482 628 H697"/>
<rect class="box" x="24" y="656" width="752" height="76" rx="10"/>
<text class="s" x="40" y="680">Note: the Ethernet destination is the gateway's MAC, but the IP destination is the final server.</text>
<text class="s" x="40" y="698">The gateway strips the Ethernet header, looks at the IP destination, and re-encapsulates in a</text>
<text class="s" x="40" y="716">new frame for the next hop.</text>
</svg>
